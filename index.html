<style>
:root {
  --bg: #eff7ff;
  --bg-2: #fff7ee;
  --ink: #151d33;
  --muted: #3c4763;
  --muted-2: #566180;
  --card: #ffffff;
  --card-hover: #fdfdff;
  --panel: #ffffff;
  --stroke: #c6d5ec;
  --stroke-strong: #9db4d8;
  --accent: #4f8cff;
  --accent-2: #8b6cf6;
  --accent-3: #0c8f95;
  --correct: #0e9355;
  --correct-soft: #dcf7e9;
  --wrong: #e83b5b;
  --wrong-soft: #ffe3e9;
  --gold: #ffb020;
  --sun: #ffd166;
  --mint: #8de3c6;
  --peach: #ffb59e;
  --lilac: #c9b6ff;
  --radius: 22px;
  --shadow-lg: 0 28px 60px -32px rgba(46, 78, 145, 0.55);
  --shadow-sm: 0 14px 30px -20px rgba(46, 78, 145, 0.6);
  --pop: cubic-bezier(0.34, 1.56, 0.64, 1);
  --font-ui: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-head: var(--font-ui);
  --head-ink: #18213a;
  --btn-a: #2f6ad6;
  --btn-b: #5a49d6;
  --btn-edge: var(--btn-edge);
  --btn-ink: #ffffff;
  --page-bg: radial-gradient(120% 80% at 50% 0%, #f4fbff 0%, #eef6ff 45%, #fff7ef 100%);
  --blob-a: rgba(255, 209, 102, 0.55);
  --blob-b: rgba(139, 227, 198, 0.55);
  --blob-c: rgba(201, 182, 255, 0.6);
  --blob-d: rgba(255, 181, 158, 0.5);
  --dots: radial-gradient(rgba(88, 126, 190, 0.34) 1.6px, transparent 1.6px);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #eff7ff;
  color: var(--ink);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

body {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  background: var(--page-bg);
}

/* ---- Playful background ---- */
body::before {
  content: "";
  position: fixed;
  inset: -20%;
  background:
    radial-gradient(closest-side at 16% 14%, var(--blob-a), transparent 72%),
    radial-gradient(closest-side at 84% 10%, var(--blob-b), transparent 72%),
    radial-gradient(closest-side at 78% 86%, var(--blob-c), transparent 74%),
    radial-gradient(closest-side at 14% 82%, var(--blob-d), transparent 74%);
  filter: blur(34px);
  animation: drift 26s ease-in-out infinite alternate;
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image: var(--dots);
  background-size: 28px 28px;
  mask-image: radial-gradient(closest-side at 50% 45%, #000 25%, transparent 85%);
  -webkit-mask-image: radial-gradient(closest-side at 50% 45%, #000 25%, transparent 85%);
  pointer-events: none;
  z-index: 0;
}

@keyframes drift {
  from { transform: translate3d(-2%, -1%, 0) scale(1); }
  to   { transform: translate3d(3%, 2%, 0) scale(1.06); }
}

/* ---- Layout ---- */
#app {
  position: relative;
  z-index: 1;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: clamp(18px, 4vw, 44px);
}

.screen {
  flex: 1;
  width: 100%;
  max-width: 980px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  animation: screenIn 0.45s var(--pop) both;
}

@keyframes screenIn {
  from { opacity: 0; transform: translateY(16px) scale(0.99); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ---- Floating decorations ---- */
.deco {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.deco-item {
  position: absolute;
  left: var(--x, 8%);
  top: var(--y, 20%);
  font-size: calc(clamp(24px, 3.4vw, 40px) * var(--s, 1));
  line-height: 1;
  filter: drop-shadow(0 10px 16px rgba(60, 90, 150, 0.18));
  animation: bob 5.5s ease-in-out infinite;
  animation-delay: var(--d, 0s);
  opacity: 0.9;
}

@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-6deg); }
  50% { transform: translateY(-16px) rotate(8deg); }
}

/* ---- Brand ---- */
.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-weight: 800;
  letter-spacing: -0.02em;
  font-size: clamp(15px, 1.8vw, 18px);
}

.brand-mark {
  width: 44px;
  height: 44px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  background: linear-gradient(155deg, #ffe9a8 0%, #ffd071 40%, #ffab84 100%);
  color: #5a2f00;
  box-shadow:
    0 6px 0 #d98a2b,
    0 12px 20px -10px rgba(150, 90, 20, 0.55),
    inset 0 2px 0 rgba(255, 255, 255, 0.7),
    inset 0 -4px 8px rgba(160, 80, 10, 0.22);
  flex: 0 0 auto;
}

.brand-mark svg { width: 24px; height: 24px; }

/* ---- Splash ---- */
.screen.splash {
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 0;
}

.splash .brand-mark {
  width: 88px;
  height: 88px;
  border-radius: 30px;
  margin-bottom: 26px;
  box-shadow:
    0 10px 0 #d98a2b,
    0 34px 50px -26px rgba(240, 160, 75, 0.95),
    inset 0 3px 0 rgba(255, 255, 255, 0.7),
    inset 0 -6px 12px rgba(160, 80, 10, 0.22);
  animation: floaty 4.5s ease-in-out infinite;
}

.splash .brand-mark svg { width: 46px; height: 46px; }

@keyframes floaty {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-10px) rotate(4deg); }
}

.display-title {
  margin: 0;
  font-size: clamp(38px, 8.4vw, 80px);
  line-height: 1.02;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: #18213a;
  text-shadow: 0 4px 0 #ffffff, 0 12px 22px rgba(70, 106, 175, 0.22);
}

.tagline {
  margin: 16px 0 0;
  font-size: clamp(14px, 2.2vw, 19px);
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0.01em;
  max-width: 34ch;
}

.splash-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-top: 28px;
}

.badge {
  padding: 9px 16px;
  border-radius: 999px;
  border: 2px solid #cfe0f5;
  background: #ffffff;
  box-shadow: 0 4px 0 #c2d4ee, 0 12px 20px -14px rgba(46, 78, 145, 0.55);
  font-size: clamp(11px, 1.5vw, 13px);
  font-weight: 700;
  color: var(--muted);
}

.loader {
  width: min(78vw, 420px);
  margin-top: clamp(30px, 7vh, 56px);
}

.loader-track {
  height: 14px;
  border-radius: 999px;
  background: #e8f0fb;
  box-shadow: inset 0 2px 6px rgba(52, 88, 158, 0.28);
  overflow: hidden;
  position: relative;
}

.loader-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, #1fbf93, #2f74e8, #6a4ce0, #ff7a45);
  transition: width 0.09s linear;
}

.loader-label {
  margin-top: 14px;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted-2);
  font-weight: 800;
}

/* ---- Setup ---- */
.screen.setup {
  gap: clamp(20px, 4vh, 32px);
  justify-content: center;
}

.setup-header { text-align: center; }

.setup-header .brand { justify-content: center; margin-bottom: 20px; }

.headline {
  margin: 0;
  font-size: clamp(28px, 5.4vw, 46px);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  color: #18213a;
  text-shadow: 0 3px 0 #ffffff;
}

.sub {
  margin: 12px auto 0;
  max-width: 560px;
  color: var(--muted);
  font-size: clamp(13px, 1.9vw, 16px);
  line-height: 1.55;
  font-weight: 600;
}

.panel {
  border: 2px solid #d5e3f5;
  background: var(--panel);
  border-radius: calc(var(--radius) + 8px);
  padding: clamp(18px, 3vw, 30px);
  box-shadow: 0 8px 0 #c9d9f2, 0 30px 54px -30px rgba(46, 78, 145, 0.5);
  display: flex;
  flex-direction: column;
  gap: clamp(16px, 2.6vh, 24px);
}

.field {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.field-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.field-label {
  font-size: 11.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 800;
  color: #2456c4;
}

.field-hint {
  font-size: clamp(11px, 1.5vw, 12.5px);
  color: var(--muted-2);
  font-weight: 600;
}

.subject-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.subject-card {
  appearance: none;
  text-align: left;
  cursor: pointer;
  border-radius: 20px;
  border: 2px solid var(--stroke);
  background: #ffffff;
  color: var(--ink);
  padding: 14px 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  transition: transform 0.16s var(--pop), border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
  font-family: inherit;
  box-shadow: 0 3px 0 #d8e5f7;
}

.subject-card svg {
  width: 36px;
  height: 36px;
  padding: 8px;
  border-radius: 13px;
  color: #2456c4;
  background: #dbe8ff;
  transition: transform 0.16s var(--pop);
}

.subject-card:nth-child(2) svg { color: #a85410; background: #ffe6cc; }
.subject-card:nth-child(3) svg { color: #086f66; background: #d6f5ee; }
.subject-card:nth-child(4) svg { color: #5433bd; background: #e7ddff; }

.subject-card .name {
  font-size: clamp(13px, 1.7vw, 15px);
  font-weight: 800;
  letter-spacing: -0.01em;
}

.subject-card .blurb {
  font-size: 11.5px;
  line-height: 1.35;
  color: var(--muted-2);
}

.subject-card:hover {
  background: #ffffff;
  border-color: #cfe0f8;
  transform: translateY(-3px);
  box-shadow: 0 6px 0 #d8e5f7;
}

.subject-card:hover svg { transform: scale(1.08) rotate(-4deg); }

.subject-card.active {
  border-color: var(--accent);
  background: linear-gradient(160deg, #eef5ff, #ffffff);
  box-shadow: 0 5px 0 #c3daf9, 0 20px 30px -22px rgba(79, 140, 255, 0.95);
}

.subject-card.active .name { color: #2f5fd0; }

.grade-grid {
  display: grid;
  grid-template-columns: repeat(13, minmax(0, 1fr));
  gap: 8px;
}

.grade-pill {
  appearance: none;
  cursor: pointer;
  font-family: inherit;
  font-weight: 800;
  font-size: clamp(12px, 1.6vw, 14px);
  color: var(--muted);
  background: #ffffff;
  border: 2px solid var(--stroke);
  border-radius: 14px;
  padding: 11px 0;
  box-shadow: 0 3px 0 #d8e5f7;
  transition: transform 0.14s var(--pop), color 0.14s ease, border-color 0.14s ease, background 0.14s ease;
}

.grade-pill:hover {
  color: var(--ink);
  border-color: var(--stroke-strong);
  transform: translateY(-3px);
  box-shadow: 0 5px 0 #d8e5f7;
}

.grade-pill.active {
  color: var(--btn-ink);
  border-color: var(--btn-edge);
  background: linear-gradient(160deg, var(--btn-a), var(--btn-b));
  box-shadow: 0 4px 0 var(--btn-edge), 0 16px 24px -16px rgba(79, 110, 220, 0.95);
}

.count-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.count-btn {
  appearance: none;
  cursor: pointer;
  font-family: inherit;
  font-weight: 800;
  font-size: 13px;
  color: var(--muted);
  background: #ffffff;
  border: 2px solid var(--stroke);
  border-radius: 13px;
  padding: 9px 16px;
  box-shadow: 0 3px 0 #d8e5f7;
  transition: transform 0.14s var(--pop), color 0.14s ease, border-color 0.14s ease, background 0.14s ease;
  min-width: 56px;
}

.count-btn:hover { color: var(--ink); border-color: var(--stroke-strong); transform: translateY(-2px); }

.count-btn.active {
  color: #8a5200;
  background: linear-gradient(160deg, #fff2cf, #ffe6ad);
  border-color: #f7c15c;
  box-shadow: 0 3px 0 #f0c881;
}

.count-custom {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted-2);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.count-input {
  width: 82px;
  background: #ffffff;
  border: 2px solid var(--stroke);
  color: var(--ink);
  font-family: inherit;
  font-size: 14px;
  font-weight: 800;
  border-radius: 12px;
  padding: 9px 12px;
  text-align: center;
  box-shadow: inset 0 2px 4px rgba(70, 106, 175, 0.08);
}

.count-input:focus,
.subject-card:focus-visible,
.grade-pill:focus-visible,
.count-btn:focus-visible,
.btn-primary:focus-visible,
.btn-ghost:focus-visible,
.exit-btn:focus-visible,
.option-btn:focus-visible {
  outline: 3px solid rgba(24, 68, 176, 0.9);
  outline-offset: 3px;
}

.setup-footer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.site-foot {
  margin: 0 auto;
  max-width: 640px;
  text-align: center;
}

.site-foot-title {
  margin: 0 0 6px;
  font-size: clamp(13px, 1.8vw, 15px);
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--muted);
}

.site-foot-text {
  margin: 0 0 9px;
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1.7;
  color: var(--muted-2);
}

.site-foot .site-url {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 9px;
  border-radius: 999px;
  border: 2px solid var(--stroke);
  background: #ffffff;
  color: var(--muted);
  font-weight: 800;
}

.site-foot-links {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
}

.site-foot-links .site-url { margin-left: 0; }

.site-foot-link {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  border: 2px solid var(--stroke);
  background: #ffffff;
  color: var(--muted);
  font-weight: 800;
  text-decoration: none;
  transition: border-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
}

.site-foot-link:hover,
.site-foot-link:focus-visible {
  border-color: var(--stroke-strong);
  color: var(--ink);
  transform: translateY(-1px);
}

.noscript-note {
  max-width: 620px;
  margin: clamp(40px, 12vh, 110px) auto;
  padding: clamp(22px, 4vw, 34px);
  border: 2px solid var(--stroke);
  border-radius: 22px;
  background: #ffffff;
  box-shadow: var(--shadow-sm);
}

.noscript-note h1 { margin: 0 0 10px; font-size: clamp(22px, 4vw, 30px); color: var(--head-ink); }
.noscript-note p { margin: 0 0 8px; font-size: 15px; line-height: 1.6; color: var(--muted); }

/* ---- Buttons ---- */
.btn-primary {
  appearance: none;
  cursor: pointer;
  font-family: inherit;
  border: none;
  border-radius: 18px;
  padding: clamp(15px, 2.2vh, 19px) clamp(30px, 5vw, 46px);
  font-size: clamp(15px, 1.9vw, 17px);
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--btn-ink);
  background: linear-gradient(160deg, var(--btn-a), var(--btn-b));
  box-shadow: 0 6px 0 var(--btn-edge), 0 22px 34px -22px rgba(65, 95, 192, 0.95);
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: transform 0.14s var(--pop), box-shadow 0.14s ease, filter 0.14s ease;
}

.btn-primary svg { width: 17px; height: 17px; }

.btn-primary:hover {
  transform: translateY(-2px);
  filter: brightness(1.04);
  box-shadow: 0 8px 0 var(--btn-edge), 0 26px 38px -22px rgba(65, 95, 192, 1);
}

.btn-primary:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 var(--btn-edge), 0 10px 18px -14px rgba(65, 95, 192, 0.9);
}

.btn-primary.wide { width: 100%; max-width: 380px; justify-content: center; }

.btn-primary:disabled,
.btn-primary:disabled:hover {
  cursor: not-allowed;
  opacity: 0.55;
  filter: none;
  transform: none;
  box-shadow: 0 6px 0 #7f90b8;
}

.btn-ghost {
  appearance: none;
  cursor: pointer;
  font-family: inherit;
  border: 2px solid var(--stroke);
  background: #ffffff;
  color: var(--ink);
  border-radius: 18px;
  padding: clamp(14px, 2vh, 18px) clamp(22px, 4vw, 32px);
  font-size: clamp(14px, 1.8vw, 16px);
  font-weight: 800;
  box-shadow: 0 4px 0 #c9d9f2;
  transition: background 0.16s ease, transform 0.16s var(--pop), box-shadow 0.16s ease;
}

.btn-ghost:hover {
  background: #f7fbff;
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #c9d9f2;
}

.btn-ghost:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #c9d9f2;
}

/* ---- Quiz ---- */
.screen.quiz { gap: 14px; }

.quiz-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.quiz-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.exit-btn {
  appearance: none;
  cursor: pointer;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px 8px 11px;
  border-radius: 999px;
  font-size: clamp(11px, 1.6vw, 13px);
  font-weight: 800;
  color: #ad1f3d;
  background: #ffffff;
  border: 2px solid #ffb6c5;
  box-shadow: 0 3px 0 #ffcbda;
  transition: transform 0.14s var(--pop), background 0.14s ease, border-color 0.14s ease;
}

.exit-btn svg { width: 13px; height: 13px; }

.exit-btn:hover {
  background: #fff5f7;
  border-color: #ffb3c2;
  transform: translateY(-2px);
}

.exit-btn:active { transform: translateY(2px); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 14px;
  border-radius: 999px;
  font-size: clamp(11px, 1.6vw, 13px);
  font-weight: 800;
  letter-spacing: 0.01em;
  border: 2px solid var(--stroke);
  background: #ffffff;
  color: var(--ink);
  box-shadow: 0 3px 0 #d8e5f7;
  white-space: nowrap;
}

.chip.muted { color: var(--muted); font-weight: 700; }

.chip.streak {
  color: #8a5200;
  border-color: #ffd88a;
  background: linear-gradient(160deg, #fff6da, #ffeab5);
  box-shadow: 0 3px 0 #f6d894;
}

.chip.streak svg { width: 14px; height: 14px; }

.chip.streak.pulse { animation: pop 0.4s var(--pop); }

.chip.timer { color: var(--muted); font-variant-numeric: tabular-nums; }

@keyframes pop {
  0% { transform: scale(1); }
  45% { transform: scale(1.16); }
  100% { transform: scale(1); }
}

.progress-track {
  height: 14px;
  width: 100%;
  border-radius: 999px;
  background: #e8f0fb;
  box-shadow: inset 0 2px 6px rgba(52, 88, 158, 0.26);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, #1fbf93, #2f74e8, #6a4ce0, #ff7a45);
  transition: width 0.4s var(--pop);
}

.quiz-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: clamp(14px, 2.4vh, 20px);
  padding: clamp(4px, 2vh, 16px) 0;
}

.question-card {
  position: relative;
  border: 2px solid #d5e3f5;
  border-radius: calc(var(--radius) + 6px);
  background: #ffffff;
  padding: clamp(26px, 4.4vh, 46px) clamp(20px, 3.4vw, 40px) clamp(22px, 3.6vh, 36px);
  box-shadow: 0 8px 0 #c9d9f2, 0 30px 50px -32px rgba(46, 78, 145, 0.55);
  overflow: hidden;
  animation: cardIn 0.4s var(--pop) both;
}

.question-card::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 10px;
  background: linear-gradient(90deg, #1fbf93, #2f74e8, #6a4ce0, #ff7a45);
}

.question-card::after {
  content: "";
  position: absolute;
  right: -26px;
  bottom: -26px;
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 209, 102, 0.35), transparent 70%);
  pointer-events: none;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px) scale(0.99); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.q-tag {
  display: inline-block;
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 800;
  color: #086b66;
  background: #d3f6f0;
  padding: 5px 11px;
  border-radius: 999px;
  margin-bottom: 16px;
}

.q-figure {
  margin: 2px 0 16px;
  display: flex;
  justify-content: center;
}

.q-figure svg {
  width: 100%;
  max-width: 340px;
  height: auto;
  max-height: 180px;
}

.q-figure svg text {
  font-family: inherit;
}

html[data-grade-theme="senior"] .q-figure svg {
  max-width: 300px;
}

.question-text {
  font-size: clamp(19px, 3vw, 29px);
  font-weight: 800;
  line-height: 1.42;
  letter-spacing: -0.015em;
  margin: 0;
  color: #18213a;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option-btn {
  appearance: none;
  cursor: pointer;
  font-family: inherit;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  border-radius: 18px;
  border: 2px solid var(--stroke);
  background: #ffffff;
  color: var(--ink);
  padding: clamp(13px, 2.1vh, 18px) clamp(14px, 2vw, 20px);
  font-size: clamp(14px, 1.9vw, 17px);
  font-weight: 700;
  line-height: 1.35;
  box-shadow: 0 4px 0 #e9f0fb;
  transition: transform 0.14s var(--pop), border-color 0.14s ease, background 0.14s ease, box-shadow 0.14s ease;
  animation: optIn 0.35s var(--pop) both;
}

.option-btn:nth-child(2) { animation-delay: 0.04s; }
.option-btn:nth-child(3) { animation-delay: 0.08s; }
.option-btn:nth-child(4) { animation-delay: 0.12s; }

@keyframes optIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.option-btn:hover:not(:disabled) {
  background: #f9fcff;
  border-color: #7ba5df;
  transform: translateY(-3px);
  box-shadow: 0 7px 0 #e9f0fb;
}

.option-btn:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #e9f0fb;
}

.opt-key {
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 800;
  color: #2354c4;
  background: #dbe8ff;
  border: none;
  transition: all 0.16s ease;
}

.option-btn:nth-child(2) .opt-key { color: #5433bd; background: #e7ddff; }
.option-btn:nth-child(3) .opt-key { color: #086f66; background: #d6f5ee; }
.option-btn:nth-child(4) .opt-key { color: #7d4f00; background: #ffe9b8; }

.option-btn:hover:not(:disabled) .opt-key { transform: scale(1.06); }

.opt-text { flex: 1 1 auto; word-break: break-word; }

.opt-mark {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  opacity: 0;
  transition: opacity 0.15s ease;
}

.opt-mark svg { width: 22px; height: 22px; }

.options .option-btn.is-selected {
  border-color: #4f8cff;
  background: #eef4ff;
  box-shadow: 0 4px 0 #cfe0ff;
}

.options .option-btn.is-selected .opt-key {
  background: #4f8cff;
  color: #ffffff;
}

.option-btn.is-correct {
  background: var(--correct-soft);
  border-color: #6fdcae;
  color: #08402c;
  box-shadow: 0 4px 0 #bfeeda;
}

.option-btn.is-correct .opt-key {
  background: var(--correct);
  color: #ffffff;
}

.option-btn.is-correct .opt-mark { opacity: 1; color: var(--correct); }

.option-btn.is-wrong {
  background: var(--wrong-soft);
  border-color: #ffb0be;
  color: #661325;
  box-shadow: 0 4px 0 #ffd6dd;
}

.option-btn.is-wrong .opt-key {
  background: var(--wrong);
  color: #ffffff;
}

.option-btn.is-wrong .opt-mark { opacity: 1; color: var(--wrong); }

.option-btn.is-dim { opacity: 0.66; }

.option-btn:disabled { cursor: default; }

.feedback {
  min-height: 26px;
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: clamp(13px, 1.8vw, 15.5px);
  font-weight: 800;
  color: var(--muted);
  animation: optIn 0.3s var(--pop) both;
}

.feedback .fb-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
}

.feedback .fb-icon svg { width: 14px; height: 14px; }

.feedback.good { color: #0a7a48; }
.feedback.good .fb-icon { background: var(--correct-soft); color: var(--correct); }

.feedback.bad { color: #b81f3b; }
.feedback.bad .fb-icon { background: var(--wrong-soft); color: var(--wrong); }

.feedback.bad { flex-wrap: wrap; align-items: flex-start; row-gap: 9px; }
.feedback.bad > .fb-icon { margin-top: 2px; }

.fb-explain {
  flex: 1 1 100%;
  color: var(--ink);
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.55;
  text-align: left;
  background: #f5f9ff;
  border: 2px solid var(--stroke);
  border-radius: 15px;
  padding: 11px 14px;
  animation: optIn 0.35s var(--pop) both;
}

.fb-explain-head {
  font-size: 11px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  font-weight: 800;
  color: #1f5fd0;
  margin-bottom: 5px;
}

.fb-steps { margin: 0; padding-left: 19px; }
.fb-steps li { margin: 4px 0; }

.fb-tip { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); font-weight: 600; }

.review-why { margin-top: 7px; }
.review-why > summary { cursor: pointer; font-size: 12.5px; font-weight: 800; color: #1f5fd0; }
.review-why > summary:hover { text-decoration: underline; }
.review-why .fb-explain { margin-top: 8px; font-size: 13px; }

html[data-grade-theme="senior"] .fb-explain { background: #f7f9fc; border-color: #dfe6f0; }
html[data-grade-theme="senior"] .fb-explain-head,
html[data-grade-theme="senior"] .review-why > summary { color: #2b5f9e; }

.next-row {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.next-row.has-back { justify-content: space-between; }

.next-row .btn-ghost {
  padding: 12px 20px;
  font-size: 14px;
  border-radius: 15px;
}

.prev-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.prev-btn svg {
  width: 16px;
  height: 16px;
  transform: rotate(180deg);
}

.next-row .btn-primary { padding: 13px 26px; font-size: 14.5px; border-radius: 15px; }

.kbd-hint {
  text-align: center;
  font-size: 11.5px;
  color: var(--muted-2);
  letter-spacing: 0.04em;
  font-weight: 700;
}

kbd {
  font-family: inherit;
  font-size: 11px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 7px;
  border: 2px solid var(--stroke);
  background: #ffffff;
  color: var(--muted);
  box-shadow: 0 2px 0 #c9d9f2;
}

/* ---- Results ---- */
.screen.results {
  justify-content: center;
  align-items: center;
  gap: clamp(18px, 3vh, 26px);
  text-align: center;
}

.score-ring {
  position: relative;
  width: clamp(150px, 30vw, 190px);
  height: clamp(150px, 30vw, 190px);
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 8px 0 #c9d9f2, 0 26px 40px -28px rgba(46, 78, 145, 0.6);
}

.score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }

.ring-bg { fill: none; stroke: #dbe6f8; stroke-width: 11; }

.ring-fill {
  fill: none;
  stroke: url(#ringGrad);
  stroke-width: 11;
  stroke-linecap: round;
  stroke-dasharray: 283;
  stroke-dashoffset: 283;
  transition: stroke-dashoffset 1.1s cubic-bezier(0.22, 1, 0.36, 1);
}

.ring-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}

.ring-pct {
  font-size: clamp(30px, 6vw, 42px);
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1;
  color: #18213a;
}

.ring-sub {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 800;
  color: var(--muted-2);
}

.results-title {
  margin: 0;
  font-size: clamp(24px, 4.4vw, 36px);
  font-weight: 800;
  letter-spacing: -0.03em;
  color: #18213a;
  text-shadow: 0 3px 0 #ffffff;
}

.results-msg {
  margin: 8px auto 0;
  color: var(--muted);
  font-weight: 600;
  font-size: clamp(13px, 1.9vw, 16px);
  max-width: 520px;
  line-height: 1.5;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  width: 100%;
  max-width: 620px;
}

.stat {
  border: 2px solid #dbe7f8;
  background: #ffffff;
  border-radius: 18px;
  padding: 14px 10px;
  box-shadow: 0 4px 0 #c9d9f2;
}

.stat:nth-child(1) { background: #eefbf4; box-shadow: 0 4px 0 #ccefdd; }
.stat:nth-child(2) { background: #fff0f3; box-shadow: 0 4px 0 #ffd7de; }
.stat:nth-child(3) { background: #fff8e6; box-shadow: 0 4px 0 #f7e3b4; }
.stat:nth-child(4) { background: #eff3ff; box-shadow: 0 4px 0 #d7e0fb; }

.stat-value {
  font-size: clamp(16px, 2.6vw, 21px);
  font-weight: 800;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  color: #18213a;
}

.stat-label {
  margin-top: 4px;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 800;
  color: var(--muted-2);
}

.review {
  width: 100%;
  max-width: 620px;
  text-align: left;
  border: 2px solid #dbe7f8;
  background: #ffffff;
  border-radius: 20px;
  padding: 16px 18px;
  max-height: 32vh;
  overflow-y: auto;
  box-shadow: 0 6px 0 #c9d9f2;
}

.review-title {
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 800;
  color: var(--muted-2);
  margin-bottom: 10px;
}

.review-item {
  padding: 10px 0;
  border-top: 2px solid #e2ebf9;
  font-size: 13px;
  line-height: 1.45;
}

.review-item:first-of-type { border-top: none; }

.review-q { color: var(--ink); font-weight: 700; margin-bottom: 5px; }

.review-answers { color: var(--muted); font-size: 12.5px; font-weight: 600; }

.review-answers .bad { color: #b81f3b; font-weight: 800; }
.review-answers .good { color: #0a7a48; font-weight: 800; }

.review-perfect {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

/* ---- Exit dialog ---- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(38, 58, 96, 0.34);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  animation: fadeIn 0.18s ease both;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.modal {
  width: min(400px, 100%);
  background: #ffffff;
  border-radius: 28px;
  padding: 26px 24px 24px;
  text-align: center;
  box-shadow: 0 12px 0 #c9d9f2, 0 40px 70px -30px rgba(38, 58, 96, 0.7);
  animation: modalIn 0.3s var(--pop) both;
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(16px) scale(0.94); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-emoji {
  font-size: 40px;
  line-height: 1;
  margin-bottom: 12px;
}

.modal-title {
  margin: 0;
  font-size: clamp(20px, 3.4vw, 25px);
  font-weight: 800;
  letter-spacing: -0.02em;
  color: #18213a;
}

.modal-text {
  margin: 10px 0 22px;
  font-size: 14px;
  line-height: 1.5;
  font-weight: 600;
  color: var(--muted);
}

.modal-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.modal-actions .btn-primary,
.modal-actions .btn-ghost {
  width: 100%;
  justify-content: center;
  padding: 14px 20px;
  font-size: 15px;
}

/* ---- Confetti ---- */
.confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 5;
}

.confetti span {
  position: absolute;
  top: -14px;
  width: 9px;
  height: 14px;
  border-radius: 3px;
  opacity: 0.95;
  animation: fall linear forwards;
}

@keyframes fall {
  0% { transform: translate3d(0, -10vh, 0) rotate(0deg); opacity: 1; }
  100% { transform: translate3d(var(--dx, 0px), 110vh, 0) rotate(720deg); opacity: 0.15; }
}

/* ---- Live strip: clock, weather, population, visits ---- */
.screen.setup { position: relative; }

.live-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, max-content));
  justify-content: end;
  align-items: stretch;
  gap: 6px;
  width: 100%;
  margin: 0 0 clamp(8px, 1.6vh, 16px);
}

.live-tile {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  text-align: left;
  padding: 7px 10px;
  border: 2px solid var(--stroke);
  border-radius: 13px;
  background: #ffffff;
  box-shadow: 0 2px 0 #d8e5f7;
}

.live-emoji {
  flex: 0 0 auto;
  font-size: 16px;
  line-height: 1;
}

.live-body { min-width: 0; }

.live-value {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.live-label {
  margin-top: 1px;
  font-size: 8.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-weight: 800;
  color: var(--muted-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.live-tile.is-button {
  appearance: none;
  cursor: pointer;
  font-family: inherit;
  transition: transform 0.14s var(--pop), border-color 0.14s ease, background 0.14s ease;
}

.live-tile.is-button:hover {
  transform: translateY(-2px);
  border-color: var(--stroke-strong);
  background: #f9fcff;
}

.live-tile.is-button:focus-visible {
  outline: 3px solid rgba(24, 68, 176, 0.9);
  outline-offset: 2px;
}

.live-tile.is-loading .live-value { color: var(--muted); }

html[data-grade-theme="kids"] .live-tile { border-width: 3px; border-radius: 14px; }
html[data-grade-theme="senior"] .live-tile { border-width: 1px; border-radius: 8px; box-shadow: none; }

@media (max-width: 760px) {
  .live-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .live-strip .live-tile { padding: 8px 10px; }
}

/* ---- Saved quizzes (bottom-right arrow) ---- */
.saved-fab {
  position: fixed;
  right: clamp(14px, 3vw, 26px);
  bottom: clamp(14px, 3vw, 26px);
  z-index: 20;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 12px 17px;
  border: 2px solid var(--btn-edge);
  border-radius: 999px;
  background: linear-gradient(160deg, var(--btn-a), var(--btn-b));
  color: var(--btn-ink);
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 6px 0 var(--btn-edge), 0 20px 30px -18px rgba(65, 95, 192, 0.95);
  transition: transform 0.16s var(--pop), opacity 0.2s ease, box-shadow 0.16s ease;
}

.saved-fab svg { width: 16px; height: 16px; }

.saved-fab:hover { transform: translateY(-3px); box-shadow: 0 8px 0 var(--btn-edge), 0 24px 34px -18px rgba(65, 95, 192, 1); }
.saved-fab:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--btn-edge); }
.saved-fab.is-hidden { opacity: 0; pointer-events: none; transform: translateY(24px) scale(0.9); }
.saved-fab:focus-visible { outline: 3px solid rgba(24, 68, 176, 0.9); outline-offset: 3px; }

.saved-count {
  min-width: 21px;
  height: 21px;
  padding: 0 6px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  background: #ffd166;
  color: #5a2f00;
  font-size: 11.5px;
  font-weight: 800;
}

.saved-count[hidden] { display: none; }

.saved-scrim {
  position: fixed;
  inset: 0;
  z-index: 24;
  background: rgba(38, 58, 96, 0.28);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.24s ease;
}

.saved-scrim.is-open { opacity: 1; pointer-events: auto; }

.saved-drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 25;
  width: min(370px, 92vw);
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
  background: #ffffff;
  border-radius: 28px 0 0 28px;
  box-shadow: -34px 0 60px -34px rgba(38, 58, 96, 0.6);
  transform: translateX(104%);
  transition: transform 0.34s var(--pop);
  overscroll-behavior: contain;
}

.saved-drawer.is-open { transform: translateX(0); }

.saved-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.saved-title { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; color: #18213a; }
.saved-sub { margin: 5px 0 0; font-size: 12px; line-height: 1.4; font-weight: 600; color: var(--muted); }

.saved-close {
  appearance: none;
  cursor: pointer;
  font-family: inherit;
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  border-radius: 12px;
  border: 2px solid var(--stroke);
  background: #ffffff;
  color: var(--muted);
  display: grid;
  place-items: center;
  box-shadow: 0 3px 0 #d8e5f7;
  transition: transform 0.14s var(--pop), background 0.14s ease;
}

.saved-close svg { width: 13px; height: 13px; }
.saved-close:hover { background: #f2f8ff; transform: translateY(-2px); }
.saved-close:focus-visible { outline: 3px solid rgba(24, 68, 176, 0.9); outline-offset: 2px; }

.saved-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

.saved-item {
  border: 2px solid var(--stroke);
  border-radius: 18px;
  background: #ffffff;
  padding: 12px 13px 13px;
  box-shadow: 0 3px 0 #d8e5f7;
  animation: optIn 0.3s var(--pop) both;
}

.saved-item-title { font-size: 13.5px; font-weight: 800; color: #18213a; }
.saved-item-meta { margin-top: 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.saved-mini-track { height: 8px; border-radius: 999px; background: #d8e5f7; overflow: hidden; margin: 9px 0 8px; }
.saved-mini-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #8de3c6, #4f8cff, #8b6cf6); }

.saved-actions { display: flex; gap: 8px; margin-top: 10px; }

.saved-resume {
  flex: 1;
  appearance: none;
  cursor: pointer;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: 13px;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 800;
  color: var(--btn-ink);
  background: linear-gradient(160deg, var(--btn-a), var(--btn-b));
  box-shadow: 0 4px 0 var(--btn-edge);
  transition: transform 0.14s var(--pop), box-shadow 0.14s ease;
}

.saved-resume svg { width: 14px; height: 14px; }
.saved-resume:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--btn-edge); }
.saved-resume:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--btn-edge); }
.saved-resume:focus-visible { outline: 3px solid rgba(24, 68, 176, 0.9); outline-offset: 2px; }

.saved-remove {
  appearance: none;
  cursor: pointer;
  font-family: inherit;
  width: 42px;
  border-radius: 13px;
  border: 2px solid #ffb6c5;
  background: #ffffff;
  color: #ad1f3d;
  display: grid;
  place-items: center;
  box-shadow: 0 4px 0 #ffcbda;
  transition: transform 0.14s var(--pop), background 0.14s ease;
}

.saved-remove svg { width: 13px; height: 13px; }
.saved-remove:hover { background: #fff5f7; transform: translateY(-2px); }
.saved-remove:focus-visible { outline: 3px solid rgba(184, 31, 59, 0.75); outline-offset: 2px; }

.saved-empty { text-align: center; padding: 34px 16px; color: var(--muted); font-size: 13px; font-weight: 600; line-height: 1.55; }
.saved-empty .emoji { display: block; font-size: 40px; margin-bottom: 12px; }

@media (max-width: 420px) {
  .saved-fab-label { display: none; }
  .saved-fab { padding: 12px 14px; }
}

/* ---- Drawing board (bottom-left) ---- */
.draw-fab {
  position: fixed;
  left: clamp(14px, 3vw, 26px);
  bottom: clamp(14px, 3vw, 26px);
  z-index: 20;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 12px 17px;
  border: 2px solid var(--stroke-strong);
  border-radius: 999px;
  background: linear-gradient(160deg, #ffffff, #eef4ff);
  color: #24407a;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 0 #c3d5f0, 0 18px 28px -20px rgba(65, 95, 192, 0.9);
  transition: transform 0.16s var(--pop), box-shadow 0.16s ease, background 0.2s ease, color 0.2s ease;
}

.draw-fab svg { width: 17px; height: 17px; }
.draw-fab:hover { transform: translateY(-3px); }
.draw-fab:active { transform: translateY(2px); box-shadow: 0 1px 0 #c3d5f0; }
.draw-fab.is-open { background: linear-gradient(160deg, var(--btn-a), var(--btn-b)); border-color: var(--btn-edge); color: var(--btn-ink); }
.draw-fab:focus-visible { outline: 3px solid rgba(24, 68, 176, 0.9); outline-offset: 3px; }

.draw-panel {
  position: fixed;
  left: clamp(14px, 3vw, 26px);
  bottom: calc(clamp(14px, 3vw, 26px) + 56px);
  z-index: 23;
  width: min(400px, calc(100vw - 28px));
  padding: 12px;
  border: 2px solid var(--stroke);
  border-radius: 18px;
  background: #ffffff;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  gap: 10px;
  contain: layout paint;
}

/* Freeze the drifting background while the board is open: repainting it under
   the canvas is what made drawing feel laggy on slower devices. */
body.doodle-open::before,
body.doodle-open .deco-item { animation-play-state: paused; }

.draw-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.draw-title {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--muted);
}

.draw-title svg { width: 15px; height: 15px; }
.draw-actions { display: flex; align-items: center; gap: 8px; }

.draw-btn {
  appearance: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 800;
  padding: 7px 12px;
  border: 2px solid var(--stroke);
  border-radius: 10px;
  background: #f5f9ff;
  color: var(--muted);
}

.draw-btn:hover { border-color: var(--stroke-strong); color: var(--ink); }
.draw-btn:focus-visible { outline: 3px solid rgba(24, 68, 176, 0.9); outline-offset: 2px; }
.draw-close { padding: 6px; display: grid; place-items: center; }
.draw-close svg { width: 14px; height: 14px; }

.draw-canvas {
  display: block;
  width: 100%;
  height: 220px;
  border: 2px dashed var(--stroke);
  border-radius: 12px;
  background: #fffefb;
  touch-action: none;
  cursor: crosshair;
}

.draw-fab[hidden],
.draw-panel[hidden] { display: none; }

@media (max-width: 480px) {
  .draw-fab-label { display: none; }
  .draw-fab { padding: 12px 14px; }
  .draw-canvas { height: 170px; }
}

/* ---- Responsive ---- */
@media (max-width: 760px) {
  .subject-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grade-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .deco-item:nth-child(n+5) { display: none; }
}

@media (max-width: 480px) {
  .count-custom { margin-left: 0; width: 100%; justify-content: flex-start; }
  .quiz-top { gap: 8px; }
  .chip { padding: 8px 12px; }
  .exit-btn { padding: 8px 12px 8px 10px; }
  .next-row { justify-content: stretch; }
  .next-row .btn-primary { width: 100%; justify-content: center; }
  .next-row.has-back { justify-content: space-between; gap: 8px; }
  .next-row.has-back .btn-primary { width: auto; flex: 1 1 auto; min-width: 0; padding: 12px 12px; }
  .next-row.has-back .btn-ghost { flex: 0 0 auto; padding: 12px 12px; }
  .review { max-height: 36vh; }
  .deco-item:nth-child(n+3) { display: none; }
}

@media (max-width: 560px) {
  .saved-fab-label,
  .draw-fab-label { display: none; }
  .saved-fab,
  .draw-fab { padding: 12px 14px; }
  .saved-fab { right: 14px; bottom: 14px; }
  .draw-fab { left: auto; right: 14px; bottom: 74px; }
  .screen.quiz { padding-bottom: 140px; }
  .kbd-hint { display: none; }
}

@media (orientation: landscape) and (max-height: 520px) {
  .quiz-body { gap: 10px; padding: 0; }
  .question-card { padding: 20px 20px 18px; }
  .option-btn { padding: 10px 14px; }
  .feedback { min-height: 18px; }
  .kbd-hint { display: none; }
  .question-card::before { height: 6px; }
}


/* ---- Grade-band themes ---------------------------------------------------- */
.display-title,
.headline,
.results-title,
.question-text,
.modal-title,
.saved-title {
  font-family: var(--font-head);
}

/* Grades 1-2: chunky, sunny, very playful */
html[data-grade-theme="kids"] {
  --ink: #1c2340;
  --muted: #414d70;
  --muted-2: #566180;
  --accent: #ff7f9e;
  --accent-2: #ffb020;
  --accent-3: #129c9c;
  --stroke: #f8ccd8;
  --stroke-strong: #f0a8bd;
  --page-bg: radial-gradient(120% 80% at 50% 0%, #fff9ef 0%, #fff2f6 45%, #eefaff 100%);
  --blob-a: rgba(255, 214, 102, 0.8);
  --blob-b: rgba(255, 159, 190, 0.65);
  --blob-c: rgba(150, 226, 255, 0.65);
  --blob-d: rgba(163, 240, 200, 0.6);
  --dots: radial-gradient(rgba(232, 128, 164, 0.32) 2px, transparent 2px);
  --btn-a: #ffb020;
  --btn-b: #ff8a3d;
  --btn-edge: #c97410;
  --btn-ink: #46260a;
  --radius: 26px;
}

html[data-grade-theme="kids"] body::after { background-size: 26px 26px; }
html[data-grade-theme="kids"] .q-tag { background: #ffe9b8; color: #7d4f00; font-size: 12px; }
html[data-grade-theme="kids"] .q-tag::before { content: "\2b50  "; }
html[data-grade-theme="kids"] .question-text { font-size: clamp(21px, 3.2vw, 32px); }
html[data-grade-theme="kids"] .question-card {
  border-width: 3px;
  border-color: #ffd3e0;
  box-shadow: 0 10px 0 #ffe0ea, 0 26px 44px -30px rgba(190, 100, 130, 0.45);
}
html[data-grade-theme="kids"] .question-card::before {
  height: 14px;
  background: linear-gradient(90deg, #ffd166, #ff9fbe, #9fe4ff, #a3f0c8);
}
html[data-grade-theme="kids"] .question-card::after {
  content: "\1f388";
  right: 16px;
  bottom: 12px;
  width: auto;
  height: auto;
  font-size: 26px;
  background: none;
  opacity: 0.55;
}
html[data-grade-theme="kids"] .panel {
  border-width: 3px;
  border-color: #ffe0ea;
  box-shadow: 0 10px 0 #ffe0ea, 0 30px 54px -30px rgba(190, 100, 130, 0.4);
}
html[data-grade-theme="kids"] .option-btn {
  border-width: 3px;
  border-radius: 22px;
  box-shadow: 0 6px 0 #ffe3ee;
}
html[data-grade-theme="kids"] .option-btn:hover:not(:disabled) { box-shadow: 0 9px 0 #ffe3ee; }
html[data-grade-theme="kids"] .opt-key { width: 40px; height: 40px; border-radius: 14px; font-size: 15px; }
html[data-grade-theme="kids"] .chip,
html[data-grade-theme="kids"] .badge,
html[data-grade-theme="kids"] .subject-card,
html[data-grade-theme="kids"] .grade-pill,
html[data-grade-theme="kids"] .count-btn { border-width: 3px; }
html[data-grade-theme="kids"] .btn-primary { border-radius: 24px; }
html[data-grade-theme="kids"] .saved-fab,
html[data-grade-theme="kids"] .saved-resume { border-radius: 22px; }

/* Grades 3-5: the bright default, slightly calmer */
html[data-grade-theme="junior"] {
  --radius: 20px;
}
html[data-grade-theme="junior"] .question-text { font-size: clamp(19px, 2.9vw, 28px); }

/* Grades 6-8: cooler, flatter, no doodles */
html[data-grade-theme="middle"] {
  --ink: #1a2436;
  --muted: #43506a;
  --muted-2: #5d6a85;
  --head-ink: #16202f;
  --accent: #3f57a8;
  --accent-2: #4a5fa8;
  --accent-3: #2b7f8f;
  --stroke: #cfd9e8;
  --stroke-strong: #a9b8ce;
  --page-bg: radial-gradient(120% 80% at 50% 0%, #f8fbfe 0%, #f1f6fb 50%, #edf2f8 100%);
  --blob-a: rgba(186, 204, 230, 0.5);
  --blob-b: rgba(198, 216, 228, 0.5);
  --blob-c: rgba(208, 208, 230, 0.5);
  --blob-d: rgba(218, 208, 202, 0.4);
  --dots: radial-gradient(rgba(120, 143, 176, 0.2) 1.4px, transparent 1.4px);
  --btn-a: #35558f;
  --btn-b: #4a4f8c;
  --btn-edge: #223a61;
  --radius: 16px;
}
html[data-grade-theme="middle"] .deco { display: none; }
html[data-grade-theme="middle"] .display-title,
html[data-grade-theme="middle"] .headline,
html[data-grade-theme="middle"] .results-title { text-shadow: none; }
html[data-grade-theme="middle"] .question-card,
html[data-grade-theme="middle"] .panel,
html[data-grade-theme="middle"] .review,
html[data-grade-theme="middle"] .stat {
  box-shadow: 0 4px 0 #dbe4f0, 0 22px 40px -32px rgba(30, 50, 80, 0.35);
}
html[data-grade-theme="middle"] .option-btn { border-radius: 13px; box-shadow: 0 3px 0 #dfe7f2; }
html[data-grade-theme="middle"] .opt-key { border-radius: 9px; }
html[data-grade-theme="middle"] .chip.streak { background: #fff8e6; border-color: #efd59a; box-shadow: 0 3px 0 #efdfae; }

/* Grades 9-12: formal, academic, restrained */
html[data-grade-theme="senior"] {
  --ink: #1b2233;
  --muted: #46506a;
  --muted-2: #5f6a83;
  --head-ink: #131a29;
  --accent: #31507d;
  --accent-2: #3d557d;
  --accent-3: #2f6b73;
  --stroke: #d2dae6;
  --stroke-strong: #a8b6c9;
  --page-bg: linear-gradient(180deg, #f8fafc 0%, #f2f5f9 100%);
  --blob-a: rgba(206, 216, 230, 0.35);
  --blob-b: rgba(206, 220, 224, 0.3);
  --blob-c: rgba(214, 214, 228, 0.3);
  --blob-d: rgba(222, 214, 208, 0.25);
  --dots: none;
  --btn-a: #22314d;
  --btn-b: #334765;
  --btn-edge: #131e33;
  --radius: 10px;
  --font-head: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
}
html[data-grade-theme="senior"] body::before { opacity: 0.55; }
html[data-grade-theme="senior"] .deco { display: none; }
html[data-grade-theme="senior"] .display-title,
html[data-grade-theme="senior"] .headline,
html[data-grade-theme="senior"] .results-title { text-shadow: none; letter-spacing: -0.01em; }
html[data-grade-theme="senior"] .question-text { font-weight: 600; letter-spacing: 0; font-size: clamp(18px, 2.7vw, 26px); }
html[data-grade-theme="senior"] .question-card,
html[data-grade-theme="senior"] .panel {
  border-width: 1px;
  border-color: #d2dae6;
  border-radius: 10px;
  box-shadow: 0 10px 28px -22px rgba(24, 36, 56, 0.55);
}
html[data-grade-theme="senior"] .question-card::before { height: 4px; background: #31507d; }
html[data-grade-theme="senior"] .question-card::after { display: none; }
html[data-grade-theme="senior"] .q-tag { background: #eef2f7; color: #3f5a7a; letter-spacing: 0.16em; }
html[data-grade-theme="senior"] .option-btn {
  border-width: 1px;
  border-radius: 8px;
  box-shadow: none;
  font-weight: 600;
}
html[data-grade-theme="senior"] .option-btn:hover:not(:disabled) {
  transform: none;
  box-shadow: none;
  background: #f6f8fb;
  border-color: var(--stroke-strong);
}
html[data-grade-theme="senior"] .option-btn:active:not(:disabled) { transform: none; box-shadow: none; }
html[data-grade-theme="senior"] .option-btn .opt-key {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: #f1f4f9;
  color: #42526b;
  font-size: 12px;
  border: 1px solid #dbe3ee;
}
html[data-grade-theme="senior"] .chip {
  border-width: 1px;
  border-radius: 8px;
  box-shadow: none;
  font-weight: 700;
}
html[data-grade-theme="senior"] .chip.streak { background: #fffaf0; border-color: #e6d6b4; box-shadow: none; }
html[data-grade-theme="senior"] .grade-pill,
html[data-grade-theme="senior"] .count-btn,
html[data-grade-theme="senior"] .subject-card {
  border-width: 1px;
  border-radius: 8px;
  box-shadow: none;
}
html[data-grade-theme="senior"] .subject-card svg { border-radius: 8px; }
html[data-grade-theme="senior"] .subject-card:hover { transform: none; box-shadow: none; background: #f7fafd; }
html[data-grade-theme="senior"] .btn-primary,
html[data-grade-theme="senior"] .btn-ghost,
html[data-grade-theme="senior"] .saved-fab,
html[data-grade-theme="senior"] .saved-resume,
html[data-grade-theme="senior"] .exit-btn,
html[data-grade-theme="senior"] .saved-close,
html[data-grade-theme="senior"] .saved-remove { border-radius: 8px; box-shadow: none; }
html[data-grade-theme="senior"] .btn-primary:hover { transform: none; box-shadow: none; filter: brightness(1.15); }
html[data-grade-theme="senior"] .btn-primary:active { transform: none; box-shadow: none; }
html[data-grade-theme="senior"] .btn-ghost:hover,
html[data-grade-theme="senior"] .saved-fab:hover,
html[data-grade-theme="senior"] .saved-resume:hover,
html[data-grade-theme="senior"] .exit-btn:hover,
html[data-grade-theme="senior"] .saved-close:hover,
html[data-grade-theme="senior"] .saved-remove:hover { transform: none; box-shadow: none; }
html[data-grade-theme="senior"] .stat,
html[data-grade-theme="senior"] .review {
  background: #ffffff;
  border-width: 1px;
  border-color: #dbe3ee;
  border-radius: 8px;
  box-shadow: none;
}
html[data-grade-theme="senior"] .review-item { border-top-color: #eef2f7; }
html[data-grade-theme="senior"] .progress-track { height: 6px; border-radius: 4px; }
html[data-grade-theme="senior"] .progress-fill { background: #31507d; border-radius: 4px; }
html[data-grade-theme="senior"] .score-ring { box-shadow: none; border: 1px solid #dbe3ee; }
html[data-grade-theme="senior"] .ring-fill { stroke: #31507d; }
html[data-grade-theme="senior"] .saved-drawer { border-radius: 12px 0 0 12px; }
html[data-grade-theme="senior"] .modal { border-radius: 12px; box-shadow: 0 20px 50px -30px rgba(24, 36, 56, 0.6); }

<div id="app"></div>

<noscript>
  <div class="noscript-note">
    <h1>The Quiz Book</h1>
    <p>Free practice quizzes for kindergarten through grade 12 in math, reading, science and social studies at <strong>quizbookcentral.com</strong> &mdash; thousands of auto-generated questions for classrooms, homework and home practice.</p>
    <p>This activity needs JavaScript enabled in your browser to play.</p>
  </div>
</noscript>

<script>
// ===========================================================================
// Helpers
// ===========================================================================

function randInt(min, max) { // inclusive both ends
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function choice(arr) { return arr[randInt(0, arr.length - 1)]; }
function sampleTwo(min, max) {
  // random.sample(range(min,max+1), 2) equivalent - two distinct ints
  let a = randInt(min, max), b = randInt(min, max);
  while (b === a) b = randInt(min, max);
  return [a, b];
}
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }

class Frac {
  constructor(n, d) {
    if (d === 0) d = 1;
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d) || 1;
    this.n = n / g; this.d = d / g;
  }
  add(o) { return new Frac(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { return new Frac(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { return new Frac(this.n * o.n, this.d * o.d); }
  div(o) { return new Frac(this.n * o.d, this.d * o.n); }
  toString() { return this.d === 1 ? `${this.n}` : `${this.n}/${this.d}`; }
  eq(o) { return this.n === o.n && this.d === o.d; }
}
function fmt(x) { return (x instanceof Frac) ? x.toString() : String(x); }

function collectWrongs(candidateFn, correct, count = 3, maxTries = 300, exclude = []) {
  const wrongs = new Set();
  const excludeSet = new Set(exclude);
  const correctS = fmt(correct);
  let tries = 0;
  while (wrongs.size < count && tries < maxTries) {
    const c = candidateFn();
    tries++;
    const cS = fmt(c);
    if (cS !== correctS && !excludeSet.has(cS)) wrongs.add(cS);
  }
  return Array.from(wrongs);
}

function intWrongs(correct, spread = 10, allowNegative = false) {
  return collectWrongs(() => {
    const c = correct + randInt(-spread, spread);
    return allowNegative ? c : Math.max(0, c);
  }, correct);
}

function pickFromPool(pool, correct) {
  const options = pool.filter(v => v !== correct);
  for (let i = options.length - 1; i > 0; i--) {
    const j = randInt(0, i);
    [options[i], options[j]] = [options[j], options[i]];
  }
  return options.slice(0, 3);
}

function round1(x) { return Math.round(x * 10) / 10; }

// ===========================================================================
// GRADE 1
// ===========================================================================

function g1_addition() {
  const a = randInt(1, 10), b = randInt(1, 10);
  const correct = a + b;
  return [`What is ${a} + ${b}?`, String(correct), intWrongs(correct, 4)];
}
function g1_subtraction() {
  const a = randInt(5, 20), b = randInt(1, a);
  const correct = a - b;
  return [`What is ${a} - ${b}?`, String(correct), intWrongs(correct, 4)];
}
function g1_skip_counting() {
  const step = choice([2, 5, 10]);
  const start = randInt(1, 5) * step;
  const correct = start + 3 * step;
  return [`What comes next: ${start}, ${start + step}, ${start + 2 * step}, ___?`, String(correct), intWrongs(correct, step)];
}
function g1_compare_numbers() {
  const [a, b] = sampleTwo(1, 49);
  const bigger = Math.max(a, b), smaller = Math.min(a, b);
  const base = [String(smaller)];
  const extra = collectWrongs(() => Math.max(0, bigger + randInt(-8, 8)), bigger, 3 - base.length, 300, base);
  return [`Which number is greater: ${a} or ${b}?`, String(bigger), base.concat(extra).slice(0, 3)];
}
function g1_shapes() {
  const pool = { "Triangle": "3", "Square": "4", "Rectangle": "4", "Pentagon": "5", "Hexagon": "6" };
  const shape = choice(Object.keys(pool));
  const correct = pool[shape];
  const wrongs = pickFromPool(["3", "4", "5", "6", "8"], correct);
  return [`How many sides does a ${shape.toLowerCase()} have?`, correct, wrongs];
}
function g1_place_value() {
  const tens = randInt(1, 9), ones = randInt(0, 9);
  const n = tens * 10 + ones;
  return [`How many tens are in the number ${n}?`, String(tens), intWrongs(tens, 3)];
}
const GRADE1 = [g1_addition, g1_subtraction, g1_skip_counting, g1_compare_numbers, g1_shapes, g1_place_value];

// ===========================================================================
// GRADE 2
// ===========================================================================

function g2_addition_2digit() {
  const a = randInt(10, 89), b = randInt(10, 89);
  const correct = a + b;
  return [`What is ${a} + ${b}?`, String(correct), intWrongs(correct, 8)];
}
function g2_subtraction_2digit() {
  const a = randInt(20, 99), b = randInt(10, a);
  const correct = a - b;
  return [`What is ${a} - ${b}?`, String(correct), intWrongs(correct, 8)];
}
function g2_skip_counting() {
  const step = choice([2, 5, 10]);
  const start = randInt(2, 8) * step;
  const correct = start + 2 * step;
  return [`Count by ${step}s: ${start}, ${start + step}, ___, ${start + 3 * step}?`, String(correct), intWrongs(correct, step)];
}
function g2_compare_3digit() {
  const [a, b] = sampleTwo(100, 998);
  const bigger = Math.max(a, b), smaller = Math.min(a, b);
  const base = [String(smaller)];
  const extra = collectWrongs(() => Math.max(100, bigger + randInt(-20, 20)), bigger, 3 - base.length, 300, base);
  return [`Which number is greater: ${a} or ${b}?`, String(bigger), base.concat(extra).slice(0, 3)];
}
function g2_time() {
  const hour = randInt(1, 12);
  const minute = choice([0, 30]);
  const minuteStr = minute === 0 ? "00" : "30";
  const label = minute === 0 ? "o'clock" : "half past";
  const correct = `${hour}:${minuteStr}`;
  const otherMin = minute === 0 ? "30" : "00";
  const otherHour = (hour % 12) + 1;
  const wrongs = [`${hour}:${otherMin}`, `${otherHour}:${minuteStr}`, `${otherHour}:${otherMin}`];
  return [`If the clock shows ${label} ${hour}, what time is it (in H:MM)?`, correct, wrongs];
}
function g2_money() {
  const quarters = randInt(0, 3), dimes = randInt(0, 4), nickels = randInt(0, 4), pennies = randInt(0, 4);
  const total = quarters * 25 + dimes * 10 + nickels * 5 + pennies;
  const q = `You have ${quarters} quarters, ${dimes} dimes, ${nickels} nickels, and ${pennies} pennies. How many cents is that?`;
  return [q, String(total), intWrongs(total, 15)];
}
const GRADE2 = [g2_addition_2digit, g2_subtraction_2digit, g2_skip_counting, g2_compare_3digit, g2_time, g2_money];

// ===========================================================================
// GRADE 3
// ===========================================================================

function g3_multiplication() {
  const a = randInt(2, 10), b = randInt(2, 10);
  const correct = a * b;
  return [`What is ${a} x ${b}?`, String(correct), intWrongs(correct, 8)];
}
function g3_division() {
  const b = randInt(2, 10), correct = randInt(2, 10);
  const a = b * correct;
  return [`What is ${a} / ${b}?`, String(correct), intWrongs(correct, 5)];
}
function g3_basic_fraction() {
  const den = randInt(4, 10), num = randInt(1, den - 1);
  const correct = `${num}/${den}`;
  const cand = () => {
    if (Math.random() < 0.6) {
      const wn = randInt(1, den - 1);
      return `${wn}/${den}`;
    }
    const wd = Math.max(3, den + choice([-1, 1]));
    const wn = randInt(1, wd - 1);
    return `${wn}/${wd}`;
  };
  const wrongs = collectWrongs(cand, correct);
  return [`If ${num} out of ${den} equal parts of a shape are shaded, what fraction is shaded?`, correct, wrongs];
}
function g3_area_perimeter() {
  const length = randInt(2, 12), width = randInt(2, 12);
  const kind = choice(["area", "perimeter"]);
  let correct, q;
  if (kind === "area") {
    correct = length * width;

}

function g11_quadratic_formula() {
  let r1 = randInt(-6, 6), r2 = randInt(-6, 6);
  while (r2 === r1) r2 = randInt(-6, 6);
  const b = -(r1 + r2), c = r1 * r2;
  const bSign = b >= 0 ? "+" : "-", cSign = c >= 0 ? "+" : "-";
  const q = `Solve using the quadratic formula: x^2 ${bSign} ${Math.abs(b)}x ${cSign} ${Math.abs(c)} = 0`;
  const correct = `x = ${Math.min(r1, r2)}, x = ${Math.max(r1, r2)}`;
  const cand = () => { const w1 = r1 + randInt(-2, 2), w2 = r2 + randInt(-2, 2); return `x = ${Math.min(w1, w2)}, x = ${Math.max(w1, w2)}`; };
  const wrongs = collectWrongs(cand, correct);
  return [q, correct, wrongs];
}
function g11_exponential_growth() {
  const base = choice([2, 3]), exp = randInt(2, 5);
  const correct = Math.pow(base, exp);
  const q = `If a population doubles/triples each period starting at ${base} with growth factor ${base}, evaluate ${base}^${exp}.`;
  return [q, String(correct), intWrongs(correct, Math.max(4, Math.floor(correct / 4)))];
}
function g11_logarithm() {

  const n = randInt(4, 10);
  const correct = a1 + (n - 1) * d;
  const q = `An arithmetic sequence starts at ${a1} with common difference ${d}. What is the ${n}th term?`;
  return [q, String(correct), intWrongs(correct, Math.max(d * 2, 5), true)];
}
function g11_geometric_sequence() {
  const a1 = randInt(1, 5), r = randInt(2, 3), n = randInt(3, 6);
  const correct = a1 * Math.pow(r, n - 1);
  const q = `A geometric sequence starts at ${a1} with common ratio ${r}. What is the ${n}th term?`;
  return [q, String(correct), intWrongs(correct, Math.max(Math.floor(correct / 3), 5))];
}

  else { correct = Math.max(...nums) - Math.min(...nums); q = `What is the range of: ${nums.join(', ')}?`; }

function tidyTopicName(name) {
  return String(name || "Topic")
    .replace(/^[ghk]\d*_/, "")
    .replace(/_/g, " ")
    .replace(/\b\w/g, c => c.toUpperCase());
}

function topicKeyOfGenerator(fn) {
  if (!fn) return "";
  if (fn.topicKey) return fn.topicKey;
  return fn.name ? "math:" + fn.name : "";
}

function topicLabelOfGenerator(fn) {
  const name = topicKeyOfGenerator(fn).replace(/^math:/, "");
  return TOPIC_LABELS[name] || tidyTopicName(name);
}

function topicLabelFromId(topicId) {
  const name = String(topicId || "").replace(/^math:/, "");
  return TOPIC_LABELS[name] || tidyTopicName(name);
}

// Focused practice keeps pulling from the chosen topic even when the adaptive
// level moves; mixed practice stays on the whole grade.
function mathGeneratorPool(grade, focus) {
  const base = GRADE_GENERATORS[grade] || [];
  const wanted = String(focus || "");
  if (wanted.indexOf("math:") !== 0) return base;
  const local = base.filter(fn => topicKeyOfGenerator(fn) === wanted);
  if (local.length) return local;
  const grades = Object.keys(GRADE_GENERATORS);
  for (let i = 0; i < grades.length; i++) {
    const hit = GRADE_GENERATORS[grades[i]].filter(fn => topicKeyOfGenerator(fn) === wanted);
    if (hit.length) return hit;
  }
  return base;
}

function numericVariants(text) {
  const match = String(text).match(/-?\d+(?:\.\d+)?/);
  if (!match) return null;
  const raw = match[0];
  const value = parseFloat(raw);
  if (!isFinite(value)) return null;
  const decimals = (raw.split(".")[1] || "").length;
  const prefix = text.slice(0, match.index);
  const suffix = text.slice(match.index + raw.length);
  const fmtV = (v) => prefix + v.toFixed(decimals) + suffix;
  return [fmtV(value + 1), fmtV(value - 1), fmtV(value + 2), fmtV(value - 2)];
}

function generateMathQuiz(grade, count, focus) {
  const generators = mathGeneratorPool(grade, focus);
  const questions = [];
  if (!generators.length) return questions;
  for (let i = 0; i < count; i++) {
    let built = null;
    // Regenerate instead of padding: every question keeps four plausible options.
    for (let attempt = 0; attempt < 120 && !built; attempt++) {
      const generator = choice(generators);
      const [qText, correctRaw, wrongsRaw] = generator();
      const correct = String(correctRaw);
      const wrongs = Array.from(new Set(wrongsRaw.map(String))).filter(w => w !== correct);
      if (wrongs.length < 3) continue;
      const options = wrongs.slice(0, 3).concat([correct]);
      for (let j = options.length - 1; j > 0; j--) { const k = randInt(0, j); [options[j], options[k]] = [options[k], options[j]]; }
      built = { question: qText, options: options, correct_text: correct,
        topic: topicKeyOfGenerator(generator), topicLabel: topicLabelOfGenerator(generator) };
    }
    if (!built) {
      const fallback = generators[0];
      const [qText, correctRaw] = fallback();
      const correct = String(correctRaw);
      const variants = numericVariants(correct) || ["None of these", "Not enough information", "Cannot be determined"];
      built = { question: qText, options: variants.slice(0, 3).concat([correct]), correct_text: correct,
        topic: topicKeyOfGenerator(fallback), topicLabel: topicLabelOfGenerator(fallback) };
    }
    questions.push(built);
  }
  return questions;
}

if (typeof module !== 'undefined') {
  module.exports = { generateMathQuiz, GRADE_GENERATORS };
}
