};

const FIG_OBJECTS = [
  [/apple/i, "\ud83c\udf4e"],
  [/orange/i, "\ud83c\udf4a"],
  [/cookie|biscuit/i, "\ud83c\udf6a"],
  [/cand(y|ies)|sweet/i, "\ud83c\udf6c"],
  [/sticker|star/i, "\u2b50"],
  [/pencil/i, "\u270f\ufe0f"],
  [/notebook|book/i, "\ud83d\udcd8"],
  [/balloon/i, "\ud83c\udf88"],
  [/egg/i, "\ud83e\udd5a"],
  [/fish/i, "\ud83d\udc1f"],
  [/bird/i, "\ud83d\udc26"],
  [/flower|sunflower/i, "\ud83c\udf3b"],
  [/ball/i, "\u26bd"],
  [/marble/i, "\ud83d\udd35"]
];

function figSvg(label, inner, w, h) {
  const W = w || 340, H = h || 180;
  return `<figure class="q-figure"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(label)}" preserveAspectRatio="xMidYMid meet"><title>${escapeHtml(label)}</title>${inner}</svg></figure>`;
}

function figText(x, y, str, opts) {
  const o = opts || {};
  return `<text x="${Number(x).toFixed(1)}" y="${Number(y).toFixed(1)}" font-size="${o.size || 13}" font-weight="${o.weight || 700}" fill="${o.fill || FIG.ink}" text-anchor="${o.anchor || "middle"}">${escapeHtml(str)}</text>`;
}

function figPolyPoints(sides, cx, cy, r, startDeg) {
  const pts = [];
  for (let i = 0; i < sides; i++) {
    const a = ((startDeg == null ? -90 : startDeg) + (360 / sides) * i) * Math.PI / 180;
    pts.push(`${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`);
  }
  return pts.join(" ");
}

function figCharFor(noun) {
  for (const [re, ch] of FIG_OBJECTS) if (re.test(noun)) return ch;
  return "\u25cf";
}

function figShape(name) {
  if (name === "circle") {
    return figSvg("A circle", `<circle cx="170" cy="90" r="56" fill="${FIG.blueSoft}" stroke="${FIG.blue}" stroke-width="2.5"/>`);
  }
  if (name === "square") {
    return figSvg("A square", `<rect x="112" y="34" width="116" height="116" rx="5" fill="${FIG.blueSoft}" stroke="${FIG.blue}" stroke-width="2.5"/>`);
  }
  if (name === "rectangle") {
    return figSvg("A rectangle", `<rect x="76" y="46" width="188" height="92" rx="5" fill="${FIG.blueSoft}" stroke="${FIG.blue}" stroke-width="2.5"/>`);
  }
  const sides = { triangle: 3, pentagon: 5, hexagon: 6 }[name] || 4;
  return figSvg(`A ${name}`, `<polygon points="${figPolyPoints(sides, 170, 92, 58)}" fill="${FIG.blueSoft}" stroke="${FIG.blue}" stroke-width="2.5" stroke-linejoin="round"/>`);
}

function figSideLabel(x1, y1, x2, y2, label, offset) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  const off = offset == null ? 15 : offset;
  return figText(mx + (-dy / len) * off, my + (dx / len) * off + 4, label, { size: 13 });
}

function figVertexAngle(v, p1, p2, label, r, color) {
  const a1 = Math.atan2(p1[1] - v[1], p1[0] - v[0]);
  const a2 = Math.atan2(p2[1] - v[1], p2[0] - v[0]);
  let d = a2 - a1;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  const mid = a1 + d / 2;
  const arc = `M ${(v[0] + Math.cos(a1) * r).toFixed(1)} ${(v[1] + Math.sin(a1) * r).toFixed(1)} A ${r} ${r} 0 0 ${d > 0 ? 1 : 0} ${(v[0] + Math.cos(a2) * r).toFixed(1)} ${(v[1] + Math.sin(a2) * r).toFixed(1)}`;
  return `<path d="${arc}" fill="none" stroke="${color || FIG.teal}" stroke-width="2.2"/>` +
    figText(v[0] + Math.cos(mid) * (r + 21), v[1] + Math.sin(mid) * (r + 21) + 4, label, { size: 12, fill: FIG.ink });
}

function figDotCluster(count, cx, cy, color, perRow, crossedFrom) {
  if (!count || count > 24) return "";
  const per = perRow || 5;
  const rows = Math.ceil(count / per);
  let out = "";
  for (let i = 0; i < count; i++) {
    const row = Math.floor(i / per), col = i % per;
    const inRow = Math.min(per, count - row * per);
    const x = cx - ((inRow - 1) * 20) / 2 + col * 20;
    const y = cy - ((rows - 1) * 20) / 2 + row * 20;
    const hollow = crossedFrom != null && i >= crossedFrom;
    out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="${hollow ? FIG.white : color}" stroke="${hollow ? FIG.red : color}" stroke-width="2"/>`;
    if (hollow) {
      out += `<path d="M${(x - 5).toFixed(1)} ${(y - 5).toFixed(1)} L${(x + 5).toFixed(1)} ${(y + 5).toFixed(1)} M${(x + 5).toFixed(1)} ${(y - 5).toFixed(1)} L${(x - 5).toFixed(1)} ${(y + 5).toFixed(1)}" stroke="${FIG.red}" stroke-width="2" stroke-linecap="round"/>`;
    }
  }
  return out;
}

function figEmojiRow(char, count, crossedFrom, opts) {
  if (!count || count > 24) return "";
  const o = opts || {};
  const per = o.perRow || 8, cell = o.cell || 26, cy = o.y || 92;
  const rows = Math.ceil(count / per);
  let out = "";
  for (let i = 0; i < count; i++) {
    const row = Math.floor(i / per), col = i % per;
    const inRow = Math.min(per, count - row * per);
    const x = 170 - ((inRow - 1) * cell) / 2 + col * cell;
    const y = cy - ((rows - 1) * 30) / 2 + row * 30;
    const dead = crossedFrom != null && i >= crossedFrom;
    out += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="22" text-anchor="middle"${dead ? ' opacity="0.3"' : ""}>${char}</text>`;
    if (dead) {
      out += `<path d="M${(x - 10).toFixed(1)} ${(y - 11).toFixed(1)} L${(x + 10).toFixed(1)} ${(y + 3).toFixed(1)} M${(x + 10).toFixed(1)} ${(y - 11).toFixed(1)} L${(x - 10).toFixed(1)} ${(y + 3).toFixed(1)}" stroke="${FIG.red}" stroke-width="2.4" stroke-linecap="round"/>`;
    }
  }
  return out;
}

function figCounters(a, b, op) {
  if (a > 20 || b > 20) return "";
  if (op === "+") {
    const g = figDotCluster(a, 104, 94, FIG.blue, 5) +
      figText(170, 100, "+", { size: 26, fill: FIG.muted }) +
      figDotCluster(b, 236, 94, FIG.teal, 5) +
      figText(104, 34, String(a), { size: 15, fill: FIG.muted }) +
      figText(236, 34, String(b), { size: 15, fill: FIG.muted });
    return figSvg(`${a} plus ${b}`, g);
  }
  const g = figDotCluster(a, 170, 108, FIG.blue, 6, a - b) +
    figText(170, 34, `${a} take away ${b}`, { size: 13, fill: FIG.muted }) +
    figText(170, 160, "?", { size: 18 });
  return figSvg(`${a} take away ${b}`, g);
}

function figStickerStory(start, gain, loss) {
  if (start > 20 || gain > 20 || loss > 20) return "";
  let g = figDotCluster(start, 76, 78, FIG.blue, 5) + figText(76, 128, String(start), { size: 13 }) + figText(76, 148, "to start", { size: 11, fill: FIG.muted });
  g += figDotCluster(gain, 170, 78, FIG.teal, 5) + figText(170, 128, "+ " + gain, { size: 13, fill: FIG.teal }) + figText(170, 148, "gets more", { size: 11, fill: FIG.muted });
  g += figDotCluster(loss, 264, 78, FIG.red, 5, 0) + figText(264, 128, "\u2212 " + loss, { size: 13, fill: FIG.red }) + figText(264, 148, "gives away", { size: 11, fill: FIG.muted });
  return figSvg(`Start with ${start}, add ${gain}, then give away ${loss}`, g);
}

function figCompareRows(a, b) {
  const max = Math.max(a, b, 1);
  const left = 96, right = 292;
  const wA = Math.max(16, ((right - left) * a) / max);
  const wB = Math.max(16, ((right - left) * b) / max);
  let g = figText(left - 10, 76, "Sam", { size: 12, anchor: "end", fill: FIG.muted });
  g += `<rect x="${left}" y="54" width="${wA.toFixed(1)}" height="30" rx="8" fill="${FIG.blueSoft}" stroke="${FIG.blue}" stroke-width="2"/>`;
  g += figText(left + wA + 12, 75, String(a), { size: 13, anchor: "start" });
  g += figText(left - 10, 122, "Ana", { size: 12, anchor: "end", fill: FIG.muted });
  g += `<rect x="${left}" y="100" width="${wB.toFixed(1)}" height="30" rx="8" fill="${FIG.tealSoft}" stroke="${FIG.teal}" stroke-width="2"/>`;
  g += figText(left + wB + 12, 121, String(b), { size: 13, anchor: "start" });
  g += figText(170, 164, "how many more?", { size: 12, fill: FIG.muted });
  return figSvg(`Sam has ${a} stickers and Ana has ${b} stickers`, g);
}

function figNumberLine(min, max, ticks, marks, label) {
  const left = 40, right = 300, y = 98;
  const span = max - min || 1;
  const X = v => left + ((v - min) / span) * (right - left);
  let g = `<line x1="${left - 14}" y1="${y}" x2="${right + 14}" y2="${y}" stroke="${FIG.line}" stroke-width="2.5" stroke-linecap="round"/>`;
  for (const v of ticks || []) {
    if (v < min || v > max) continue;
    const x = X(v);
    g += `<line x1="${x.toFixed(1)}" y1="${y - 7}" x2="${x.toFixed(1)}" y2="${y + 7}" stroke="${FIG.line}" stroke-width="2"/>`;
  }
  for (const mk of marks || []) {
    const x = X(mk.v);
    g += `<circle cx="${x.toFixed(1)}" cy="${y}" r="5.5" fill="${mk.color || FIG.blue}" stroke="${FIG.white}" stroke-width="2"/>`;
    g += figText(x, mk.below ? y + 28 : y - 16, mk.label, { size: 13, fill: FIG.ink });
  }
  return figSvg(label, g);
}

function figClock(hour, minute) {
  const cx = 170, cy = 94, r = 64;
  let g = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${FIG.white}" stroke="${FIG.blue}" stroke-width="3"/>`;
  for (let i = 0; i < 12; i++) {
    const a = (i * 30 - 90) * Math.PI / 180;
    const inner = i % 3 === 0 ? 10 : 6;
    g += `<line x1="${(cx + Math.cos(a) * (r - inner)).toFixed(1)}" y1="${(cy + Math.sin(a) * (r - inner)).toFixed(1)}" x2="${(cx + Math.cos(a) * (r - 4)).toFixed(1)}" y2="${(cy + Math.sin(a) * (r - 4)).toFixed(1)}" stroke="${FIG.line}" stroke-width="2" stroke-linecap="round"/>`;
  }
  g += figText(cx, cy - r + 22, "12", { size: 12, fill: FIG.muted });
  g += figText(cx + r - 18, cy + 5, "3", { size: 12, fill: FIG.muted });
  g += figText(cx, cy + r - 10, "6", { size: 12, fill: FIG.muted });
  g += figText(cx - r + 18, cy + 5, "9", { size: 12, fill: FIG.muted });
  const ha = (((hour % 12) + minute / 60) * 30 - 90) * Math.PI / 180;
  const ma = (minute * 6 - 90) * Math.PI / 180;
  g += `<line x1="${cx}" y1="${cy}" x2="${(cx + Math.cos(ha) * r * 0.48).toFixed(1)}" y2="${(cy + Math.sin(ha) * r * 0.48).toFixed(1)}" stroke="${FIG.ink}" stroke-width="7" stroke-linecap="round"/>`;
  g += `<line x1="${cx}" y1="${cy}" x2="${(cx + Math.cos(ma) * r * 0.78).toFixed(1)}" y2="${(cy + Math.sin(ma) * r * 0.78).toFixed(1)}" stroke="${FIG.ink}" stroke-width="4.5" stroke-linecap="round"/>`;
  g += `<circle cx="${cx}" cy="${cy}" r="5" fill="${FIG.ink}"/>`;
  g += figText(cx, 178, "what time is it?", { size: 11, fill: FIG.muted });
  return figSvg(`A clock showing ${minute === 30 ? "half past " + hour : hour + " o'clock"}`, g);
}

function figFractionBar(num, den, x, y, w, h, color) {
  const pw = w / den;
  let g = "";
  for (let i = 0; i < den; i++) {
    g += `<rect x="${(x + i * pw).toFixed(1)}" y="${y}" width="${pw.toFixed(1)}" height="${h}" fill="${i < num ? (color || FIG.blue) : FIG.white}" stroke="${FIG.blue}" stroke-width="1.5"/>`;
  }
  return g;
}

function figFractionOf(num, den, total) {
  if (den > 16) return "";
  const g = figText(170, 40, `${num}/${den} of ${total}`, { size: 15, fill: FIG.muted }) +
    figFractionBar(num, den, 60, 66, 220, 56) +
    figText(170, 158, "?", { size: 20 });
  return figSvg(`${num} of ${den} equal parts of ${total}`, g);
}

function figShadedParts(num, den) {
  if (den > 16) return "";
  const g = figText(170, 40, `${num} out of ${den} parts shaded`, { size: 14, fill: FIG.muted }) +
    figFractionBar(num, den, 50, 66, 240, 56) +
    figText(170, 158, "shaded fraction = ?", { size: 13 });
  return figSvg(`${num} of ${den} equal parts shaded`, g);
}

function figFractionOps(a, b, op, c, d) {
  if (b > 16 || d > 16) return "";
  const w = 128;
  let g = figText(26 + w / 2, 40, `${a}/${b}`, { size: 14 }) + figText(186 + w / 2, 40, `${c}/${d}`, { size: 14 });
  g += figFractionBar(a, b, 26, 56, w, 46) + figFractionBar(c, d, 186, 56, w, 46);
  g += figText(170, 90, op === "x" || op === "*" ? "\u00d7" : op, { size: 22, fill: FIG.muted });
  g += figText(170, 152, "= ?", { size: 16 });
  return figSvg(`${a} over ${b} ${op === "x" ? "times" : op} ${c} over ${d}`, g);
}

function figFractionCompare(list) {
  if (!list.length || list.some(f => f[1] > 16)) return "";
  let g = "";

function figDataBars(values, label) {
  const nums = values.filter(v => typeof v === "number" && isFinite(v));
  if (!nums.length || values.length > 8) return "";
  const max = Math.max.apply(null, nums.concat([1]));
  const left = 34, right = 306, base = 150, top = 34;
  const slot = (right - left) / values.length;
  const barW = Math.min(30, slot * 0.55);
  let g = `<line x1="${left - 8}" y1="${base}" x2="${right}" y2="${base}" stroke="${FIG.line}" stroke-width="2"/>`;
  values.forEach((v, i) => {
    const x = left + slot * i + slot / 2;
    if (typeof v === "number" && isFinite(v)) {
      const h = Math.max(6, ((base - top) * v) / max);
      g += `<rect x="${(x - barW / 2).toFixed(1)}" y="${(base - h).toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="5" fill="${FIG.blueSoft}" stroke="${FIG.blue}" stroke-width="2"/>`;
      g += figText(x, base - h - 8, String(v), { size: 12 });
    } else {
      g += `<rect x="${(x - barW / 2).toFixed(1)}" y="${base - 34}" width="${barW.toFixed(1)}" height="34" rx="5" fill="${FIG.white}" stroke="${FIG.purple}" stroke-width="2" stroke-dasharray="4 4"/>`;
      g += figText(x, base - 46, "?", { size: 15, fill: FIG.purple });
    }
  });
  return figSvg(label, g);
}

function figAxes(points, label, connect) {
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  let minX = Math.min(0, Math.min.apply(null, xs)), maxX = Math.max(0, Math.max.apply(null, xs));
  let minY = Math.min(0, Math.min.apply(null, ys)), maxY = Math.max(0, Math.max.apply(null, ys));
  if (maxX - minX < 4) { minX -= 1; maxX += 1; }
  if (maxY - minY < 4) { minY -= 1; maxY += 1; }
  const padX = Math.max(1, Math.round((maxX - minX) * 0.12));
  const padY = Math.max(1, Math.round((maxY - minY) * 0.12));
  minX -= padX; maxX += padX; minY -= padY; maxY += padY;
  const L = 44, R = 296, T = 22, B = 156;
  const X = v => L + ((v - minX) / (maxX - minX)) * (R - L);
  const Y = v => B - ((v - minY) / (maxY - minY)) * (B - T);
  let g = "";
  const stepX = (maxX - minX) <= 12 ? 1 : Math.ceil((maxX - minX) / 8);
  const stepY = (maxY - minY) <= 12 ? 1 : Math.ceil((maxY - minY) / 6);
  for (let x = Math.ceil(minX / stepX) * stepX; x <= maxX; x += stepX) {
    g += `<line x1="${X(x).toFixed(1)}" y1="${T}" x2="${X(x).toFixed(1)}" y2="${B}" stroke="${FIG.grid}" stroke-width="1"/>`;
  }
  for (let y = Math.ceil(minY / stepY) * stepY; y <= maxY; y += stepY) {
    g += `<line x1="${L}" y1="${Y(y).toFixed(1)}" x2="${R}" y2="${Y(y).toFixed(1)}" stroke="${FIG.grid}" stroke-width="1"/>`;
  }
  g += `<line x1="${L}" y1="${Y(0).toFixed(1)}" x2="${R}" y2="${Y(0).toFixed(1)}" stroke="${FIG.line}" stroke-width="2"/>`;
  g += `<line x1="${X(0).toFixed(1)}" y1="${B}" x2="${X(0).toFixed(1)}" y2="${T}" stroke="${FIG.line}" stroke-width="2"/>`;
  g += figText(R - 4, Y(0) - 8, "x", { size: 11, fill: FIG.muted, anchor: "end" });
  g += figText(X(0) + 8, T + 6, "y", { size: 11, fill: FIG.muted, anchor: "start" });
  if (connect && points.length > 1) {
    g += `<line x1="${X(points[0].x).toFixed(1)}" y1="${Y(points[0].y).toFixed(1)}" x2="${X(points[1].x).toFixed(1)}" y2="${Y(points[1].y).toFixed(1)}" stroke="${FIG.purple}" stroke-width="2"/>`;
  }
  points.forEach(p => {
    const px = X(p.x), py = Y(p.y);
    g += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="5" fill="${FIG.red}" stroke="${FIG.white}" stroke-width="2"/>`;
    const right = px > 258;
    const tag = p.tag || `(${p.x}, ${p.y})`;
    g += figText(right ? px - 9 : px + 9, py - 9, tag, { size: 11, anchor: right ? "end" : "start", fill: FIG.ink });
  });
  return figSvg(label, g);
}

function figCoins(q, d, n, p) {
  const coins = [];
  for (let i = 0; i < q; i++) coins.push([25, "25\u00a2", FIG.amberSoft, FIG.amber]);
  for (let i = 0; i < d; i++) coins.push([10, "10\u00a2", "#e8eef9", "#8fa4c4"]);
  for (let i = 0; i < n; i++) coins.push([5, "5\u00a2", "#e8eef9", "#8fa4c4"]);
  for (let i = 0; i < p; i++) coins.push([1, "1\u00a2", "#f3e3cf", "#b98a5a"]);
  if (!coins.length || coins.length > 16) return "";
  const per = 8, r = 18, cell = 42;
  const rows = Math.ceil(coins.length / per);
  let g = "";
  coins.forEach((c, i) => {
    const row = Math.floor(i / per), col = i % per;
    const inRow = Math.min(per, coins.length - row * per);
    const x = 170 - ((inRow - 1) * cell) / 2 + col * cell;
    const y = 62 + row * 46;
    g += `<circle cx="${x.toFixed(1)}" cy="${y}" r="${r}" fill="${c[2]}" stroke="${c[3]}" stroke-width="2"/>`;
    g += figText(x, y + 5, c[1], { size: 11, fill: FIG.ink });

}

function qbFigureFor(q) {
  if (!q || typeof q.question !== "string") return "";
  const t = q.question.replace(/\s+/g, " ").trim();
  let m;

  // Shapes named in the question.
  m = t.match(/^How many sides does (?:a|an) (triangle|square|rectangle|pentagon|hexagon) have\?$/i);
  if (m) return figShape(m[1].toLowerCase());

  // Clocks.
  m = t.match(/clock shows half past (\d+)/i);
  if (m) return figClock(Number(m[1]), 30);
  m = t.match(/clock shows o'clock (\d+)/i);
  if (m) return figClock(Number(m[1]), 0);

  // Fractions.
  m = t.match(/^What is (\d+)\/(\d+) of (\d+)\?/i);
  if (m) return figFractionOf(Number(m[1]), Number(m[2]), Number(m[3]));
  m = t.match(/^If (\d+) out of (\d+) equal parts/i);
  if (m) return figShadedParts(Number(m[1]), Number(m[2]));
  m = t.match(/^What is (\d+)\/(\d+) ([+\-x\u00d7*\/]) (\d+)\/(\d+)\?/i);
  if (m) return figFractionOps(Number(m[1]), Number(m[2]), m[3], Number(m[4]), Number(m[5]));
  m = t.match(/^Which fraction is the greatest: (.+)\?$/i);
  if (m) {
    const list = [];
    const re = /(\d+)\s*\/\s*(\d+)/g;
    let f;
    while ((f = re.exec(m[1])) && list.length < 4) list.push([Number(f[1]), Number(f[2])]);
    if (list.length >= 2) return figFractionCompare(list);
  }

  // Money.
  m = t.match(/You have (\d+) quarters, (\d+) dimes, (\d+) nickels, and (\d+) pennies/i);
  if (m) return figCoins(Number(m[1]), Number(m[2]), Number(m[3]), Number(m[4]));
  m = t.match(/^You buy (\d+) notebooks at \$(\d+) each and a pen for \$(\d+)/i);
  if (m) return figItemPrice(Number(m[1]), Number(m[2]));
  m = t.match(/^(?:An? (?:item|pencil)) costs \$?(\d+)[^.]*\. You pay with \$(\d+)/i);
  if (m) return figChange(Number(m[1]), Number(m[2]));

  // Story problems with counters.
  m = t.match(/^Mia has (\d+) stickers\. She gets (\d+) more, then gives (\d+) away/i);
  if (m) return figStickerStory(Number(m[1]), Number(m[2]), Number(m[3]));
  m = t.match(/^Sam has (\d+) stickers\. Ana has (\d+) stickers\. How many more/i);
  if (m) return figCompareRows(Number(m[1]), Number(m[2]));
  m = t.match(/^A school buys (\d+) boxes with (\d+) pencils in each box\. They give away (\d+) pencils/i);
  if (m) return figBoxesPencils(Number(m[1]), Number(m[2]), Number(m[3]));
  m = t.match(/^A bag has (\d+) marbles, (\d+) of which are red/i);
  if (m) return figBagMarbles(Number(m[1]), Number(m[2]));
  m = t.match(/^There (?:are|were) (\d+) ([a-z]+) and (\d+) (?:was|were) (?:taken|eaten|given|lost) away/i);
  if (m) return figTakeAway(m[1], m[2], m[3]);
  m = t.match(/how many ([a-z]+).*?there were (\d+) and (\d+) (?:was|were) (?:taken|eaten|given|lost)/i);
  if (m) return figTakeAway(m[2], m[1], m[3]);

  // Simple arithmetic with counters.
  m = t.match(/^(\d+) ([+-]) (\d+) = \?$/);
  if (m) return figCounters(Number(m[1]), Number(m[3]), m[2]);
  m = t.match(/^What is (\d+) ([+-]) (\d+)\?$/);
  if (m) return figCounters(Number(m[1]), Number(m[3]), m[2]);

  // Number lines.
  m = t.match(/^Round (\d+) to the nearest (ten|hundred|thousand)/i);
  if (m) {
    const n = Number(m[1]);
    const place = m[2].toLowerCase() === "ten" ? 10 : m[2].toLowerCase() === "hundred" ? 100 : 1000;
    const lower = Math.floor(n / place) * place, upper = lower + place, mid = lower + place / 2;
    return figNumberLine(lower, upper, [lower, mid, upper], [
      { v: lower, label: String(lower), below: true },
      { v: upper, label: String(upper), below: true },
      { v: n, label: String(n) }
    ], `A number line from ${lower} to ${upper} with ${n} marked`);
  }
  m = t.match(/Which number is (?:bigger|greater): (\d+) or (\d+)/i);
  if (m) {
    const a = Number(m[1]), b = Number(m[2]);
    const lo = Math.min(a, b), hi = Math.max(a, b);
    const pad = Math.max(1, Math.round((hi - lo) * 0.25));
    return figNumberLine(lo - pad, hi + pad, [lo, hi], [
      { v: a, label: String(a) },
      { v: b, label: String(b), below: true }
    ], `A number line with ${a} and ${b} marked`);
  }
  m = t.match(/What number comes right after (\d+)/i);
  if (m) {
    const n = Number(m[1]);
    return figNumberLine(n - 1, n + 2, [n - 1, n, n + 1, n + 2], [{ v: n, label: String(n) }], `A number line with ${n} marked`);
  }
  m = t.match(/(?:Which number is missing\?|Count by (\d+)s:|What number comes next:|What comes next:) (.+)$/i);
  if (m) return figSequenceLine(m[1], m[2]);

  // Geometry.
  m = t.match(/^A rectangle is (\d+) units long and (\d+) units wide\. What is its (area|perimeter)/i);
  if (m) return figRectFigure(Number(m[1]), Number(m[2]), m[3].toLowerCase());
  m = t.match(/^A rectangle is (\d+) by (\d+)\. A (\d+) by (\d+) rectangle is cut out/i);
  if (m) return figCutout(Number(m[1]), Number(m[2]), Number(m[3]), Number(m[4]));
  m = t.match(/area of a triangle with base (\d+) and height (\d+)/i);
  if (m) return figTriangleBaseHeight(Number(m[1]), Number(m[2]));
  m = t.match(/area of a parallelogram with base (\d+) and height (\d+)/i);
  if (m) return figParallelogram(Number(m[1]), Number(m[2]));
  m = t.match(/right triangle has legs (\d+) and (\d+)/i);
  if (m) return figRightTriangle("hyp", Number(m[1]), Number(m[2]));
  m = t.match(/right triangle has a hypotenuse of (\d+) and one leg of (\d+)/i);
  if (m) return figRightTriangle("leg", Number(m[2]), Number(m[1]));
  m = t.match(/right triangle with opposite side (\d+), adjacent side (\d+), and hypotenuse (\d+)/i);
  if (m) return figTrig(Number(m[1]), Number(m[2]), Number(m[3]));
  m = t.match(/triangle has angles of (\d+) degrees and (\d+) degrees/i);
  if (m) return figTriangleAngles(Number(m[1]), Number(m[2]));
  m = t.match(/triangle has sides (\d+) and (\d+) with a (\d+) degree angle between them/i);
  if (m) return figLawCosines(Number(m[1]), Number(m[2]), Number(m[3]));
  m = t.match(/Two triangles are similar\. A side of ([\d.]+) in the small triangle corresponds to a side of ([\d.\/]+) in the large triangle\. If another side of the small triangle is (\d+)/i);
  if (m) return figSimilar(Number(m[1]), m[2], Number(m[3]));
  m = t.match(/(?:third side|other two sides)[^.]*?(\d+) and (\d+)/i) ||
    t.match(/triangle[^.]*?(\d+) and (\d+)[^.]*?(?:third side|other two sides)/i);
  if (m) return figTwoSides(Number(m[1]), Number(m[2]));
  m = t.match(/In a 30-60-90 triangle the hypotenuse is (\d+)/i);
  if (m) return figSpecialRight("hyp", Number(m[1]));
  m = t.match(/In a 30-60-90 triangle the shorter leg is (\d+)/i);
  if (m) return figSpecialRight("short", Number(m[1]));
  m = t.match(/circle has a diameter of (\d+) cm/i);
  if (m) return figCircleFigure(Number(m[1]), true);
  m = t.match(/circle with radius (\d+)/i);
  if (m) return figCircleFigure(Number(m[1]), false);
  m = t.match(/volume of a (cylinder|cone) with radius (\d+) and height (\d+)/i);
  if (m) return figSolid(m[1].toLowerCase(), Number(m[2]), Number(m[3]));
  m = t.match(/volume of a sphere with radius (\d+)/i);
  if (m) return figSolid("sphere", Number(m[1]));
  m = t.match(/(?:volume|surface area) of a rectangular prism with length (\d+), width (\d+), (?:and )?height (\d+)/i);
  if (m) return figSolid("prism", Number(m[1]), Number(m[2]), Number(m[3]));
  m = t.match(/An angle measures (\d+) degrees\. What type of angle/i);
  if (m) return figAngleType(Number(m[1]));

  // Statistics.
  m = t.match(/What is the (mean \(average\)|median|range) of: ([\d,\s]+)\?/i);
  if (m) {
    const values = m[2].split(",").map(v => Number(v.trim())).filter(v => isFinite(v));
    if (values.length) return figDataBars(values, `A bar chart of ${values.join(", ")}`);
  }
  m = t.match(/The mean of (\d+) numbers is (\d+)\. Four of them are ([\d,\s]+)\. What is the fifth/i);
  if (m) {
    const list = m[3].split(",").map(v => Number(v.trim())).filter(v => isFinite(v));
    if (list.length === 4) return figDataBars(list.concat([null]), "Five numbers, one unknown");
  }

  // Coordinates.
  m = t.match(/(?:points?|line through) \((-?\d+), (-?\d+)\) and \((-?\d+), (-?\d+)\)/i);
  if (m) {
    const p1 = { x: Number(m[1]), y: Number(m[2]) }, p2 = { x: Number(m[3]), y: Number(m[4]) };
    return figAxes([p1, p2], `Points (${p1.x}, ${p1.y}) and (${p2.x}, ${p2.y}) on a coordinate plane`, true);
  }
  m = t.match(/segment from \((-?\d+), (-?\d+)\) to \((-?\d+), (-?\d+)\)/i);
  if (m) {
    const p1 = { x: Number(m[1]), y: Number(m[2]) }, p2 = { x: Number(m[3]), y: Number(m[4]) };
    return figAxes([p1, p2], `A segment from (${p1.x}, ${p1.y}) to (${p2.x}, ${p2.y})`, true);
  }
  m = t.match(/^What is the ([xy])-coordinate of the point \((-?\d+), (-?\d+)\)/i);
  if (m) {
    const p = { x: Number(m[2]), y: Number(m[3]) };
    return figAxes([p], `Point (${p.x}, ${p.y}) on a coordinate plane`, false);
  }

  // Probability.
  m = t.match(/Rolling two six-sided dice, what is the probability the sum/i);
  if (m) return figDice(2, "Two dice");
  m = t.match(/probability of (?:rolling|flipping) .* (?:on|with) a die/i);
  if (m) return figDice(/twice/i.test(t) ? 2 : 1, "Rolling a die");

  return "";
}

function figTakeAway(total, noun, removed) {
  const n = Number(total), k = Number(removed);
  if (!isFinite(n) || !isFinite(k) || k > n || n > 24) return "";
  const ch = figCharFor(noun);
  const g = figEmojiRow(ch, n, n - k) + figText(170, 164, `how many ${noun} left?`, { size: 12, fill: FIG.muted });
  return figSvg(`${n} ${noun}, ${k} crossed out`, g);
}

function figSequenceLine(stepRaw, tail) {
  const clean = tail.replace(/\?$/, "").trim();
  const tokens = clean.split(/,\s*/).map(s => s.trim());
  const values = tokens.map(tok => /^\d+$/.test(tok) ? Number(tok) : null);
  const blank = values.findIndex(v => v === null);
  if (blank < 0) return "";
  const known = values.filter(v => v !== null);
  if (known.length < 2) return "";
  let step = stepRaw ? Number(stepRaw) : known[1] - known[0];
  if (!step) step = 1;
  const guess = blank === 0
    ? known[0] - step
    : (values[blank - 1] != null ? values[blank - 1] + step : known[0] + step * blank);
  const all = values.map((v, i) => v == null ? guess : v);
  const ticks = all.slice();
  const marks = all.map((v, i) => i === blank
    ? { v, label: "?", color: FIG.red }
    : { v, label: String(v) });
  return figNumberLine(Math.min.apply(null, all), Math.max.apply(null, all), ticks, marks, "A number line with a missing number");
}

// ---- Question pacing -------------------------------------------------------
// The chosen grade is only the starting point. Steady right answers ramp the
// questions up a third of a grade at a time, mixing questions from the current
// grade with the next one, so difficulty climbs over three steps instead of
// jumping a whole grade at once. A couple of misses eases the pace back down.

const LEVEL_STEP = 1 / 3;
const MAX_LEVEL = 12;

// How many right answers in a row it takes to move up one step. Short quizzes
// climb faster so a ten-question run still changes level, while long quizzes
// space the steps out so a fifty-question run has to earn each one.
function levelUpStreak(total) {
  const count = Number.isFinite(total) && total > 0 ? total : 10;
  if (count <= 12) return 1;
  if (count <= 35) return 2;
  return 3;
}

function roundLevel(value) {
  return Math.round(value * 3) / 3;
}

// The whole grade a fractional level sits in: 6.67 is still grade 6.
function wholeGradeOf(level) {
  return Math.max(0, Math.min(MAX_LEVEL, Math.floor(roundLevel(level) + 1e-9)));
}

function adaptiveFloor(grade) {
  return Math.max(0, grade - 2);
}

function takeQuestions(subject, grade, count) {
  const items = generateQuiz(subject, grade, count, state.focusTopic);
  return Array.isArray(items) ? items.slice(0, count) : [];
}

// Generate one batch at a time so a refill never repeats a question.
function questionSource(subject, grade, batch) {
  let pool = [];
  let cursor = 0;
  return function nextQuestion() {
    if (cursor >= pool.length) {
      const more = generateQuiz(subject, grade, batch, state.focusTopic);
      if (!Array.isArray(more) || !more.length) return null;
      pool = pool.concat(more);
    }
    return pool[cursor++] || null;
  };
}

function freshQuestions(subject, level, count) {
  const base = wholeGradeOf(level);
  const frac = Math.max(0, Math.min(1, roundLevel(level) - base));
  const harder = Math.round(count * frac);
  if (harder <= 0 || base >= MAX_LEVEL) return takeQuestions(subject, base, count);
  if (harder >= count) return takeQuestions(subject, base + 1, count);

  const lower = questionSource(subject, base, count);
  const upper = questionSource(subject, base + 1, count);
  const seen = new Set();
  const out = [];
  const pick = (source, allowRepeat) => {
    for (let tries = 0; tries < 60; tries++) {
      const item = source();
      if (!item) return null;
      if (!allowRepeat && seen.has(item.question)) continue;
      seen.add(item.question);
      return item;
    }
    return null;
  };

  for (let i = 0; i < count; i++) {
    // Spread the harder questions evenly through the set.
    const wantHarder = Math.round(((i + 1) * harder) / count) > Math.round((i * harder) / count);
    const preferred = wantHarder ? upper : lower;
    const other = wantHarder ? lower : upper;
    const item = pick(preferred, false) || pick(other, false) || pick(preferred, true) || pick(other, true);
    if (item) out.push(item);
  }
  if (out.length < count) out.push.apply(out, takeQuestions(subject, base, count - out.length));
  return out;
}

// Replace the unanswered stretch so the rest of the quiz matches the current pace.
function scheduleAdaptiveRemainder() {
  if (state.reviewMode || state.planMode) return;
  const remaining = state.questions.length - state.currentIndex - 1;
  if (remaining <= 0) return;
  const tail = freshQuestions(state.subject, state.level, remaining);
  if (tail.length) {
    state.questions = state.questions.slice(0, state.currentIndex + 1).concat(tail);
  }
}

function noteAnswer(isRight) {
  state.answerLog.push(!!isRight);
  const log = state.answerLog;
  const upStreak = levelUpStreak(state.questions.length || state.count);
  const downStreak = Math.max(2, upStreak);
  const sinceShift = log.length - state.lastShiftAt;
  let level = state.level;
  let movedUp = false;

  if (log.length >= upStreak && sinceShift >= upStreak && log.slice(-upStreak).every(Boolean) && level < MAX_LEVEL) {
    level = roundLevel(level + LEVEL_STEP);
    movedUp = true;
  } else if (log.length >= downStreak && sinceShift >= downStreak && log.slice(-downStreak).every(v => !v) && level > adaptiveFloor(state.startGrade)) {
    level = Math.max(adaptiveFloor(state.startGrade), roundLevel(level - LEVEL_STEP));
  }

  if (level !== state.level) {
    const gradeBefore = wholeGradeOf(state.level);
    state.level = level;
    state.lastShiftAt = log.length;
    const gradeNow = wholeGradeOf(level);
    if (state.startGrade != null && gradeNow > state.startGrade) {
      const reached = state.promotedTo == null ? state.startGrade : state.promotedTo;
      state.promotedTo = Math.max(reached, gradeNow);
    }
    scheduleAdaptiveRemainder();
    if (movedUp && gradeNow > gradeBefore) showLevelUpDialog(gradeNow, false);
  }
}

function formatTime(ms) {
  const total = Math.max(0, Math.round(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

    }
  }
  animate();
}

    showSetupScreen();

function openExitDialog() {
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="exitTitle">
      <div class="modal-emoji">\ud83e\udd14</div>
      <h2 class="modal-title" id="exitTitle">Leave the quiz?</h2>
      <p class="modal-text">Your score won&rsquo;t be saved, but you can always start a fresh quiz from the home screen.</p>
      <div class="modal-actions">
        <button class="btn-primary" id="stayBtn" type="button">Keep playing</button>
        <button class="btn-ghost" id="leaveBtn" type="button">Go to home screen</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);

  const close = () => {
    document.removeEventListener("keydown", onKey);
    backdrop.remove();
  };
  const onKey = (event) => {
    if (event.key === "Escape") {
      event.preventDefault();
      close();
    }
  };

  document.getElementById("stayBtn").addEventListener("click", close);
  document.getElementById("leaveBtn").addEventListener("click", () => {
    close();
    showSetupScreen();
  });
  backdrop.addEventListener("click", (event) => {
    if (event.target === backdrop) close();
  });
  document.addEventListener("keydown", onKey);
  document.getElementById("stayBtn").focus({ preventScroll: true });
}

function startTimer() {
  if (state.timerId) return;
  state.timerId = setInterval(updateTimerLabel, 500);
}

function stopTimer() {
  if (state.timerId) {
    clearInterval(state.timerId);
    state.timerId = null;
  }
}

function updateTimerLabel() {
  const chip = document.getElementById("timerChip");
  if (!chip || !state.startedAt) return;
  chip.textContent = formatTime(Date.now() - state.startedAt);
}

// ---- Explanations for missed questions -------------------------------------
// Questions are generated, so the working is rebuilt from the question itself:
// exact sums are recomputed, word problems are re-solved from their numbers, and
// anything else gets a subject-specific method to follow.

function qbExplainTidy(value) {
  if (!isFinite(value)) return "";
  return String(Math.round(value * 1000) / 1000);
}

function qbExplainSymbol(raw) {
  if (raw === "*" || raw === "x" || raw === "X") return "\u00d7";
  if (raw === "/") return "\u00f7";
  if (raw === "-" || raw === "\u2013") return "\u2212";
  return raw;
}

function qbExplainApply(a, op, b) {
  if (op === "+") return a + b;
  if (op === "\u2212") return a - b;
  if (op === "\u00d7") return a * b;
  if (op === "\u00f7") return b === 0 ? NaN : a / b;
  return NaN;
}

function qbExplainNumber(text) {
  const raw = String(text == null ? "" : text).replace(/,/g, "");
  if (raw.indexOf("/") !== -1) return NaN; // a fraction, not one number
  const match = raw.match(/-?\d+(?:\.\d+)?/);
  return match ? parseFloat(match[0]) : NaN;
}

function qbExplainPhrase(a, op, b, result) {
  const left = qbExplainTidy(a);
  const right = qbExplainTidy(b);
  const out = qbExplainTidy(result);
  if (op === "+") return `Add: ${left} + ${right} = ${out}.`;
  if (op === "\u2212") return `Subtract: ${left} \u2212 ${right} = ${out}.`;
  if (op === "\u00d7") return `Multiply: ${left} \u00d7 ${right} = ${out}.`;
  return `Divide: ${left} \u00f7 ${right} = ${out}.`;
}

// A sum written out in the question, e.g. "18 + 7 = ?" or "What is 12 \u00d7 4?".
function qbExplainSum(text, target) {
  const re = /(-?\d+(?:\.\d+)?)\s*([+\-\u2212\u2013\u00d7xX*\u00f7/])\s*\(?\s*(-?\d+(?:\.\d+)?)/g;
  let match;
  while ((match = re.exec(text))) {
    const a = parseFloat(match[1]);
    const op = qbExplainSymbol(match[2]);
    const b = parseFloat(match[3]);
    const result = qbExplainApply(a, op, b);
    if (isFinite(result) && Math.abs(result - target) < 0.001) {
      return [qbExplainPhrase(a, op, b, result)];
    }
  }
  return null;
}

function qbExplainNums(text) {
  return (String(text).match(/\d+(?:\.\d+)?/g) || []).map(Number).filter(value => isFinite(value));
}

// "25% of 80", "20% off $80" and "a 10% tip on $88", worked step by step.
function qbExplainPercentSteps(text, target) {
  const match = text.match(/(\d+(?:\.\d+)?)\s*%/);
  if (!match) return null;
  const percent = parseFloat(match[1]);
  if (!isFinite(percent) || percent <= 0) return null;
  const others = qbExplainNums(text).filter(value => value !== percent);
  const base = others.length ? others[0] : percent;
  if (!isFinite(base) || base <= 0) return null;
  const share = percent / 100;
  const part = base * share;
  const steps = [
    `Percent means "out of 100": ${qbExplainTidy(percent)}% = ${qbExplainTidy(percent)} \u00f7 100 = ${qbExplainTidy(share)}.`,
    `Multiply the amount by that: ${qbExplainTidy(share)} \u00d7 ${qbExplainTidy(base)} = ${qbExplainTidy(part)}.`,
  ];

  if (Math.abs(part - target) <= 0.001) return steps;
  if (Math.abs(base - part - target) <= 0.6) {
    return steps.concat(`That is the amount taken off, so subtract it from the whole: ${qbExplainTidy(base)} \u2212 ${qbExplainTidy(part)} = ${qbExplainTidy(base - part)}.`);
  }
  if (Math.abs(base + part - target) <= 0.6) {
    return steps.concat(`Add it on for the total: ${qbExplainTidy(base)} + ${qbExplainTidy(part)} = ${qbExplainTidy(base + part)}, which rounds to ${qbExplainTidy(target)}.`);
  }
  return null;
}

// A fraction answer such as "9/11".
function qbExplainFraction(value) {
  const match = String(value == null ? "" : value).match(/^(-?\d+)\s*\/\s*(\d+)$/);
  if (!match) return null;
  const num = parseInt(match[1], 10);
  const den = parseInt(match[2], 10);
  if (!den) return null;
  return { num: num, den: den };
}

function qbExplainGcd(a, b) {
  let x = Math.abs(a);
  let y = Math.abs(b);
  while (y) { const t = y; y = x % y; x = t; }
  return x || 1;
}

// Adding, multiplying and dividing fractions, equivalent fractions and probability.
function qbExplainFractionMatches(num, den, correct) {
  const answer = qbExplainFraction(correct);
  if (answer) return answer.num * den === answer.den * num;
  return qbExplainClose(num / den, qbExplainValue(correct));
}

function qbExplainFractionSteps(text, correct) {
  const times = text.match(/(\d+)\s*\/\s*(\d+)\s*[x\u00d7*]\s*(\d+)\s*\/\s*(\d+)/i);
  if (times) {
    const a = parseInt(times[1], 10), b = parseInt(times[2], 10);
    const c = parseInt(times[3], 10), d = parseInt(times[4], 10);
    const num = a * c;
    const den = b * d;
    if (!qbExplainFractionMatches(num, den, correct)) return null;
    const reduced = qbExplainReduced(num, den);
    return [
      "Multiply the top numbers together and the bottom numbers together.",
      `${a} \u00d7 ${c} = ${num} on top, ${b} \u00d7 ${d} = ${den} on the bottom: ${num}/${den}.`,
      reduced.g > 1 ? `Simplify by ${reduced.g}: ${num}/${den} = ${reduced.num}/${reduced.den}.` : "That is already in simplest form.",
    ];
  }

  const divide = text.match(/(\d+)\s*\/\s*(\d+)\s*\/\s*(\d+)\s*\/\s*(\d+)/);
  if (divide) {
    const a = parseInt(divide[1], 10), b = parseInt(divide[2], 10);
    const c = parseInt(divide[3], 10), d = parseInt(divide[4], 10);
    if (!c) return null;
    const num = a * d;
    const den = b * c;
    if (!qbExplainFractionMatches(num, den, correct)) return null;
    const reduced = qbExplainReduced(num, den);
    return [
      `Dividing by ${c}/${d} is the same as multiplying by its reciprocal, ${d}/${c}.`,
      `So ${a}/${b} \u00d7 ${d}/${c} = ${num}/${den}${reduced.g > 1 ? `, which simplifies to ${reduced.num}/${reduced.den}` : ""}.`,
    ];
  }

  const add = text.match(/(\d+)\s*\/\s*(\d+)\s*\+\s*(\d+)\s*\/\s*(\d+)/);
  if (add) {
    const a = parseInt(add[1], 10), b = parseInt(add[2], 10);
    const c = parseInt(add[3], 10), d = parseInt(add[4], 10);
    const lcm = (b * d) / qbExplainGcd(b, d);
    const sum = a * (lcm / b) + c * (lcm / d);
    if (!qbExplainFractionMatches(sum, lcm, correct)) return null;
    const reduced = qbExplainReduced(sum, lcm);
    const simplifyNote = reduced.g > 1 ? `, then simplify by ${reduced.g} to get ${reduced.num}/${reduced.den}` : "";
    if (b === d) {
      return [
        `The bottom numbers match, so add the top numbers: ${a} + ${c} = ${sum}.`,
        `Keep the bottom number: ${sum}/${b}${simplifyNote}.`,
      ];
    }
    return [
      `Make the bottom numbers match: ${a}/${b} = ${a * (lcm / b)}/${lcm} and ${c}/${d} = ${c * (lcm / d)}/${lcm}.`,
      `Add the top numbers: ${a * (lcm / b)} + ${c * (lcm / d)} = ${sum} over ${lcm}${simplifyNote}.`,
    ];
  }

  const ofNumber = text.match(/What is (\d+)\s*\/\s*(\d+) of (\d+)/i);
  if (ofNumber) {
    const num = parseInt(ofNumber[1], 10), den = parseInt(ofNumber[2], 10), whole = parseInt(ofNumber[3], 10);
    if (!den) return null;
    const value = (whole / den) * num;
    if (!qbExplainClose(value, qbExplainValue(correct))) return null;
    return [
      `Divide the whole by the bottom number to find one part: ${whole} \u00f7 ${den} = ${qbExplainTidy(whole / den)}.`,
      `Then take ${num} of those parts: ${num} \u00d7 ${qbExplainTidy(whole / den)} = ${qbExplainTidy(value)}.`,
    ];
  }

  const equivalent = text.match(/equivalent to (\d+)\s*\/\s*(\d+)/i);
  if (equivalent) {
    const a = parseInt(equivalent[1], 10);
    const b = parseInt(equivalent[2], 10);
    const answer = qbExplainFraction(correct);
    if (!answer) return null;
    if (a * answer.den !== b * answer.num || a === answer.num) return null;
    const factor = answer.num / a;
    return [
      "Multiplying the top and bottom by the same number keeps the fraction's value.",
      `${a} \u00d7 ${factor} = ${answer.num} and ${b} \u00d7 ${factor} = ${answer.den}.`,
      `So ${a}/${b} = ${answer.num}/${answer.den}.`,
    ];
  }

  const bag = text.match(/has (\d+) marbles?, (\d+) of which are red/i);
  if (bag) {
    const total = parseInt(bag[1], 10);
    const red = parseInt(bag[2], 10);
    if (!qbExplainFractionMatches(red, total, correct)) return null;
    const reduced = qbExplainReduced(red, total);
    return [
      `Probability is favourable outcomes over all outcomes: ${red} red out of ${total} marbles is ${red}/${total}.`,
      reduced.g > 1 ? `Simplify by ${reduced.g}: ${red}/${total} = ${reduced.num}/${reduced.den}.` : "That is already in simplest form.",
    ];
  }
  return null;
}

const QB_SHAPE_SIDES = {
  triangle: 3, quadrilateral: 4, square: 4, rectangle: 4, rhombus: 4,
  parallelogram: 4, trapezoid: 4, pentagon: 5, hexagon: 6, heptagon: 7,
  octagon: 8, nonagon: 9, decagon: 10, circle: 0,
};

function qbExplainShapeSteps(text, target, correct) {
  const lower = text.toLowerCase();
  if (!/shape|sides/.test(lower)) return null;

  const named = lower.match(/how many sides does (?:a|an) ([a-z]+) have/);
  if (named) {
    const namedSides = QB_SHAPE_SIDES[named[1]];
    if (namedSides == null || !isFinite(target) || namedSides !== target) return null;
    return [`A ${named[1]} has ${namedSides} straight sides.`, `Counting around the shape gives ${namedSides}.`];
  }

  const name = String(correct).toLowerCase();
  if (!Object.prototype.hasOwnProperty.call(QB_SHAPE_SIDES, name)) return null;
  const sides = QB_SHAPE_SIDES[name];
  const wanted = lower.match(/which shape (?:has|is) (.+)/);
  if (!wanted) return null;
  if (name === "circle") {
    if (!/round|no corners|no sides/.test(wanted[1])) return null;
    return ["A circle is round, with no straight sides and no corners.", "So the shape described is a circle."];
  }
  const stated = (wanted[1].match(/\d+/) || [])[0];
  if (stated == null || Number(stated) !== sides) return null;
  return [
    `A ${name} has ${sides} straight sides${/same length|equal/.test(wanted[1]) ? ", all the same length" : ""}.`,
    `That matches the question, so the shape is a ${name}.`,
  ];
}

function qbExplainClockSteps(text, correct) {
  const lower = text.toLowerCase();
  const hourMatch = lower.match(/(\d{1,2})/);
  if (!hourMatch) return null;
  const hour = parseInt(hourMatch[1], 10);
  let time = null;
  let steps = null;
  if (/half past/.test(lower)) {
    time = `${hour}:30`;
    steps = ["Half past means 30 minutes after the hour.", `The hour stays ${hour}, so the time is ${time}.`];
  } else if (/quarter past/.test(lower)) {
    time = `${hour}:15`;
    steps = ["Quarter past means 15 minutes after the hour.", `The hour stays ${hour}, so the time is ${time}.`];
  } else if (/quarter to/.test(lower)) {
    time = `${hour}:45`;
    steps = ["Quarter to means 15 minutes before the next hour, which is 45 minutes past this one.", `The time is ${time}.`];
  } else if (/o'clock/.test(lower)) {
    time = `${hour}:00`;
    steps = ["O'clock means exactly on the hour, with 0 minutes past it.", `So the time is ${time}.`];
  }
  if (!time) return null;
  if (String(correct).replace(/[^0-9:]/g, "") !== time) return null;
  return steps;
}

function qbExplainAngleSteps(text, correct) {
  const lower = text.toLowerCase();
  if (!/angle/.test(lower)) return null;
  const size = lower.match(/(\d+(?:\.\d+)?)\s*degrees?/);
  if (!size) return null;
  const degrees = parseFloat(size[1]);
  let kind = null;
  let why = "";
  if (degrees > 0 && degrees < 90) { kind = "acute"; why = "less than 90 degrees, so it is smaller than a right angle"; }
  else if (degrees === 90) { kind = "right"; why = "exactly 90 degrees, which makes a square corner"; }
  else if (degrees > 90 && degrees < 180) { kind = "obtuse"; why = "more than 90 but less than 180 degrees"; }
  else if (degrees === 180) { kind = "straight"; why = "exactly 180 degrees, which makes a straight line"; }
  else if (degrees > 180) { kind = "reflex"; why = "more than 180 degrees"; }
  if (!kind || String(correct).toLowerCase().indexOf(kind) === -1) return null;
  const article = kind === "acute" || kind === "obtuse" ? "an" : "a";
  return [`An angle of ${qbExplainTidy(degrees)} degrees is ${why}.`, `That makes it ${article} ${kind} angle.`];
}

// "A film starts at 7:45 and lasts 1 hour 45 minutes. What time does it end?"
function qbExplainElapsedSteps(text, correct) {
  const match = text.match(/starts at (\d{1,2}):(\d{2}).*?lasts (\d+)\s*hours?\s*(\d+)?\s*minutes?/i);
  if (!match) return null;
  const startHour = parseInt(match[1], 10);
  const startMin = parseInt(match[2], 10);
  const addHours = parseInt(match[3], 10);
  const addMin = match[4] ? parseInt(match[4], 10) : 0;
  const total = ((startHour * 60 + startMin) + addHours * 60 + addMin) % (24 * 60);
  const time = `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
  if (String(correct).replace(/[^0-9:]/g, "") !== time) return null;
  const added = addMin ? `${startMin} + ${addMin} = ${startMin + addMin} minutes, so carry a whole hour once it passes 60` : `${startMin} minutes plus nothing, so the minutes stay the same`;
  return [
    `Add the minutes first: ${added}.`,
    `Then add the full hours: ${startHour} + ${addHours} = ${startHour + addHours}.`,
    `Starting at ${startHour}:${String(startMin).padStart(2, "0")} and moving forward ${addHours} hour${addHours === 1 ? "" : "s"} ${addMin} minutes ends at ${time}.`,
  ];
}

function qbExplainShadedSteps(text, correct) {
  const match = text.match(/(\d+) out of (\d+) equal parts/i);
  if (!match) return null;
  if (String(correct).replace(/\s/g, "") !== `${match[1]}/${match[2]}`) return null;
  return [
    `The bottom number of a fraction is how many equal parts there are in all: ${match[2]}.`,
    `The top number is how many of them are shaded: ${match[1]}.`,
    `So the shaded fraction is ${match[1]}/${match[2]}.`,
  ];
}

function qbExplainFractionCompareSteps(text, correct) {
  const match = text.match(/which fraction is the (greatest|least|largest|smallest)/i);
  if (!match) return null;
  const parts = text.match(/\d+\s*\/\s*\d+/g) || [];
  if (parts.length < 2) return null;
  const options = parts.map(item => {
    const bits = item.split("/");
    const top = parseInt(bits[0], 10);
    const bottom = parseInt(bits[1], 10);
    return { label: `${top}/${bottom}`, value: bottom ? top / bottom : NaN };
  }).filter(item => isFinite(item.value));
  if (options.length < 2) return null;
  const wantsLeast = /least|smallest/i.test(match[1]);
  const best = options.reduce((winner, item) => {
    if (wantsLeast) return item.value < winner.value ? item : winner;
    return item.value > winner.value ? item : winner;
  });
  if (String(correct).replace(/\s/g, "") !== best.label) return null;
  return [
    `Turn each fraction into a decimal by dividing the top number by the bottom: ${options.map(item => `${item.label} \u2248 ${qbExplainTidy(item.value)}`).join(", ")}.`,
    `The ${wantsLeast ? "smallest" : "largest"} decimal is ${qbExplainTidy(best.value)}, so ${best.label} is the answer.`,
  ];
}

function qbExplainCompareSteps(text, target, correct) {
  if (!/which (?:number|decimal) is (?:greater|bigger|larger|smaller|less)/i.test(text)) return null;
  const nums = qbExplainNums(text);
  if (nums.length < 2) return null;
  const a = nums[0];
  const b = nums[1];
  const wantsSmaller = /smaller|less/i.test(text);
  const answer = wantsSmaller ? Math.min(a, b) : Math.max(a, b);
  const other = wantsSmaller ? Math.max(a, b) : Math.min(a, b);
  if (Math.abs(answer - target) > 0.001) return null;
  if (String(correct).replace(/,/g, "").indexOf(qbExplainTidy(answer)) === -1) return null;
  return [
    `Compare the digits from the left: ${qbExplainTidy(a)} against ${qbExplainTidy(b)}.`,
    `${qbExplainTidy(answer)} is ${wantsSmaller ? "smaller" : "greater"} than ${qbExplainTidy(other)}, so the answer is ${qbExplainTidy(answer)}.`,
  ];
}

// "Which is the better buy: 4 items for $7 or 8 items for $15.20?"
function qbExplainBetterBuySteps(text, correct) {
  if (!/better buy/i.test(text)) return null;
  const offers = [];
  const pattern = /(\d+)\s*(?:items?)?\s+for\s+\$(\d+(?:\.\d+)?)/gi;
  let match = pattern.exec(text);
  while (match) {
    offers.push({ qty: parseFloat(match[1]), cost: parseFloat(match[2]) });
    match = pattern.exec(text);
  }
  if (offers.length !== 2) return null;
  offers.forEach(offer => { offer.unit = offer.cost / offer.qty; });
  const first = offers[0], second = offers[1];
  if (Math.abs(first.unit - second.unit) < 0.001) return null;
  const cheap = first.unit < second.unit ? first : second;
  const dear = cheap === first ? second : first;
  const correctMatch = String(correct).match(/(\d+)\s*for\s*\$(\d+(?:\.\d+)?)/i);
  if (!correctMatch) return null;
  if (parseFloat(correctMatch[1]) !== cheap.qty || Math.abs(parseFloat(correctMatch[2]) - cheap.cost) > 0.001) return null;
  const money = value => "$" + (Number.isInteger(value) ? String(value) : value.toFixed(2));
  const label = offer => `${offer.qty} for ${money(offer.cost)}`;
  return [
    "Find the price of one item: divide each total price by the number of items in that deal.",
    `${label(first)}: ${money(first.cost)} \u00f7 ${first.qty} = $${first.unit.toFixed(2)} per item.`,
    `${label(second)}: ${money(second.cost)} \u00f7 ${second.qty} = $${second.unit.toFixed(2)} per item.`,
    `$${cheap.unit.toFixed(2)} is the lower price per item, so ${label(cheap)} is the better buy.`,
  ];
}

// "A pencil costs 31 cents. You buy 4 of them and pay with $2."
function qbExplainChangeSteps(text, target) {
  const match = text.match(/costs (\d+) cents.*?buy (\d+).*?pay with \$(\d+)/i);
  if (!match) return null;
  const price = parseFloat(match[1]);
  const quantity = parseFloat(match[2]);
  const paid = parseFloat(match[3]) * 100;
  const spent = price * quantity;
  const change = paid - spent;
  if (Math.abs(change - target) > 0.001) return null;
  return [
    `Work out the cost first: ${qbExplainTidy(price)} \u00d7 ${qbExplainTidy(quantity)} = ${qbExplainTidy(spent)} cents.`,
    `Turn what was paid into cents: $${qbExplainTidy(paid / 100)} = ${qbExplainTidy(paid)} cents.`,
    `Subtract: ${qbExplainTidy(paid)} \u2212 ${qbExplainTidy(spent)} = ${qbExplainTidy(change)} cents of change.`,
  ];
}

function qbExplainFactorSteps(text, target) {
  const match = text.match(/greatest factor of (\d+) other than \1/i);
  if (!match) return null;
  const value = parseInt(match[1], 10);
  let smallest = null;
  for (let i = 2; i * i <= value; i++) {
    if (value % i === 0) { smallest = i; break; }
  }
  if (!smallest) return null;
  const factor = value / smallest;
  if (factor !== target) return null;
  return [
    "The biggest factor below a number comes from dividing it by its smallest factor.",
    `${smallest} is the smallest number that divides ${value} evenly, and ${value} \u00f7 ${smallest} = ${factor}.`,
    `So the greatest factor other than ${value} itself is ${factor}.`,
  ];
}

function qbExplainLcmSteps(text, target) {
  const match = text.match(/least common multiple.*?of (\d+) and (\d+)/i);
  if (!match) return null;
  const a = parseInt(match[1], 10);
  const b = parseInt(match[2], 10);
  const gcd = qbExplainGcd(a, b);
  const value = (a * b) / gcd;
  if (value !== target) return null;
  return [
    `You need the smallest number that both ${a} and ${b} divide into exactly.`,
    `Multiply them and divide by their greatest common factor: ${a} \u00d7 ${b} = ${a * b}, and ${a * b} \u00f7 ${gcd} = ${value}.`,
    `So the least common multiple is ${value}.`,
  ];
}

const QB_COIN_VALUES = { quarter: 25, dime: 10, nickel: 5, penny: 1 };

function qbExplainCoinSteps(text, target) {
  if (!/quarter|dime|nickel|penn/i.test(text)) return null;
  const re = /(\d+)\s*(quarters?|dimes?|nickels?|pennies|pennys?)/gi;
  const steps = [];
  let total = 0;
  let found = false;
  let match;
  while ((match = re.exec(text))) {
    const count = parseInt(match[1], 10);
    const key = match[2].toLowerCase().replace(/s$/, "").replace("pennie", "penny");
    const value = QB_COIN_VALUES[key];
    if (!value) continue;
    found = true;
    total += count * value;
    if (count > 0) steps.push(`${count} \u00d7 ${value} = ${count * value} cents in ${key}${count === 1 ? "" : "s"}.`);
  }
  if (!found || Math.abs(total - target) > 0.001) return null;
  steps.push(`Add them up: ${total} cents.`);
  return steps;
}

// Three-term expressions where order of operations matters, e.g. "4 + 5 x 5".
function qbExplainExpressionSteps(text, target) {
  const match = text.match(/(-?\d+(?:\.\d+)?)\s*([+\-\u2212\u2013\u00d7xX*\u00f7/])\s*\(?\s*(-?\d+(?:\.\d+)?)\s*([+\-\u2212\u2013\u00d7xX*\u00f7/])\s*\(?\s*(-?\d+(?:\.\d+)?)/);
  if (!match) return null;
  const a = parseFloat(match[1]);
  const op1 = qbExplainSymbol(match[2]);
  const b = parseFloat(match[3]);
  const op2 = qbExplainSymbol(match[4]);
  const c = parseFloat(match[5]);
  const strong = op => op === "\u00d7" || op === "\u00f7";
  let mid, out, steps;
  if (strong(op2) && !strong(op1)) {
    mid = qbExplainApply(b, op2, c);
    out = qbExplainApply(a, op1, mid);
    steps = [
      `Multiply or divide before adding or subtracting: ${qbExplainTidy(b)} ${op2} ${qbExplainTidy(c)} = ${qbExplainTidy(mid)}.`,
      `Then add or subtract: ${qbExplainTidy(a)} ${op1} ${qbExplainTidy(mid)} = ${qbExplainTidy(out)}.`,
    ];
  } else {
    mid = qbExplainApply(a, op1, b);
    out = qbExplainApply(mid, op2, c);
    steps = [
      `Work from left to right: ${qbExplainTidy(a)} ${op1} ${qbExplainTidy(b)} = ${qbExplainTidy(mid)}.`,
      `Then ${qbExplainTidy(mid)} ${op2} ${qbExplainTidy(c)} = ${qbExplainTidy(out)}.`,
    ];
  }
  if (!isFinite(out) || Math.abs(out - target) > 0.001) return null;
  return steps;
}

function qbExplainRemainderSteps(text, target) {
  const match = text.match(/remainder when (\d+) is divided by (\d+)/i);
  if (!match) return null;
  const value = parseInt(match[1], 10);
  const divisor = parseInt(match[2], 10);
  if (!divisor) return null;
  const times = Math.floor(value / divisor);
  const rest = value - times * divisor;
  if (rest !== target) return null;
  return [
    `${divisor} goes into ${value} ${times} ${times === 1 ? "time" : "times"}: ${divisor} \u00d7 ${times} = ${times * divisor}.`,
    `What is left over is the remainder: ${value} \u2212 ${times * divisor} = ${rest}.`,
  ];
}

function qbExplainRoundingSteps(text, target) {
  const match = text.match(/round ([\d,]+) to the nearest (ten|hundred|thousand)/i);
  if (!match) return null;
  const value = Number(match[1].replace(/,/g, ""));
  const place = match[2].toLowerCase();
  const scale = place === "ten" ? 10 : place === "hundred" ? 100 : 1000;
  const rounded = Math.round(value / scale) * scale;
  if (rounded !== target) return null;
  const next = Math.floor(value / (scale / 10)) % 10;
  return [
    `To round to the nearest ${place}, look at the digit just after it: ${next}.`,
    next >= 5 ? `That is 5 or more, so round up to ${rounded}.` : `That is less than 5, so round down to ${rounded}.`,
  ];
}

function qbExplainSciSteps(text, target) {
  const match = text.match(/(\d+(?:\.\d+)?)\s*[x\u00d7*]\s*10\^(\d+)/i);
  if (!match) return null;
  const base = parseFloat(match[1]);
  const exponent = parseInt(match[2], 10);
  const value = base * Math.pow(10, exponent);
  if (Math.abs(value - target) > 0.001) return null;
  return [
    `10^${exponent} is a 1 with ${exponent} zeros after it.`,
    `Moving the decimal point in ${qbExplainTidy(base)} ${exponent} places to the right gives ${Math.round(value).toLocaleString("en-US")}.`,
  ];
}

function qbExplainCoordSteps(text, target) {
  const lower = text.toLowerCase();
  if (!/coordinate/.test(lower)) return null;
  const point = text.match(/\(\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*\)/);
  if (!point) return null;
  const x = parseFloat(point[1]);
  const y = parseFloat(point[2]);
  const wantsY = /y-coordinate/.test(lower);
  const value = wantsY ? y : x;
  if (Math.abs(value - target) > 0.001) return null;
  return [
    "A point is written (x, y), so the first number is x and the second is y.",
    `In (${qbExplainTidy(x)}, ${qbExplainTidy(y)}): x = ${qbExplainTidy(x)} and y = ${qbExplainTidy(y)}.`,
    `So the ${wantsY ? "y" : "x"}-coordinate is ${qbExplainTidy(value)}.`,
  ];
}

function qbExplainGeometrySteps(text, target) {
  const lower = text.toLowerCase();
  const radiusMatch = lower.match(/radius(?: of)?\s*(\d+(?:\.\d+)?)/);
  const diameterMatch = lower.match(/diameter(?: of)?\s*(\d+(?:\.\d+)?)/);
  const baseMatch = lower.match(/base(?: of)?\s*(\d+(?:\.\d+)?)/);
  const heightMatch = lower.match(/height(?: of)?\s*(\d+(?:\.\d+)?)/);
  const lengthMatch = lower.match(/length\s*(\d+(?:\.\d+)?)/);
  const widthMatch = lower.match(/width\s*(\d+(?:\.\d+)?)/);
  const pi = 3.14;

  if (/circle/.test(lower) && (radiusMatch || diameterMatch)) {
    const radius = radiusMatch ? parseFloat(radiusMatch[1]) : parseFloat(diameterMatch[1]) / 2;
    const lead = radiusMatch
      ? `The radius is ${qbExplainTidy(radius)}.`
      : `The diameter is ${qbExplainTidy(radius * 2)}, so the radius is half of it: ${qbExplainTidy(radius)}.`;
    if (/area/.test(lower)) {
      const area = pi * radius * radius;
      if (Math.abs(area - target) > 0.6) return null;
      return [
        lead,
        `Area of a circle is \u03c0 \u00d7 r \u00d7 r: 3.14 \u00d7 ${qbExplainTidy(radius)} \u00d7 ${qbExplainTidy(radius)} = ${qbExplainTidy(area)}, which rounds to ${qbExplainTidy(target)}.`,
      ];
    }
    if (/circumference/.test(lower)) {
      const around = 2 * pi * radius;
      if (Math.abs(around - target) > 0.6) return null;
      return [
        lead,
        `Circumference is 2 \u00d7 \u03c0 \u00d7 r: 2 \u00d7 3.14 \u00d7 ${qbExplainTidy(radius)} = ${qbExplainTidy(around)}, which rounds to ${qbExplainTidy(target)}.`,
      ];
    }
  }

  if (/cylinder/.test(lower) && radiusMatch && heightMatch) {
    const radius = parseFloat(radiusMatch[1]);
    const height = parseFloat(heightMatch[1]);
    const volume = Math.PI * radius * radius * height;
    if (Math.abs(volume - target) > 0.6) return null;
    return [
      "Volume of a cylinder is \u03c0 \u00d7 r\u00b2 \u00d7 height.",
      `r\u00b2 = ${qbExplainTidy(radius * radius)}, so \u03c0 \u00d7 ${qbExplainTidy(radius * radius)} \u00d7 ${qbExplainTidy(height)} = ${qbExplainTidy(volume)}, which rounds to ${qbExplainTidy(target)}.`,
    ];
  }

  if (/surface area/.test(lower) && lengthMatch && widthMatch && heightMatch) {
    const length = parseFloat(lengthMatch[1]);
    const width = parseFloat(widthMatch[1]);
    const height = parseFloat(heightMatch[1]);
    const surface = 2 * (length * width + length * height + width * height);
    if (Math.abs(surface - target) > 0.001) return null;
    return [
      "A rectangular prism has 3 pairs of matching faces.",
      `length \u00d7 width = ${qbExplainTidy(length * width)}, length \u00d7 height = ${qbExplainTidy(length * height)}, width \u00d7 height = ${qbExplainTidy(width * height)}.`,
      `Add the three and double it: 2 \u00d7 (${qbExplainTidy(length * width)} + ${qbExplainTidy(length * height)} + ${qbExplainTidy(width * height)}) = ${qbExplainTidy(surface)}.`,
    ];
  }

  if (/hypotenuse/.test(lower)) {
    const legs = lower.match(/legs?\s*(\d+(?:\.\d+)?)\s*and\s*(\d+(?:\.\d+)?)/);
    if (!legs) return null;
    const a = parseFloat(legs[1]);
    const b = parseFloat(legs[2]);
    const c = Math.sqrt(a * a + b * b);
    if (Math.abs(c - target) > 0.001) return null;
    return [
      "The Pythagorean theorem says a\u00b2 + b\u00b2 = c\u00b2 in a right triangle.",
      `${qbExplainTidy(a)}\u00b2 + ${qbExplainTidy(b)}\u00b2 = ${qbExplainTidy(a * a)} + ${qbExplainTidy(b * b)} = ${qbExplainTidy(a * a + b * b)}.`,
      `The hypotenuse is the square root: \u221a${qbExplainTidy(a * a + b * b)} = ${qbExplainTidy(c)}.`,
    ];
  }

  if (/triangle/.test(lower) && /area/.test(lower) && baseMatch && heightMatch) {
    const base = parseFloat(baseMatch[1]);
    const height = parseFloat(heightMatch[1]);
    const area = (base * height) / 2;
    if (Math.abs(area - target) > 0.001) return null;
    return [
      "The area of a triangle is half of base \u00d7 height.",
      `${qbExplainTidy(base)} \u00d7 ${qbExplainTidy(height)} = ${qbExplainTidy(base * height)}.`,
      `Half of that: ${qbExplainTidy(base * height)} \u00f7 2 = ${qbExplainTidy(area)}.`,
    ];
  }

  if (/perimeter/.test(lower)) {
    const nums = qbExplainNums(lower);
    if (nums.length < 2) return null;
    const a = nums[0];
    const b = nums[1];
    const perimeter = 2 * (a + b);
    if (Math.abs(perimeter - target) > 0.001) return null;
    return [
      "Perimeter is the distance all the way around the shape.",
      `Two sides are ${qbExplainTidy(a)} and two are ${qbExplainTidy(b)}: ${qbExplainTidy(a)} + ${qbExplainTidy(b)} = ${qbExplainTidy(a + b)}.`,
      `Double that pair: 2 \u00d7 ${qbExplainTidy(a + b)} = ${qbExplainTidy(perimeter)}.`,
    ];
  }

  return null;
}

function qbExplainTensSteps(text, target) {
  const match = text.match(/how many tens (?:are )?(?:there )?in (?:the number )?(\d+)/i);
  if (!match) return null;
  const value = parseInt(match[1], 10);
  const tens = Math.floor(value / 10);
  if (tens !== target) return null;
  return [
    `Split ${value} into tens and ones: ${value} = ${tens} \u00d7 10 + ${value % 10}.`,
    `So there are ${tens} tens.`,
  ];
}

function qbExplainAfterSteps(text, target) {
  const match = text.match(/comes (?:right )?after (\d+)/i);
  if (!match) return null;
  const value = parseInt(match[1], 10);
  if (value + 1 !== target) return null;
  return [`Counting on one step from ${value} lands on ${value + 1}.`];
}

// "How many pictures do you see?" - count the pictures in the question.
function qbExplainCountSteps(text, target) {
  if (!/how many/i.test(text)) return null;
  const symbols = String(text).match(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}]/gu);
  if (!symbols || !symbols.length) return null;
  const counts = {};
  symbols.forEach(symbol => { counts[symbol] = (counts[symbol] || 0) + 1; });
  const symbol = Object.keys(counts).find(key => counts[key] === target || counts[key] - 1 === target);
  if (!symbol) return null;
  const count = counts[symbol] === target ? target : counts[symbol] - 1;
  const list = [];
  for (let i = 1; i <= count && i <= 8; i++) list.push(i);
  return [
    `Point at each picture and count: ${list.join(", ")}${count > 8 ? ", and so on" : ""}.`,
    `There ${count === 1 ? "is" : "are"} ${count} of them.`,
  ];
}

// Number patterns such as "6, 12, 18, 24, ___?".
function qbExplainPattern(text, target) {
  if (!/next|pattern|sequence|continues/i.test(text)) return null;
  const nums = (text.match(/-?\d+(?:\.\d+)?/g) || []).map(Number).filter(v => isFinite(v));
  if (nums.length < 3) return null;
  const step = nums[1] - nums[0];
  for (let i = 1; i < nums.length; i++) {
    if (Math.abs(nums[i] - nums[i - 1] - step) > 1e-9) return null;
  }
  const last = nums[nums.length - 1];
  const next = last + step;
  if (!isFinite(next) || Math.abs(next - target) > 0.001) return null;
  return [
    `The same amount is ${step >= 0 ? "added" : "subtracted"} each time: ${qbExplainTidy(Math.abs(step))}.`,
    `Continue from ${qbExplainTidy(last)}: ${qbExplainTidy(last)} ${step >= 0 ? "+" : "\u2212"} ${qbExplainTidy(Math.abs(step))} = ${qbExplainTidy(next)}.`,
  ];
}

// Word problems: find the arithmetic on the numbers in the question that lands
// exactly on the correct answer, so the working shown is real.
function qbExplainHunt(text, target) {
  const nums = [];
  (text.match(/\d+(?:\.\d+)?/g) || []).forEach(raw => {
    const value = parseFloat(raw);
    if (!isFinite(value) || value === 0 || nums.indexOf(value) !== -1 || nums.length >= 4) return;
    nums.push(value);
  });
  if (nums.length < 2) return null;
  const ops = ["+", "\u2212", "\u00d7", "\u00f7"];

  for (let i = 0; i < nums.length; i++) {
    for (let j = 0; j < nums.length; j++) {
      if (i === j) continue;
      for (let k = 0; k < ops.length; k++) {
        const result = qbExplainApply(nums[i], ops[k], nums[j]);
        if (isFinite(result) && Math.abs(result - target) < 1e-6) {
          return [qbExplainPhrase(nums[i], ops[k], nums[j], result)];
        }
      }
    }
  }

  for (let i = 0; i < nums.length; i++) {
    for (let j = 0; j < nums.length; j++) {
      for (let k = 0; k < nums.length; k++) {
        if (i === j || j === k || i === k) continue;
        for (let first = 0; first < ops.length; first++) {
          const mid = qbExplainApply(nums[i], ops[first], nums[j]);
          if (!isFinite(mid)) continue;
          for (let second = 0; second < ops.length; second++) {
            const out = qbExplainApply(mid, ops[second], nums[k]);
            if (!isFinite(out) || Math.abs(out - target) > 1e-6) continue;
            return [
              qbExplainPhrase(nums[i], ops[first], nums[j], mid),
              qbExplainPhrase(mid, ops[second], nums[k], out),
            ];
          }
        }
      }
    }
  }
  return null;
}

// ---- More worked solutions -------------------------------------------------
// Each helper re-solves the question from its own numbers and returns null
// unless the working lands exactly on the answer that was marked correct.

function qbExplainValue(raw) {
  const s = String(raw == null ? "" : raw).replace(/[,$%]/g, "").replace(/\u2212/g, "-").trim();
  const frac = s.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)$/);
  if (frac) {
    const den = parseFloat(frac[2]);
    return den ? parseFloat(frac[1]) / den : NaN;
  }
  return parseFloat(s);
}

function qbExplainClose(a, b, tol) {
  return isFinite(a) && isFinite(b) && Math.abs(a - b) <= (tol == null ? 0.001 : tol);
}

function qbExplainMoney(value) {
  const v = Math.round(value * 100) / 100;
  return "$" + (Number.isInteger(v) ? String(v) : v.toFixed(2));
}

function qbExplainReduced(num, den) {
  const g = qbExplainGcd(num, den);
  return { num: num / g, den: den / g, g: g };
}

function qbExplainSignText(value) {
  return `${value < 0 ? "\u2212" : "+"} ${qbExplainTidy(Math.abs(value))}`;
}

// Probability: marbles, coins, one die rolled twice, two dice, pairs of students.
function qbExplainProbabilitySteps(text, correct) {
  const lower = String(text).toLowerCase();
  if (lower.indexOf("probability") === -1) return null;
  const answer = qbExplainFraction(correct);
  if (!answer) return null;

  const diceSum = lower.match(/rolling two six-sided dice, what is the probability the sum is (\d+)/);
  if (diceSum) {
    const want = parseInt(diceSum[1], 10);
    const ways = [];
    for (let i = 1; i <= 6; i++) for (let j = 1; j <= 6; j++) if (i + j === want) ways.push(`(${i}, ${j})`);
    const r = qbExplainReduced(ways.length, 36);
    if (r.num !== answer.num || r.den !== answer.den) return null;
    const steps = [
      "Each die has 6 outcomes, so two dice have 6 \u00d7 6 = 36 equally likely pairs.",
      ways.length
        ? `Pairs that add to ${want}: ${ways.join(", ")} \u2014 ${ways.length} of them.`
        : `No pair of dice adds to ${want}.`,
    ];
    steps.push(ways.length
      ? `Probability = favourable \u00f7 total = ${ways.length}/36${r.g > 1 ? ` = ${r.num}/${r.den}` : ""}.`
      : "A probability of 0 means it cannot happen.");
    return steps;
  }

  const pair = lower.match(/(\d+) students are chosen at random from (\d+)/);
  if (pair) {
    const from = parseInt(pair[2], 10);
    const total = (from * (from - 1)) / 2;
    if (answer.num !== 1 || answer.den !== total) return null;
    return [
      `Count the possible pairs: ${from} choices for the first student and ${from - 1} for the second, then divide by 2 because order does not matter: ${from} \u00d7 ${from - 1} \u00f7 2 = ${total} possible pairs.`,
      `Only 1 of those ${total} pairs is the specific pair, so the probability is 1/${total}.`,
    ];
  }

  if (/flipping heads twice/.test(lower)) {
    if (answer.num !== 1 || answer.den !== 4) return null;
    return [
      "A coin has 2 equally likely sides, so P(heads) = 1/2.",
      "Both flips must land heads, so multiply: 1/2 \u00d7 1/2 = 1/4.",
    ];
  }

  const twoRolls = lower.match(/rolling a (\d) and then a (\d) on a die/);
  if (twoRolls) {
    if (answer.num !== 1 || answer.den !== 36) return null;
    return [
      `P(first roll is ${twoRolls[1]}) = 1/6 and P(second roll is ${twoRolls[2]}) = 1/6.`,
      "The rolls are independent, so multiply: 1/6 \u00d7 1/6 = 1/36.",
    ];
  }

  const twice = lower.match(/rolling (?:an? )?(.+?) twice on a die/);
  if (twice) {
    const phrase = twice[1];
    let favourable = 0;
    let which = "";
    if (/odd/.test(phrase)) { favourable = 3; which = "odd numbers (1, 3, 5)"; }
    else if (/even/.test(phrase)) { favourable = 3; which = "even numbers (2, 4, 6)"; }
    else if (/greater than 4/.test(phrase)) { favourable = 2; which = "numbers greater than 4 (5, 6)"; }
    if (!favourable) return null;
    const single = qbExplainReduced(favourable, 6);
    const both = qbExplainReduced(single.num * single.num, single.den * single.den);
    if (both.num !== answer.num || both.den !== answer.den) return null;
    return [
      `A die has 6 equally likely outcomes and ${favourable} of them are ${which}, so P = ${favourable}/6${single.g > 1 ? ` = ${single.num}/${single.den}` : ""}.`,
      `Both rolls must work, so multiply the probabilities: ${single.num}/${single.den} \u00d7 ${single.num}/${single.den} = ${single.num * single.num}/${single.den * single.den}${both.g > 1 ? ` = ${both.num}/${both.den}` : ""}.`,
    ];
  }

  return null;
}

// Percent stories: stacked discounts, discount then tax, percent change, reverse percent.
function qbExplainPercentStorySteps(text, correct) {
  const target = qbExplainNumber(correct);
  const t = String(text);

  const stacked = t.match(/\$([\d,.]+).*?discounted (\d+)%.*?another (\d+)% off the reduced price/i);
  if (stacked) {
    const price = qbExplainValue(stacked[1]);
    const first = parseFloat(stacked[2]) / 100;
    const second = parseFloat(stacked[3]) / 100;
    const afterFirst = price * (1 - first);
    const final = afterFirst * (1 - second);
    if (!qbExplainClose(final, target, 0.02)) return null;
    return [
      `First discount: ${qbExplainTidy(first * 100)}% off means paying ${qbExplainTidy((1 - first) * 100)}% of the price. ${qbExplainMoney(price)} \u00d7 ${(1 - first).toFixed(2)} = ${qbExplainMoney(afterFirst)}.`,
      `The second discount applies to that reduced price: ${qbExplainMoney(afterFirst)} \u00d7 ${(1 - second).toFixed(2)} = ${qbExplainMoney(final)}.`,
    ];
  }

  const tax = t.match(/\$([\d,.]+).*?(\d+)% off.*?(\d+)% sales tax/i);
  if (tax) {
    const price = qbExplainValue(tax[1]);
    const off = parseFloat(tax[2]) / 100;
    const rate = parseFloat(tax[3]) / 100;
    const sale = price * (1 - off);
    const final = sale * (1 + rate);
    if (!qbExplainClose(final, target, 0.02)) return null;
    return [
      `Sale price first: ${qbExplainMoney(price)} \u00d7 ${(1 - off).toFixed(2)} = ${qbExplainMoney(sale)}.`,
      `Then add tax: tax is ${qbExplainTidy(rate * 100)}% of the sale price, so pay ${qbExplainTidy((1 + rate) * 100)}% of it: ${qbExplainMoney(sale)} \u00d7 ${(1 + rate).toFixed(2)} = ${qbExplainMoney(final)}.`,
    ];
  }

  const rise = t.match(/rises from \$([\d,.]+) to \$([\d,.]+)[^.]*?percent increase/i);
  if (rise) {
    const before = qbExplainValue(rise[1]);
    const after = qbExplainValue(rise[2]);
    const change = after - before;
    const percent = (change / before) * 100;
    if (!qbExplainClose(percent, target, 0.02)) return null;
    return [
      `Find the change: ${qbExplainMoney(after)} \u2212 ${qbExplainMoney(before)} = ${qbExplainMoney(change)}.`,
      `Percent change compares the change to the original price: ${qbExplainMoney(change)} \u00f7 ${qbExplainMoney(before)} = ${qbExplainTidy(change / before)}.`,
      `Turn that decimal into a percent: ${qbExplainTidy(change / before)} \u00d7 100 = ${qbExplainTidy(percent)}%.`,
    ];
  }

  const reverse = t.match(/After a (\d+)% discount, [^.]+ costs \$([\d,.]+)[^.]*?original price/i);
  if (reverse) {
    const off = parseFloat(reverse[1]) / 100;
    const paid = qbExplainValue(reverse[2]);
    const original = paid / (1 - off);
    if (!qbExplainClose(original, target, 0.02)) return null;
    return [
      `After ${qbExplainTidy(off * 100)}% off, you paid ${qbExplainTidy((1 - off) * 100)}% of the original price.`,
      `So ${qbExplainMoney(paid)} is ${(1 - off).toFixed(2)} of the original. Divide to undo it: ${qbExplainMoney(paid)} \u00f7 ${(1 - off).toFixed(2)} = ${qbExplainMoney(original)}.`,
    ];
  }

  return null;
}

// Linear equations, inequalities and systems.
function qbExplainLinearSide(raw) {
  const s = String(raw).replace(/\s+/g, "").replace(/\u2212/g, "-");
  if (!s) return null;
  const paren = s.match(/^(-?\d*(?:\.\d+)?)\((.+)\)$/);
  if (paren) {
    const factor = paren[1] === "" || paren[1] === "+" ? 1 : paren[1] === "-" ? -1 : parseFloat(paren[1]);
    const inner = qbExplainLinearSide(paren[2]);
    if (!inner || !isFinite(factor)) return null;
    return { a: factor * inner.a, b: factor * inner.b, factor: factor, inner: inner, distributed: true };
  }
  const terms = s.match(/[+-]?[^+-]+/g);
  if (!terms) return null;
  let a = 0;
  let b = 0;
  terms.forEach(term => {
    if (/x$/.test(term) && term.indexOf("x^") === -1) {
      const coeff = term.slice(0, -1);
      const value = coeff === "" || coeff === "+" ? 1 : coeff === "-" ? -1 : parseFloat(coeff);
      a += isFinite(value) ? value : NaN;
    } else {
      const value = parseFloat(term);
      b += isFinite(value) ? value : NaN;
    }
  });
  if (!isFinite(a) || !isFinite(b)) return null;
  return { a: a, b: b, distributed: false };
}

function qbExplainEquationSteps(text, correct) {
  const raw = String(text);

  const ySolve = raw.match(/^Solve (\d+)x \+ (\d+)y = (-?\d+) for y\.?$/);
  if (ySolve) {
    const a = parseInt(ySolve[1], 10);
    const b = parseInt(ySolve[2], 10);
    const c = parseInt(ySolve[3], 10);
    const expected = `(${c} - ${a}x)/${b}`;
    if (String(correct).replace(/\s+/g, "") !== expected.replace(/\s+/g, "")) return null;
    return [
      `Move the x term to the other side: ${b}y = ${c} \u2212 ${a}x.`,
      `Divide every term by ${b}: y = (${c} \u2212 ${a}x)/${b}.`,
    ];
  }

  const system = raw.match(/^Solve the system: (-?\d+)x \+ (-?\d+)y = (-?\d+) and (-?\d+)x \+ (-?\d+)y = (-?\d+)\. What is ([xy])\?/);
  if (system) {
    const a1 = parseInt(system[1], 10), b1 = parseInt(system[2], 10), c1 = parseInt(system[3], 10);
    const a2 = parseInt(system[4], 10), b2 = parseInt(system[5], 10), c2 = parseInt(system[6], 10);
    const want = system[7];
    const det = a1 * b2 - a2 * b1;
    if (!det) return null;
    const x = (c1 * b2 - c2 * b1) / det;
    const y = (a1 * c2 - a2 * c1) / det;
    const value = want === "x" ? x : y;
    if (!qbExplainClose(value, qbExplainNumber(correct))) return null;
    const steps = [
      `The two equations are (1) ${a1}x + ${b1}y = ${c1} and (2) ${a2}x + ${b2}y = ${c2}.`,
      `Multiply (1) by ${b2} and (2) by ${b1} so the y terms match: ${a1 * b2}x + ${b1 * b2}y = ${c1 * b2} and ${a2 * b1}x + ${b2 * b1}y = ${c2 * b1}.`,
      `Subtract: ${a1 * b2}−${a2 * b1} = ${a1 * b2 - a2 * b1} on the x terms and ${c1 * b2}−${c2 * b1} = ${c1 * b2 - c2 * b1} on the right, so ${a1 * b2 - a2 * b1}x = ${c1 * b2 - c2 * b1}.`,
      `Divide: x = ${qbExplainTidy(x)}. Then put x back into (2): ${a2}(${qbExplainTidy(x)}) + ${b2}y = ${c2}, so y = ${qbExplainTidy(y)}.`,
    ];
    steps.push(`The question asks for ${want}, so ${want} = ${qbExplainTidy(value)}.`);
    return steps;
  }

  const m = raw.match(/^Solve(?: for x)?:?\s*([^=<>]+?)\s*(<=|>=|<|>|=)\s*([^=<>]+?)\s*$/i);
  if (!m) return null;
  const left = qbExplainLinearSide(m[1]);
  const right = qbExplainLinearSide(m[3].replace(/\.$/, ""));
  if (!left || !right) return null;
  const dA = left.a - right.a;
  const dB = right.b - left.b;
  if (!dA) return null;
  const x = dB / dA;
  const steps = [];

  if (left.distributed) {
    steps.push(`Multiply out the bracket: ${m[1].trim()} = ${qbExplainTidy(left.a)}x ${qbExplainSignText(left.b)}.`);
  }
  if (left.a && right.a) {
    steps.push(`Get the x terms on one side: ${qbExplainTidy(left.a)}x \u2212 ${qbExplainTidy(right.a)}x = ${qbExplainTidy(dA)}x.`);
  }
  steps.push(`Get the plain numbers on the other side: ${qbExplainTidy(right.b)} \u2212 ${qbExplainTidy(left.b)} = ${qbExplainTidy(dB)}.`);
  if (dA === 1) {
    steps.push(`So x = ${qbExplainTidy(x)}.`);
  } else {
    steps.push(`That leaves ${qbExplainTidy(dA)}x ${m[2]} ${qbExplainTidy(dB)}.`);
    steps.push(`Divide both sides by ${qbExplainTidy(dA)}: ${qbExplainTidy(dB)} \u00f7 ${qbExplainTidy(dA)} = ${qbExplainTidy(x)}.`);
  }

  if (m[2] === "=") {
    if (!qbExplainClose(x, qbExplainNumber(correct))) return null;
    return steps;
  }

  const answer = String(correct).match(/^([xy])\s*(<=|>=|<|>)\s*(-?\d+(?:\.\d+)?)$/);
  if (!answer) return null;
  const flip = { "<": ">", ">": "<", "<=": ">=", ">=": "<=" };
  const sign = dA < 0 ? flip[m[2]] : m[2];
  if (answer[1] !== "x" || answer[2] !== sign || !qbExplainClose(parseFloat(answer[3]), x)) return null;
  if (dA < 0) steps.push(`Dividing by a negative number flips the inequality, so change ${m[2]} to ${sign}.`);
  steps.push(`So x ${sign} ${qbExplainTidy(x)}.`);
  return steps;
}

// Arithmetic and geometric sequences and series.
function qbExplainSequenceSteps(text, correct) {
  const target = qbExplainNumber(correct);
  const t = String(text);

  const arithTerm = t.match(/arithmetic sequence starts at (-?\d+) with common difference (-?\d+)\. What is the (\d+)/i);
  if (arithTerm) {
    const a = parseInt(arithTerm[1], 10), d = parseInt(arithTerm[2], 10), n = parseInt(arithTerm[3], 10);
    const term = a + (n - 1) * d;
    if (!qbExplainClose(term, target)) return null;
    return [
      `Each term is the one before it plus the common difference, ${d}.`,
      `From the first term to term ${n} there are ${n - 1} jumps of ${d}: ${a} + ${n - 1} \u00d7 ${d} = ${term}.`,
    ];
  }

  const geoTerm = t.match(/geometric sequence starts at (-?\d+) with common ratio (-?\d+)\. What is the (\d+)/i);
  if (geoTerm) {
