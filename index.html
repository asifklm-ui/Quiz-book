<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Quiz Book - Learn to achieve</title>
<style>
  :root {
    --bg: #1e1e2f;
    --card-bg: #2a2a40;
    --accent: #5865f2;
    --accent-hover: #4752c4;
    --correct: #3ba55d;
    --wrong: #ed4245;
    --text: #f2f2f2;
    --subtext: #a0a0b0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
  }
  #app {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: clamp(16px, 4vw, 48px);
  }
  .screen {
    flex: 1;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  /* ---- Splash screen: centered, big, fills the frame ---- */
  .screen.splash {
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .title {
    font-size: clamp(32px, 8vw, 72px);
    font-weight: 800;
    margin: 0 0 clamp(4px, 1vw, 10px);
    line-height: 1.05;
  }
  .title.small { font-size: clamp(24px, 5vw, 40px); }
  .subtitle {
    font-size: clamp(14px, 2.4vw, 20px);
    color: var(--subtext);
    margin: 0 0 clamp(32px, 8vh, 80px);
  }
  .subtitle.tight { margin-bottom: clamp(20px, 4vh, 40px); }

  .loading-bar-outline {
    width: min(80vw, 480px);
    height: clamp(16px, 3vh, 26px);
    background: var(--card-bg);
    border: 1px solid var(--accent);
    border-radius: 999px;
    overflow: hidden;
  }
  .loading-bar-fill {
    height: 100%; width: 0%;
    background: var(--accent);
    transition: width 0.08s linear;
  }
  .loading-label { font-size: clamp(12px, 1.6vw, 16px); color: var(--subtext); margin-top: 14px; }

  /* ---- Setup screen: fills height, form spread across available space ---- */
  .screen.setup {
    justify-content: space-between;
    align-items: stretch;
  }
  .setup-header { text-align: center; }
  .setup-form {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(16px, 3vh, 32px);
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }
  .form-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    width: 100%;
    flex-wrap: wrap;
  }
  .form-row label { font-size: clamp(14px, 1.8vw, 20px); }
  select, input[type=number] {
    background: var(--card-bg); color: var(--text);
    border: 1px solid #40405a; border-radius: 8px;
    padding: clamp(10px, 1.6vh, 16px) clamp(12px, 1.6vw, 18px);
    font-size: clamp(14px, 1.8vw, 18px);
    flex: 1 1 220px;
    min-width: 0;
  }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .preset-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .preset-btn {
    background: var(--card-bg); color: var(--subtext);
    border: none; border-radius: 8px;
    padding: clamp(8px, 1.2vh, 12px) clamp(14px, 2vw, 20px);
    font-size: clamp(13px, 1.6vw, 16px); cursor: pointer;
  }
  .preset-btn:hover { background: #33334a; color: var(--text); }

  .setup-footer { display: flex; justify-content: center; padding-top: clamp(16px, 3vh, 32px); }

  .btn-primary {
    background: var(--accent); color: white; border: none;
    border-radius: 10px;
    padding: clamp(14px, 2vh, 20px) clamp(28px, 5vw, 48px);
    font-size: clamp(15px, 2vw, 20px); font-weight: 700;
    cursor: pointer;
    width: 100%;
    max-width: 420px;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary {
    background: var(--card-bg); color: var(--text); border: none;
    border-radius: 10px; padding: 12px 24px; font-size: 16px; font-weight: 700;
    cursor: pointer;
  }
  .btn-secondary:hover { background: #33334a; }

  /* ---- Question screen: header / growing card / options / footer ---- */
  .screen.quiz {
    justify-content: flex-start;
  }
  .quiz-header {
    display: flex; justify-content: space-between;
    font-size: clamp(14px, 1.8vw, 20px); font-weight: 700; color: var(--subtext);
    margin-bottom: clamp(12px, 2vh, 24px);
  }
  .quiz-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .question-card {
    background: var(--card-bg); border-radius: 14px;
    padding: clamp(24px, 5vh, 64px) clamp(20px, 4vw, 40px);
    font-size: clamp(18px, 3vw, 32px); font-weight: 700;
    line-height: 1.4;
    margin-bottom: clamp(16px, 3vh, 32px);
    min-height: clamp(100px, 22vh, 260px);
    display: flex;
    align-items: center;
  }
  #optionsContainer {
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 2.2vh, 22px);
  }
  .option-btn {
    display: block; width: 100%; text-align: left;
    background: var(--card-bg); color: var(--text);
    border: none; border-radius: 10px;
    padding: clamp(16px, 3vh, 30px) clamp(16px, 2.4vw, 26px);
    font-size: clamp(14px, 2vw, 19px);
    cursor: pointer; transition: background 0.15s;
  }
  .option-btn:hover:not(:disabled) { background: #33334a; }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct { background: var(--correct) !important; color: white; }
  .option-btn.wrong { background: var(--wrong) !important; color: white; }

  .feedback {
    font-size: clamp(14px, 2vw, 18px); font-weight: 700;
    margin-top: clamp(14px, 2.4vh, 24px);
    min-height: 1.4em;
  }
  .feedback.correct { color: var(--correct); }
  .feedback.wrong { color: var(--wrong); }

  #nextBtnContainer { display: flex; justify-content: center; margin-top: clamp(12px, 2vh, 24px); }

  /* ---- Results screen ---- */
  .screen.results {
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .results-score { font-size: clamp(20px, 3.6vw, 36px); font-weight: 700; color: var(--accent); margin: clamp(8px,1.6vh,16px) 0; }
  .results-pct { font-size: clamp(13px, 1.8vw, 18px); color: var(--subtext); margin-bottom: clamp(16px, 3vh, 28px); }
  .results-msg { font-size: clamp(15px, 2.2vw, 22px); margin-bottom: clamp(24px, 5vh, 48px); }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  @media (max-width: 520px) {
    .form-row { flex-direction: column; align-items: stretch; gap: 8px; }
    select, input[type=number] { width: 100%; flex: none; }
    .quiz-header { font-size: 13px; }
  }

  @media (orientation: landscape) and (max-height: 480px) {
    .subtitle { margin-bottom: 16px; }
    .question-card { min-height: 60px; padding: 16px 20px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ===========================================================================
// Helpers
// ===========================================================================

function randInt(min, max) { // inclusive both ends
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function choice(arr) { return arr[randInt(0, arr.length - 1)]; }
function sampleTwo(min, max) {
  // random.sample(range(min,max+1), 2) equivalent - two distinct ints
  let a = randInt(min, max), b = randInt(min, max);
  while (b === a) b = randInt(min, max);
  return [a, b];
}
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }

class Frac {
  constructor(n, d) {
    if (d === 0) d = 1;
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d) || 1;
    this.n = n / g; this.d = d / g;
  }
  add(o) { return new Frac(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { return new Frac(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { return new Frac(this.n * o.n, this.d * o.d); }
  div(o) { return new Frac(this.n * o.d, this.d * o.n); }
  toString() { return this.d === 1 ? `${this.n}` : `${this.n}/${this.d}`; }
  eq(o) { return this.n === o.n && this.d === o.d; }
}
function fmt(x) { return (x instanceof Frac) ? x.toString() : String(x); }

function collectWrongs(candidateFn, correct, count = 3, maxTries = 300, exclude = []) {
  const wrongs = new Set();
  const excludeSet = new Set(exclude);
  const correctS = fmt(correct);
  let tries = 0;
  while (wrongs.size < count && tries < maxTries) {
    const c = candidateFn();
    tries++;
    const cS = fmt(c);
    if (cS !== correctS && !excludeSet.has(cS)) wrongs.add(cS);
  }
  return Array.from(wrongs);
}

function intWrongs(correct, spread = 10, allowNegative = false) {
  return collectWrongs(() => {
    const c = correct + randInt(-spread, spread);
    return allowNegative ? c : Math.max(0, c);
  }, correct);
}

function pickFromPool(pool, correct) {
  const options = pool.filter(v => v !== correct);
  for (let i = options.length - 1; i > 0; i--) {
    const j = randInt(0, i);
    [options[i], options[j]] = [options[j], options[i]];
  }
  return options.slice(0, 3);
}

function round1(x) { return Math.round(x * 10) / 10; }

// ===========================================================================
// GRADE 1
// ===========================================================================

function g1_addition() {
  const a = randInt(1, 10), b = randInt(1, 10);
  const correct = a + b;
  return [`What is ${a} + ${b}?`, String(correct), intWrongs(correct, 4)];
}
function g1_subtraction() {
  const a = randInt(5, 20), b = randInt(1, a);
  const correct = a - b;
  return [`What is ${a} - ${b}?`, String(correct), intWrongs(correct, 4)];
}
function g1_skip_counting() {
  const step = choice([2, 5, 10]);
  const start = randInt(1, 5) * step;
  const correct = start + 3 * step;
  return [`What comes next: ${start}, ${start + step}, ${start + 2 * step}, ___?`, String(correct), intWrongs(correct, step)];
}
function g1_compare_numbers() {
  const [a, b] = sampleTwo(1, 49);
  const bigger = Math.max(a, b), smaller = Math.min(a, b);
  const base = [String(smaller)];
  const extra = collectWrongs(() => Math.max(0, bigger + randInt(-8, 8)), bigger, 3 - base.length, 300, base);
  return [`Which number is greater: ${a} or ${b}?`, String(bigger), base.concat(extra).slice(0, 3)];
}
function g1_shapes() {
  const pool = { "Triangle": "3", "Square": "4", "Rectangle": "4", "Pentagon": "5", "Hexagon": "6" };
  const shape = choice(Object.keys(pool));
  const correct = pool[shape];
  const wrongs = pickFromPool(["3", "4", "5", "6", "8"], correct);
  return [`How many sides does a ${shape.toLowerCase()} have?`, correct, wrongs];
}
function g1_place_value() {
  const tens = randInt(1, 9), ones = randInt(0, 9);
  const n = tens * 10 + ones;
  return [`How many tens are in the number ${n}?`, String(tens), intWrongs(tens, 3)];
}
const GRADE1 = [g1_addition, g1_subtraction, g1_skip_counting, g1_compare_numbers, g1_shapes, g1_place_value];

// ===========================================================================
// GRADE 2
// ===========================================================================

function g2_addition_2digit() {
  const a = randInt(10, 89), b = randInt(10, 89);
  const correct = a + b;
  return [`What is ${a} + ${b}?`, String(correct), intWrongs(correct, 8)];
}
function g2_subtraction_2digit() {
  const a = randInt(20, 99), b = randInt(10, a);
  const correct = a - b;
  return [`What is ${a} - ${b}?`, String(correct), intWrongs(correct, 8)];
}
function g2_skip_counting() {
  const step = choice([2, 5, 10]);
  const start = randInt(2, 8) * step;
  const correct = start + 2 * step;
  return [`Count by ${step}s: ${start}, ${start + step}, ___, ${start + 3 * step}?`, String(correct), intWrongs(correct, step)];
}
function g2_compare_3digit() {
  const [a, b] = sampleTwo(100, 998);
  const bigger = Math.max(a, b), smaller = Math.min(a, b);
  const base = [String(smaller)];
  const extra = collectWrongs(() => Math.max(100, bigger + randInt(-20, 20)), bigger, 3 - base.length, 300, base);
  return [`Which number is greater: ${a} or ${b}?`, String(bigger), base.concat(extra).slice(0, 3)];
}
function g2_time() {
  const hour = randInt(1, 12);
  const minute = choice([0, 30]);
  const minuteStr = minute === 0 ? "00" : "30";
  const label = minute === 0 ? "o'clock" : "half past";
  const correct = `${hour}:${minuteStr}`;
  const otherMin = minute === 0 ? "30" : "00";
  const otherHour = (hour % 12) + 1;
  const wrongs = [`${hour}:${otherMin}`, `${otherHour}:${minuteStr}`, `${otherHour}:${otherMin}`];
  return [`If the clock shows ${label} ${hour}, what time is it (in H:MM)?`, correct, wrongs];
}
function g2_money() {
  const quarters = randInt(0, 3), dimes = randInt(0, 4), nickels = randInt(0, 4), pennies = randInt(0, 4);
  const total = quarters * 25 + dimes * 10 + nickels * 5 + pennies;
  const q = `You have ${quarters} quarters, ${dimes} dimes, ${nickels} nickels, and ${pennies} pennies. How many cents is that?`;
  return [q, String(total), intWrongs(total, 15)];
}
const GRADE2 = [g2_addition_2digit, g2_subtraction_2digit, g2_skip_counting, g2_compare_3digit, g2_time, g2_money];

// ===========================================================================
// GRADE 3
// ===========================================================================

function g3_multiplication() {
  const a = randInt(2, 10), b = randInt(2, 10);
  const correct = a * b;
  return [`What is ${a} x ${b}?`, String(correct), intWrongs(correct, 8)];
}
function g3_division() {
  const b = randInt(2, 10), correct = randInt(2, 10);
  const a = b * correct;
  return [`What is ${a} / ${b}?`, String(correct), intWrongs(correct, 5)];
}
function g3_basic_fraction() {
  const den = randInt(4, 10), num = randInt(1, den - 1);
  const correct = `${num}/${den}`;
  const cand = () => {
    if (Math.random() < 0.6) {
      const wn = randInt(1, den - 1);
      return `${wn}/${den}`;
    }
    const wd = Math.max(3, den + choice([-1, 1]));
    const wn = randInt(1, wd - 1);
    return `${wn}/${wd}`;
  };
  const wrongs = collectWrongs(cand, correct);
  return [`If ${num} out of ${den} equal parts of a shape are shaded, what fraction is shaded?`, correct, wrongs];
}
function g3_area_perimeter() {
  const length = randInt(2, 12), width = randInt(2, 12);
  const kind = choice(["area", "perimeter"]);
  let correct, q;
  if (kind === "area") {
    correct = length * width;
    q = `A rectangle is ${length} units long and ${width} units wide. What is its area?`;
  } else {
    correct = 2 * (length + width);
    q = `A rectangle is ${length} units long and ${width} units wide. What is its perimeter?`;
  }
  return [q, String(correct), intWrongs(correct, 8)];
}
function g3_rounding() {
  const n = randInt(10, 999), place = choice([10, 100]);
  const correct = Math.round(n / place) * place;
  const placeName = place === 10 ? "ten" : "hundred";
  return [`Round ${n} to the nearest ${placeName}.`, String(correct), intWrongs(correct, place * 2)];
}
function g3_money_word_problem() {
  const price = randInt(2, 20), paid = price + randInt(1, 10);
  const correct = paid - price;
  const q = `An item costs $${price}. You pay with $${paid}. How much change do you get?`;
  return [q, `$${correct}`, intWrongs(correct, 5).map(w => `$${w}`)];
}
const GRADE3 = [g3_multiplication, g3_division, g3_basic_fraction, g3_area_perimeter, g3_rounding, g3_money_word_problem];

// ===========================================================================
// GRADE 4
// ===========================================================================

function g4_multi_digit_multiplication() {
  const a = randInt(11, 99), b = randInt(2, 9);
  const correct = a * b;
  return [`What is ${a} x ${b}?`, String(correct), intWrongs(correct, 15)];
}
function g4_division_remainder() {
  const b = randInt(2, 9), qVal = randInt(3, 20);
  const a = b * qVal;
  return [`What is ${a} / ${b}?`, String(qVal), intWrongs(qVal, 6)];
}
function g4_rounding() {
  const n = randInt(100, 9999), place = choice([10, 100, 1000]);
  const correct = Math.round(n / place) * place;
  const placeName = { 10: "ten", 100: "hundred", 1000: "thousand" }[place];
  return [`Round ${n} to the nearest ${placeName}.`, String(correct), intWrongs(correct, place * 3)];
}
function g4_equivalent_fraction() {
  const num = randInt(1, 5), den = randInt(num + 1, 9), mult = randInt(2, 4);
  const cn = num * mult, cd = den * mult;
  const correct = `${cn}/${cd}`;
  const cand = () => `${Math.max(1, cn + randInt(-3, 3))}/${cd}`;
  const wrongs = collectWrongs(cand, correct);
  return [`Which fraction is equivalent to ${num}/${den}?`, correct, wrongs];
}
function g4_add_fractions_common_denom() {
  const den = randInt(4, 12), n1 = randInt(1, den - 2), n2 = randInt(1, Math.max(1, den - n1 - 1));
  const total = n1 + n2;
  const correct = `${total}/${den}`;
  const cand = () => `${Math.max(1, total + randInt(-4, 4))}/${den}`;
  const wrongs = collectWrongs(cand, correct);
  return [`What is ${n1}/${den} + ${n2}/${den}?`, correct, wrongs];
}
function g4_angle_type() {
  const angle = choice([30, 45, 60, 90, 120, 150, 100, 75]);
  let correct;
  if (angle < 90) correct = "Acute"; else if (angle === 90) correct = "Right"; else correct = "Obtuse";
  const wrongs = pickFromPool(["Acute", "Right", "Obtuse", "Straight"], correct);
  return [`An angle measures ${angle} degrees. What type of angle is it?`, correct, wrongs];
}
function g4_factors() {
  const n = choice([12, 16, 18, 20, 24, 28, 30, 36]);
  const factors = [];
  for (let i = 1; i <= n; i++) if (n % i === 0) factors.push(i);
  const correct = Math.max(...factors.filter(f => f !== n));
  return [`What is the greatest factor of ${n} other than ${n} itself?`, String(correct), intWrongs(correct, 5)];
}
const GRADE4 = [g4_multi_digit_multiplication, g4_division_remainder, g4_rounding, g4_equivalent_fraction,
  g4_add_fractions_common_denom, g4_angle_type, g4_factors];

// ===========================================================================
// GRADE 5
// ===========================================================================

function g5_add_fractions_unlike() {
  const opts = [2, 3, 4, 5, 6, 8, 10];
  let d1 = choice(opts), d2 = choice(opts);
  while (d2 === d1) d2 = choice(opts);
  const n1 = randInt(1, d1 - 1), n2 = randInt(1, d2 - 1);
  const correct = new Frac(n1, d1).add(new Frac(n2, d2));
  const cand = () => new Frac(Math.max(1, correct.n + randInt(-3, 3)), correct.d);
  const wrongs = collectWrongs(cand, correct);
  return [`What is ${n1}/${d1} + ${n2}/${d2}? (simplest form)`, fmt(correct), wrongs];
}
function g5_multiply_fractions() {
  const n1 = randInt(1, 5), d1 = randInt(2, 8), n2 = randInt(1, 5), d2 = randInt(2, 8);
  const correct = new Frac(n1, d1).mul(new Frac(n2, d2));
  const cand = () => new Frac(Math.max(1, correct.n + randInt(-3, 3)), Math.max(2, correct.d + choice([0, 0, 1, -1])));
  const wrongs = collectWrongs(cand, correct);
  return [`What is ${n1}/${d1} x ${n2}/${d2}? (simplest form)`, fmt(correct), wrongs];
}
function g5_decimal_ops() {
  const a = round1(1 + Math.random() * 49), b = round1(1 + Math.random() * 49);
  const op = choice(["+", "-"]);
  const correct = op === "+" ? round1(a + b) : round1(a - b);
  const cand = () => round1(correct + choice([0.1, -0.1, 1.0, -1.0, 5.0, -5.0]) * randInt(1, 2));
  const wrongs = collectWrongs(cand, correct);
  return [`What is ${a} ${op} ${b}?`, String(correct), wrongs];
}
function g5_order_of_operations() {
  const a = randInt(2, 9), b = randInt(2, 9), c = randInt(2, 9);
  const correct = a + b * c;
  const wrong1 = (a + b) * c;
  const base = wrong1 !== correct ? [String(wrong1)] : [];
  const extra = collectWrongs(() => Math.max(0, correct + randInt(-10, 10)), correct, 3 - base.length, 300, base);
  const wrongs = base.concat(extra).slice(0, 3);
  return [`What is ${a} + ${b} x ${c}? (follow order of operations)`, String(correct), wrongs];
}
function g5_volume() {
  const l = randInt(2, 10), w = randInt(2, 10), h = randInt(2, 10);
  const correct = l * w * h;
  return [`What is the volume of a rectangular prism with length ${l}, width ${w}, and height ${h}?`, String(correct), intWrongs(correct, 30)];
}
function g5_gcf_lcm() {
  const a = randInt(4, 40), b = randInt(4, 40);
  const kind = choice(["GCF", "LCM"]);
  let correct, q;
  if (kind === "GCF") { correct = gcd(a, b); q = `What is the greatest common factor (GCF) of ${a} and ${b}?`; }
  else { correct = (a * b) / gcd(a, b); q = `What is the least common multiple (LCM) of ${a} and ${b}?`; }
  return [q, String(correct), intWrongs(correct, Math.max(6, Math.floor(correct / 3)))];
}
function g5_percent() {
  const pct = choice([10, 20, 25, 50]), n = choice([20, 40, 60, 80, 100, 200]);
  const correct = Math.floor(n * pct / 100);
  return [`What is ${pct}% of ${n}?`, String(correct), intWrongs(correct, 15)];
}
function g5_coordinate_plane() {
  const x = randInt(1, 10), y = randInt(1, 10);
  const axis = choice(["x", "y"]);
  const correct = axis === "x" ? x : y;

// ===========================================================================
// Bank-based quiz generation (Reading, Science, Social Studies)
// ===========================================================================

function gradeBand(grade) {
  if (grade <= 2) return "A";
  if (grade <= 5) return "B";
  if (grade <= 8) return "C";
  return "D";
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sampleWithoutReplacement(arr, count) {
  return shuffleArray(arr).slice(0, count);
}

function generateBankQuiz(subject, grade, count) {
  const band = gradeBand(grade);
  const bank = BANK_DATA[subject][band];
  let chosen;
  if (count <= bank.length) {
    chosen = sampleWithoutReplacement(bank, count);
  } else {
    chosen = [];
    while (chosen.length < count) {
      const remaining = count - chosen.length;
      let cycle = shuffleArray(bank);
      if (chosen.length && cycle[0][0] === chosen[chosen.length - 1][0] && cycle.length > 1) {
        [cycle[0], cycle[1]] = [cycle[1], cycle[0]];
      }
      chosen = chosen.concat(cycle.slice(0, remaining));
    }
  }
  return chosen.map(([qText, correct, wrongs]) => {
    const options = shuffleArray(wrongs.slice(0, 3).concat([correct]));
    return { question: qText, options: options, correct_text: correct };
  });
}

function generateQuiz(subject, grade, count) {
  if (subject === "Math") return generateMathQuiz(grade, count);
  return generateBankQuiz(subject, grade, count);
}

  clearApp();

  const col = document.createElement("div");
  col.className = "screen setup";
  col.innerHTML = `
    <div class="setup-header">
      <h1 class="title small">The Quiz Book</h1>
      <p class="subtitle tight">Math, Reading, Science &amp; Social Studies - Grades 1-12</p>
    </div>

    <div class="setup-form">
      <div class="form-row">
        <label for="subjectSelect">Subject:</label>
        <select id="subjectSelect">
          <option value="Math">Math</option>
          <option value="Reading">Reading</option>
          <option value="Science">Science</option>
          <option value="Social Studies">Social Studies</option>
        </select>
      </div>

      <div class="form-row">
        <label for="gradeSelect">Grade:</label>
        <select id="gradeSelect"></select>
      </div>

      <div class="form-row">
        <label for="countInput">Number of Questions (1-100):</label>
        <input type="number" id="countInput" min="1" max="100" value="10">
      </div>

      <div class="preset-row" id="presetRow"></div>
    </div>

    <div class="setup-footer">
      <button class="btn-primary" id="startBtn">Start Quiz</button>
    </div>
  `;
  app.appendChild(col);

  const subjectSelect = document.getElementById("subjectSelect");
  const gradeSelect = document.getElementById("gradeSelect");
  const countInput = document.getElementById("countInput");
  const presetRow = document.getElementById("presetRow");

  subjectSelect.value = state.subject;
  for (let g = 1; g <= 12; g++) {
    const opt = document.createElement("option");
    opt.value = g;
    opt.textContent = GRADE_LABELS[g];
    gradeSelect.appendChild(opt);
  }
  gradeSelect.value = state.grade;
  countInput.value = state.count;

  [5, 10, 20, 50, 100].forEach(p => {
    const btn = document.createElement("button");
    btn.className = "preset-btn";
    btn.textContent = String(p);
    btn.addEventListener("click", () => { countInput.value = p; });
    presetRow.appendChild(btn);
  });

  document.getElementById("startBtn").addEventListener("click", () => {
    state.subject = subjectSelect.value;
    state.grade = parseInt(gradeSelect.value, 10);
    let count = parseInt(countInput.value, 10);
    if (isNaN(count)) count = 10;
    count = Math.max(1, Math.min(100, count));
    state.count = count;

    state.questions = generateQuiz(state.subject, state.grade, count);
    state.currentIndex = 0;
    state.score = 0;
    showQuestionScreen();
  });
}

// ---- Question screen -------------------------------------------------------

function showQuestionScreen() {
  clearApp();
  state.answerLocked = false;

  const q = state.questions[state.currentIndex];

  const wrapper = document.createElement("div");
  wrapper.className = "screen quiz";
  wrapper.innerHTML = `
    <div class="quiz-header">
      <span>Question ${state.currentIndex + 1} / ${state.questions.length}</span>
      <span>Score: ${state.score}</span>
    </div>
    <div class="quiz-body">
      <div class="question-card">${escapeHtml(q.question)}</div>
      <div id="optionsContainer"></div>
      <div class="feedback" id="feedback"></div>
      <div id="nextBtnContainer"></div>
    </div>
  `;
  app.appendChild(wrapper);

  const optionsContainer = document.getElementById("optionsContainer");
  const letters = ["A", "B", "C", "D"];
  q.options.forEach((option, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = `${letters[i]}.  ${option}`;
    btn.dataset.value = option;
    btn.addEventListener("click", () => checkAnswer(option));
    optionsContainer.appendChild(btn);
  });
}

function checkAnswer(selected) {
  if (state.answerLocked) return;
  state.answerLocked = true;

  const q = state.questions[state.currentIndex];
  const correct = q.correct_text;
  const buttons = document.querySelectorAll(".option-btn");

  buttons.forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.value === correct) btn.classList.add("correct");
    else if (btn.dataset.value === selected) btn.classList.add("wrong");
  });

  const feedback = document.getElementById("feedback");
  if (selected === correct) {
    state.score++;
    feedback.textContent = "Correct! Well done!";
    feedback.className = "feedback correct";
  } else {
    feedback.textContent = `Wrong! The correct answer was: ${correct}`;
    feedback.className = "feedback wrong";
  }

  const isLast = state.currentIndex === state.questions.length - 1;
  const nextContainer = document.getElementById("nextBtnContainer");
  const nextBtn = document.createElement("button");
  nextBtn.className = "btn-primary";
  nextBtn.textContent = isLast ? "Finish" : "Next Question";
  nextBtn.addEventListener("click", nextQuestion);
  nextContainer.appendChild(nextBtn);
}

function nextQuestion() {
  state.currentIndex++;
  if (state.currentIndex < state.questions.length) {
    showQuestionScreen();
  } else {
    showResultsScreen();
  }
}

// ---- Results screen ---------------------------------------------------------

function showResultsScreen() {
  clearApp();

  const total = state.questions.length;
  const percentage = total ? (state.score / total) * 100 : 0;

  let message;
  if (percentage === 100) message = "Perfect score! Outstanding work!";
  else if (percentage >= 80) message = "Excellent work! You really know this!";
  else if (percentage >= 60) message = "Good job! Keep practicing!";
  else if (percentage >= 40) message = "Nice try! A little more practice will help!";
  else message = "Keep at it! Practice makes progress!";

  const col = document.createElement("div");
  col.className = "screen results";
  col.innerHTML = `
    <h1 class="title small">Quiz Complete!</h1>
    <div class="results-score">Final Score: ${state.score} / ${total}</div>
    <div class="results-pct">(${percentage.toFixed(0)}%)</div>
    <div class="results-msg">${message}</div>
    <div class="btn-row">
      <button class="btn-primary" id="playAgainBtn">Play Again</button>
    </div>
  `;
  app.appendChild(col);

  document.getElementById("playAgainBtn").addEventListener("click", showSetupScreen);
}

// ---- Utility ---------------------------------------------------------------

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ---- Boot --------------------------------------------------------------------

showSplashScreen();

</script>
</body>
</html>
