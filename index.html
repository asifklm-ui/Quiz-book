    const a = parseInt(geoTerm[1], 10), r = parseInt(geoTerm[2], 10), n = parseInt(geoTerm[3], 10);
    const term = a * Math.pow(r, n - 1);
    if (!qbExplainClose(term, target)) return null;
    return [
      `Each term multiplies by the common ratio, ${r}.`,
      `From term 1 to term ${n} the ratio is used ${n - 1} times: ${a} \u00d7 ${r}^${n - 1} = ${term}.`,
    ];
  }

  const arithSum = t.match(/sum of the first (\d+) terms of an arithmetic sequence with first term (-?\d+) and common difference (-?\d+)/i);
  if (arithSum) {
    const n = parseInt(arithSum[1], 10), a = parseInt(arithSum[2], 10), d = parseInt(arithSum[3], 10);
    const last = a + (n - 1) * d;
    const sum = (n * (a + last)) / 2;
    if (!qbExplainClose(sum, target)) return null;
    return [
      `The last term is ${a} + ${n - 1} \u00d7 ${d} = ${last}.`,
      `Sum = number of terms \u00d7 (first + last) \u00f7 2: ${n} \u00d7 (${a} + ${last}) \u00f7 2 = ${sum}.`,
    ];
  }

  const geoSum = t.match(/sum of the first (\d+) terms of a geometric sequence with first term (-?\d+) and common ratio (-?\d+)/i);
  if (geoSum) {
    const n = parseInt(geoSum[1], 10), a = parseInt(geoSum[2], 10), r = parseInt(geoSum[3], 10);
    const sum = r === 1 ? a * n : (a * (Math.pow(r, n) - 1)) / (r - 1);
    if (!qbExplainClose(sum, target)) return null;
    return [
      `Use the sum formula \u00d7 (r^n \u2212 1) \u00f7 (r \u2212 1): ${a} \u00d7 (${r}^${n} \u2212 1) \u00f7 (${r} \u2212 1).`,
      `${r}^${n} = ${Math.pow(r, n)}, so ${a} \u00d7 ${Math.pow(r, n) - 1} \u00f7 ${r - 1} = ${sum}.`,
    ];
  }

  const infinite = t.match(/infinite geometric series ([\d.]+) \+ ([\d.]+) \+/i);
  if (infinite) {
    const a = parseFloat(infinite[1]);
    const next = parseFloat(infinite[2]);
    const r = next / a;
    const sum = a / (1 - r);
    if (!qbExplainClose(sum, target)) return null;
    return [
      `The common ratio is ${qbExplainTidy(next)} \u00f7 ${qbExplainTidy(a)} = ${qbExplainTidy(r)}.`,
      `An infinite geometric series with |r| < 1 adds up to a \u00f7 (1 \u2212 r): ${qbExplainTidy(a)} \u00f7 (1 \u2212 ${qbExplainTidy(r)}) = ${qbExplainTidy(sum)}.`,
    ];
  }

  return null;
}

// Mean, median, range and a missing value from a mean.
function qbExplainStatsSteps(text, correct) {
  const target = qbExplainNumber(correct);
  const t = String(text);

  const listed = t.match(/(mean|median|range)(?: \(average\))? of: ([^?]+)\?/i);
  if (listed) {
    const kind = listed[1].toLowerCase();
    const nums = qbExplainNums(listed[2]);
    if (nums.length < 2) return null;
    if (kind === "mean") {
      const sum = nums.reduce((s, v) => s + v, 0);
      const mean = sum / nums.length;
      if (!qbExplainClose(mean, target, 0.06)) return null;
      return [
        `Add them up: ${nums.join(" + ")} = ${qbExplainTidy(sum)}.`,
        `Divide by how many there are: ${qbExplainTidy(sum)} \u00f7 ${nums.length} = ${qbExplainTidy(mean)}.`,
      ];
    }
    if (kind === "range") {
      const range = Math.max.apply(null, nums) - Math.min.apply(null, nums);
      if (!qbExplainClose(range, target)) return null;
      return [
        `The largest is ${Math.max.apply(null, nums)} and the smallest is ${Math.min.apply(null, nums)}.`,
        `Range = largest \u2212 smallest = ${Math.max.apply(null, nums)} \u2212 ${Math.min.apply(null, nums)} = ${range}.`,
      ];
    }
    const sorted = nums.slice().sort((a, b) => a - b);
    const middle = sorted.length % 2
      ? sorted[(sorted.length - 1) / 2]
      : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2;
    if (!qbExplainClose(middle, target)) return null;
    return [
      `Put them in order: ${sorted.join(", ")}.`,
      sorted.length % 2
        ? `There are ${sorted.length} numbers, so the middle one is the median: ${middle}.`
        : `There are ${sorted.length} numbers, so average the two middle ones: (${sorted[sorted.length / 2 - 1]} + ${sorted[sorted.length / 2]}) \u00f7 2 = ${middle}.`,
    ];
  }

  const missing = t.match(/mean of (\d+) numbers is (\d+(?:\.\d+)?)\. Four of them are ([\d, .-]+?)\. What is the/i);
  if (missing) {
    const count = parseInt(missing[1], 10);
    const mean = parseFloat(missing[2]);
    const known = qbExplainNums(missing[3]);
    if (known.length < 4) return null;
    const total = count * mean;
    const sum = known.reduce((s, v) => s + v, 0);
    const value = total - sum;
    if (!qbExplainClose(value, target)) return null;
    return [
      `The mean tells you the total: ${count} \u00d7 ${qbExplainTidy(mean)} = ${qbExplainTidy(total)}.`,
      `Add the four numbers you know: ${known.join(" + ")} = ${qbExplainTidy(sum)}.`,
      `The missing number is what is left: ${qbExplainTidy(total)} \u2212 ${qbExplainTidy(sum)} = ${qbExplainTidy(value)}.`,
    ];
  }

  return null;
}

// Ratios, rates and sharing word problems.
function qbExplainRatioSteps(text, correct) {
  const target = qbExplainNumber(correct);
  const t = String(text);

  const share = t.match(/\$([\d,.]+) is shared in the ratio (\d+):(\d+)\. What is the larger share/i);
  if (share) {
    const total = qbExplainValue(share[1]);
    const a = parseInt(share[2], 10), b = parseInt(share[3], 10);
    const parts = a + b;
    const unit = total / parts;
    const larger = Math.max(a, b) * unit;
    if (!qbExplainClose(larger, target, 0.02)) return null;
    return [
      `Add the ratio parts: ${a} + ${b} = ${parts} parts in all.`,
      `Each part is worth ${qbExplainMoney(total)} \u00f7 ${parts} = ${qbExplainMoney(unit)}.`,
      `The larger share is ${Math.max(a, b)} parts: ${Math.max(a, b)} \u00d7 ${qbExplainMoney(unit)} = ${qbExplainMoney(larger)}.`,
    ];
  }

  const equiv = t.match(/Which ratio is equivalent to (\d+):(\d+)/i);
  if (equiv) {
    const a = parseInt(equiv[1], 10), b = parseInt(equiv[2], 10);
    const pair = String(correct).match(/(\d+)\s*:\s*(\d+)/);
    if (!pair) return null;
    const ca = parseInt(pair[1], 10), cb = parseInt(pair[2], 10);
    if (!a || ca % a !== 0 || cb % b !== 0 || ca / a !== cb / b) return null;
    const k = ca / a;
    return [
      `Multiply both sides of ${a}:${b} by the same number to keep the ratio equal.`,
      `${a} \u00d7 ${k} = ${ca} and ${b} \u00d7 ${k} = ${cb}, so ${ca}:${cb} is equivalent.`,
    ];
  }

  const boys = t.match(/ratio of boys to girls is (\d+):(\d+)\. If there are (\d+) boys, how many girls/i);
  if (boys) {
    const b = parseInt(boys[1], 10), g = parseInt(boys[2], 10), have = parseInt(boys[3], 10);
    const girls = (have / b) * g;
    if (!qbExplainClose(girls, target)) return null;
    return [
      `The ratio says ${b} boys for every ${g} girls.`,
      `${have} boys is ${have} \u00f7 ${b} = ${qbExplainTidy(have / b)} groups of ${b}.`,
      `Each group has ${g} girls, so ${qbExplainTidy(have / b)} \u00d7 ${g} = ${qbExplainTidy(girls)} girls.`,
    ];
  }

  const notebooks = t.match(/If (\d+) notebooks cost \$([\d,.]+), how much do (\d+) notebooks cost/i);
  if (notebooks) {
    const base = parseInt(notebooks[1], 10), cost = qbExplainValue(notebooks[2]), want = parseInt(notebooks[3], 10);
    const unit = cost / base;
    const total = unit * want;
    if (!qbExplainClose(total, target, 0.02)) return null;
    return [
      `Find the price of one: ${qbExplainMoney(cost)} \u00f7 ${base} = ${qbExplainMoney(unit)} each.`,
      `Then multiply: ${want} \u00d7 ${qbExplainMoney(unit)} = ${qbExplainMoney(total)}.`,
    ];
  }

  const single = t.match(/One notebook costs \$([\d,.]+)\. How much do (\d+) notebooks cost/i);
  if (single) {
    const unit = qbExplainValue(single[1]);
    const count = parseInt(single[2], 10);
    const total = unit * count;
    if (!qbExplainClose(total, target, 0.02)) return null;
    return [`Each notebook costs ${qbExplainMoney(unit)}.`, `${count} \u00d7 ${qbExplainMoney(unit)} = ${qbExplainMoney(total)}.`];
  }

  const speed = t.match(/travels ([\d.]+) miles in ([\d.]+) hours\. What is its speed/i);
  if (speed) {
    const miles = parseFloat(speed[1]);
    const hours = parseFloat(speed[2]);
    const rate = miles / hours;
    if (!qbExplainClose(rate, target)) return null;
    return [
      "Speed is distance \u00f7 time.",
      `${qbExplainTidy(miles)} \u00f7 ${qbExplainTidy(hours)} = ${qbExplainTidy(rate)} miles per hour.`,
    ];
  }

  const stickers = t.match(/has (\d+) stickers\. She gets (\d+) more, then gives (\d+) away/i);
  if (stickers) {
    const start = parseInt(stickers[1], 10), gain = parseInt(stickers[2], 10), loss = parseInt(stickers[3], 10);
    const left = start + gain - loss;
    if (!qbExplainClose(left, target)) return null;
    return [
      `Start with ${start} and add the ${gain} she gets: ${start} + ${gain} = ${start + gain}.`,
      `Then take away the ${loss} she gives away: ${start + gain} \u2212 ${loss} = ${left}.`,
    ];
  }

  const more = t.match(/has (\d+) stickers\. Ana has (\d+) stickers\. How many more stickers does Ana have/i);
  if (more) {
    const first = parseInt(more[1], 10), second = parseInt(more[2], 10);
    const diff = second - first;
    if (!qbExplainClose(diff, target)) return null;
    return [`Compare the two amounts: ${second} \u2212 ${first} = ${diff}.`, `Ana has ${diff} more stickers.`];
  }

  const shopping = t.match(/buy (\d+) notebooks at \$(\d+) each and a pen for \$(\d+)/i);
  if (shopping) {
    const count = parseInt(shopping[1], 10), each = parseInt(shopping[2], 10), pen = parseInt(shopping[3], 10);
    const total = count * each + pen;
    if (!qbExplainClose(total, target)) return null;
    return [
      `The notebooks cost ${count} \u00d7 $${each} = $${count * each}.`,
      `Add the pen: $${count * each} + $${pen} = $${total}.`,
      `So the total cost is $${total}.`,
    ];
  }

  const boxes = t.match(/buys (\d+) boxes with (\d+) pencils in each box\. They give away (\d+)/i);
  if (boxes) {
    const count = parseInt(boxes[1], 10), each = parseInt(boxes[2], 10), away = parseInt(boxes[3], 10);
    const left = count * each - away;
    if (!qbExplainClose(left, target)) return null;
    return [
      `First find the pencils bought: ${count} \u00d7 ${each} = ${count * each}.`,
      `Then subtract the ones given away: ${count * each} \u2212 ${away} = ${left}.`,
    ];
  }

  const parentheses = t.match(/What is \((\d+) ([+-]) (\d+)\)\^2 ([+-]) (\d+) x (\d+)\?/i);
  if (parentheses) {
    const a = parseInt(parentheses[1], 10), innerOp = parentheses[2], b = parseInt(parentheses[3], 10);
    const outerOp = parentheses[4], c = parseInt(parentheses[5], 10), d = parseInt(parentheses[6], 10);
    const inner = innerOp === "+" ? a + b : a - b;
    const squared = inner * inner;
    const product = c * d;
    const value = outerOp === "+" ? squared + product : squared - product;
    if (!qbExplainClose(value, target)) return null;
    return [
      `Do the bracket first: ${a} ${innerOp} ${b} = ${inner}.`,
      `Square it: ${inner}\u00b2 = ${squared}. Then the multiplication: ${c} \u00d7 ${d} = ${product}.`,
      `Finish with ${squared} ${outerOp} ${product} = ${value}.`,
    ];
  }

  const gcf = t.match(/greatest common factor \(GCF\) of (\d+) and (\d+)/i);
  if (gcf) {
    const a = parseInt(gcf[1], 10), b = parseInt(gcf[2], 10);
    const value = qbExplainGcd(a, b);
    if (!qbExplainClose(value, target)) return null;
    const factors = (n) => {
      const list = [];
      for (let i = 1; i <= n; i++) if (n % i === 0) list.push(i);
      return list;
    };
    const shared = factors(a).filter(v => b % v === 0);
    return [
      `Factors of ${a}: ${factors(a).join(", ")}. Factors of ${b}: ${factors(b).join(", ")}.`,
      `The shared factors are ${shared.join(", ")}; the greatest is ${value}.`,
    ];
  }

  const sumDiff = t.match(/sum of two numbers is (\d+) and their difference is (\d+)\. What is the larger number/i);
  if (sumDiff) {
    const sum = parseInt(sumDiff[1], 10), diff = parseInt(sumDiff[2], 10);
    const larger = (sum + diff) / 2;
    if (!qbExplainClose(larger, target)) return null;
    return [
      `Call the numbers a and b: a + b = ${sum} and a \u2212 b = ${diff}.`,
      `Add the two equations to remove b: 2a = ${sum + diff}, so a = ${larger}.`,
    ];
  }

  return null;
}

// Algebra: functions, quadratics, logs, interest, counting, matrices and limits.
function qbExplainQuadraticParts(body) {
  const m = String(body).match(/^(-?\d*)x\^2\s*([+-])\s*(\d+)x\s*([+-])\s*(\d+)$/);
  if (!m) return null;
  const lead = m[1];
  const a = lead === "" || lead === "+" ? 1 : lead === "-" ? -1 : parseInt(lead, 10);
  const b = (m[2] === "-" ? -1 : 1) * parseInt(m[3], 10);
  const c = (m[4] === "-" ? -1 : 1) * parseInt(m[5], 10);
  return { a: a, b: b, c: c };
}

function qbExplainAlgebraSteps(text, correct) {
  const target = qbExplainNumber(correct);
  const t = String(text);

  const power = t.match(/Simplify: \((\d+)\^(\d+)\)\^(\d+) = \d+\^\?/);
  if (power) {
    const base = parseInt(power[1], 10), first = parseInt(power[2], 10), second = parseInt(power[3], 10);
    const exponent = first * second;
    if (!qbExplainClose(exponent, target)) return null;
    return [
      "A power raised to a power multiplies the exponents.",
      `(${base}^${first})^${second} = ${base}^(${first} \u00d7 ${second}) = ${base}^${exponent}.`,
      `So the missing exponent is ${exponent}.`,
    ];
  }

  const sameBase = t.match(/Simplify: (\d+)\^(\d+) x (\d+)\^(\d+) = \d+\^\?/);
  if (sameBase) {
    const base = parseInt(sameBase[1], 10);
    if (parseInt(sameBase[3], 10) !== base) return null;
    const sum = parseInt(sameBase[2], 10) + parseInt(sameBase[4], 10);
    if (!qbExplainClose(sum, target)) return null;
    return [
      "Multiplying powers of the same base adds the exponents.",
      `${sameBase[1]}^${sameBase[2]} \u00d7 ${sameBase[3]}^${sameBase[4]} = ${sameBase[1]}^(${sameBase[2]} + ${sameBase[4]}) = ${sameBase[1]}^${sum}.`,
    ];
  }

  const varPower = t.match(/Simplify: x\^(\d+) \* x\^(\d+) = x\^\?/);
  if (varPower) {
    const sum = parseInt(varPower[1], 10) + parseInt(varPower[2], 10);
    if (!qbExplainClose(sum, target)) return null;
    return [
      "Multiplying powers of x adds the exponents.",
      `x^${varPower[1]} \u00d7 x^${varPower[2]} = x^(${varPower[1]} + ${varPower[2]}) = x^${sum}.`,
    ];
  }

  const sameBaseDiv = t.match(/Simplify: (\d+)\^(\d+) \/ (\d+)\^(\d+) = \d+\^\?/);
  if (sameBaseDiv) {
    const base = parseInt(sameBaseDiv[1], 10);
    if (parseInt(sameBaseDiv[3], 10) !== base) return null;
    const diff = parseInt(sameBaseDiv[2], 10) - parseInt(sameBaseDiv[4], 10);
    if (diff < 0 || !qbExplainClose(diff, target)) return null;
    return [
      "Dividing powers of the same base subtracts the exponents.",
      `${sameBaseDiv[1]}^${sameBaseDiv[2]} \u00f7 ${sameBaseDiv[3]}^${sameBaseDiv[4]} = ${sameBaseDiv[1]}^(${sameBaseDiv[2]} \u2212 ${sameBaseDiv[4]}) = ${sameBaseDiv[1]}^${diff}.`,
    ];
  }

  const fn = t.match(/If f\(x\) = (-?\d*)x ([+-]) (\d+), what is f\((-?\d+)\)/);
  if (fn) {
    const rawCoef = fn[1];
    const a = rawCoef === "" || rawCoef === "+" ? 1 : rawCoef === "-" ? -1 : parseFloat(rawCoef);
    const b = (fn[2] === "-" ? -1 : 1) * parseFloat(fn[3]);
    const input = parseFloat(fn[4]);
    const value = a * input + b;
    if (!qbExplainClose(value, target)) return null;
    return [
      `Put ${qbExplainTidy(input)} wherever x is: f(${qbExplainTidy(input)}) = ${qbExplainTidy(a)}(${qbExplainTidy(input)}) ${qbExplainSignText(b)}.`,
      `Multiply first: ${qbExplainTidy(a)} \u00d7 ${qbExplainTidy(input)} = ${qbExplainTidy(a * input)}, then ${qbExplainTidy(a * input)} ${qbExplainSignText(b)} = ${qbExplainTidy(value)}.`,
    ];
  }

  const inverse = t.match(/If f\(x\) = (-?\d*)x ([+-]) (\d+), what is the inverse function/);
  if (inverse) {
    const rawCoef = inverse[1];
    const a = rawCoef === "" || rawCoef === "+" ? 1 : rawCoef === "-" ? -1 : parseFloat(rawCoef);
    const b = (inverse[2] === "-" ? -1 : 1) * parseFloat(inverse[3]);
    if (!a) return null;
    const expected = `(x ${b >= 0 ? "-" : "+"} ${qbExplainTidy(Math.abs(b))}) / ${qbExplainTidy(a)}`;
    if (String(correct).replace(/\s+/g, "") !== expected.replace(/\s+/g, "")) return null;
    return [
      `Start from y = ${qbExplainTidy(a)}x ${qbExplainSignText(b)} and swap x and y: x = ${qbExplainTidy(a)}y ${qbExplainSignText(b)}.`,
      `Solve for y: x ${b >= 0 ? "\u2212" : "+"} ${qbExplainTidy(Math.abs(b))} = ${qbExplainTidy(a)}y, so y = (x ${b >= 0 ? "\u2212" : "+"} ${qbExplainTidy(Math.abs(b))}) \u00f7 ${qbExplainTidy(a)}.`,
    ];
  }

  const disc = t.match(/For (-?\d*)x\^2 ([+-]) (\d+)x ([+-]) (\d+) = 0, what is the discriminant/i);
  if (disc) {
    const rawA = disc[1];
    const a = rawA === "" || rawA === "+" ? 1 : rawA === "-" ? -1 : parseInt(rawA, 10);
    const b = (disc[2] === "-" ? -1 : 1) * parseInt(disc[3], 10);
    const c = (disc[4] === "-" ? -1 : 1) * parseInt(disc[5], 10);
    const value = b * b - 4 * a * c;
    if (!qbExplainClose(value, target)) return null;
    return [
      `Here a = ${a}, b = ${b} and c = ${c}.`,
      `b\u00b2 \u2212 4ac = (${b})\u00b2 \u2212 4 \u00d7 ${a} \u00d7 ${c} = ${b * b} \u2212 ${4 * a * c} = ${value}.`,
    ];
  }

  const quadratic = t.match(/(?:What are the roots of|Solve using the quadratic formula:|Solve:) (-?\d*)x\^2 ([+-]) (\d+)x ([+-]) (\d+) = 0/);
  if (quadratic) {
    const parts = qbExplainQuadraticParts(quadratic[1] + "x^2 " + quadratic[2] + " " + quadratic[3] + "x " + quadratic[4] + " " + quadratic[5]);
    if (!parts) return null;
    const { a, b, c } = parts;
    const d = b * b - 4 * a * c;
    if (d < 0) return null;
    const root = Math.sqrt(d);
    if (Math.abs(root - Math.round(root)) > 0.0001) return null;
    const r1 = (-b + root) / (2 * a);
    const r2 = (-b - root) / (2 * a);
    const found = (String(correct).match(/-?\d+(?:\.\d+)?/g) || []).map(Number).sort((x, y) => x - y);
    const want = [r1, r2].map(v => Math.round(v * 1000) / 1000).sort((x, y) => x - y);
    if (found.length !== 2 || !qbExplainClose(found[0], want[0]) || !qbExplainClose(found[1], want[1])) return null;
    return [
      `Write it as ax\u00b2 + bx + c = 0: a = ${a}, b = ${b}, c = ${c}.`,
      `The discriminant is b\u00b2 \u2212 4ac = ${b * b} \u2212 ${4 * a * c} = ${d}, so \u221ad = ${root}.`,
      `x = (\u2212b \u00b1 \u221ad) \u00f7 2a = (${-b} \u00b1 ${root}) \u00f7 ${2 * a}, giving x = ${qbExplainTidy(r1)} and x = ${qbExplainTidy(r2)}.`,
    ];
  }

  const logValue = t.match(/What is log base (\d+) of (\d+)\?/);
  if (logValue) {
    const base = parseInt(logValue[1], 10), value = parseInt(logValue[2], 10);
    let power = 0;
    let current = 1;
    while (current < value && power < 40) { current *= base; power++; }
    if (current !== value || !qbExplainClose(power, target)) return null;
    return [
      `A log asks: what power of ${base} gives ${value}?`,
      `${base}^${power} = ${value}, so log base ${base} of ${value} = ${power}.`,
    ];
  }

  const logSolve = t.match(/Solve for x: log base (\d+) of x = (\d+)\./);
  if (logSolve) {
    const base = parseInt(logSolve[1], 10), power = parseInt(logSolve[2], 10);
    const value = Math.pow(base, power);
    if (!qbExplainClose(value, target)) return null;
    return [
      `log base ${base} of x = ${power} means ${base}^${power} = x.`,
      `${base}^${power} = ${value}, so x = ${value}.`,
    ];
  }

  if (/log\(x\) \+ log\(y\)/.test(t)) {
    if (String(correct) !== "log(xy)") return null;
    return [
      "Adding two logs of the same base multiplies what is inside them.",
      "log(x) + log(y) = log(x \u00d7 y) = log(xy).",
    ];
  }

  const growth = t.match(/starts with (\d+) bacteria and (doubles|triples) every hour\. How many bacteria are there after (\d+) hours/i);
  if (growth) {
    const start = parseInt(growth[1], 10);
    const rate = growth[2].toLowerCase() === "doubles" ? 2 : 3;
    const hours = parseInt(growth[3], 10);
    const value = start * Math.pow(rate, hours);
    if (!qbExplainClose(value, target)) return null;
    return [
      `The colony ${growth[2].toLowerCase()} each hour, so multiply by ${rate} every hour.`,
      `After ${hours} hours the factor ${rate} is used ${hours} times: ${start} \u00d7 ${rate}^${hours} = ${start} \u00d7 ${Math.pow(rate, hours)} = ${value}.`,
    ];
  }

  const growthEval = t.match(/growth factor (\d+), evaluate (\d+)\^(\d+)/i);
  if (growthEval) {
    const base = parseInt(growthEval[1], 10);
    const same = parseInt(growthEval[2], 10);
    const power = parseInt(growthEval[3], 10);
    if (base !== same) return null;
    const value = Math.pow(base, power);
    if (!qbExplainClose(value, target)) return null;
    return [
      `The growth factor ${base} is multiplied in ${power} times.`,
      `${base}^${power} = ${value}.`,
    ];
  }

  const interest = t.match(/\$([\d,]+) is invested at ([\d.]+)% interest compounded annually for (\d+) years/i);
  if (interest) {
    const principal = parseFloat(interest[1].replace(/,/g, ""));
    const rate = parseFloat(interest[2]) / 100;
    const years = parseInt(interest[3], 10);
    const balance = principal * Math.pow(1 + rate, years);
    if (!qbExplainClose(Math.round(balance), target, 0.02)) return null;
    return [
      `Each year the balance is multiplied by 1 + ${qbExplainTidy(rate)} = ${(1 + rate).toFixed(2)}.`,
      `${qbExplainMoney(principal)} \u00d7 ${(1 + rate).toFixed(2)}^${years} = ${qbExplainMoney(balance)}, which rounds to ${qbExplainMoney(target)}.`,
    ];
  }

  const choose = t.match(/How many ways can you choose (\d+) students from a group of (\d+)/i);
  if (choose) {
    const pick = parseInt(choose[1], 10), from = parseInt(choose[2], 10);
    const fact = (n) => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };
    const value = fact(from) / (fact(pick) * fact(from - pick));
    if (!qbExplainClose(value, target)) return null;
    return [
      `Order does not matter, so use combinations: ${from}C${pick} = ${from}! \u00f7 (${pick}! \u00d7 ${from - pick}!).`,
      `${fact(from)} \u00f7 (${fact(pick)} \u00d7 ${fact(from - pick)}) = ${qbExplainTidy(value)}.`,
    ];
  }

  const permute = t.match(/How many different ways can (\d+) of (\d+) students line up/i);
  if (permute) {
    const pick = parseInt(permute[1], 10), from = parseInt(permute[2], 10);
    const value = from * (from - 1);
    if (pick !== 2 || !qbExplainClose(value, target)) return null;
    return [
      "Order matters, so the first place has " + from + " choices and the second has " + (from - 1) + ".",
      `${from} \u00d7 ${from - 1} = ${value} different line-ups.`,
    ];
  }

  const determinant = t.match(/determinant of the matrix \[\[(-?\d+), (-?\d+)\], \[(-?\d+), (-?\d+)\]\]/);
  if (determinant) {
    const a = parseInt(determinant[1], 10), b = parseInt(determinant[2], 10);
    const c = parseInt(determinant[3], 10), d = parseInt(determinant[4], 10);
    const value = a * d - b * c;
    if (!qbExplainClose(value, target)) return null;
    return [
      "For [[a, b], [c, d]] the determinant is ad \u2212 bc.",
      `(${a} \u00d7 ${d}) \u2212 (${b} \u00d7 ${c}) = ${a * d} \u2212 ${b * c} = ${value}.`,
    ];
  }

  const vector = t.match(/magnitude of the vector \(x, y\) = \((-?\d+), (-?\d+)\)/);
  if (vector) {
    const x = parseInt(vector[1], 10), y = parseInt(vector[2], 10);
    const value = Math.sqrt(x * x + y * y);
    if (!qbExplainClose(value, target)) return null;
    return [
      "Magnitude comes from the distance formula: \u221a(x\u00b2 + y\u00b2).",
      `\u221a(${x}\u00b2 + ${y}\u00b2) = \u221a(${x * x} + ${y * y}) = \u221a${x * x + y * y} = ${qbExplainTidy(value)}.`,
    ];
  }

  const limit = t.match(/limit as x approaches (-?\d+) of \(x\^2 - (\d+)\) \/ \(x - (-?\d+)\)/);
  if (limit) {
    const a = parseInt(limit[1], 10);
    const square = parseInt(limit[2], 10);
    if (square !== a * a || parseInt(limit[3], 10) !== a) return null;
    const value = 2 * a;
    if (!qbExplainClose(value, target)) return null;
    return [
      `Factor the top as a difference of squares: x\u00b2 \u2212 ${square} = (x \u2212 ${a})(x + ${a}).`,
      `The (x \u2212 ${a}) cancels: (x \u2212 ${a})(x + ${a}) \u00f7 (x \u2212 ${a}) = x + ${a}.`,
      `Now substitute x = ${a}: ${a} + ${a} = ${value}.`,
    ];
  }

  const rationalOne = t.match(/Simplify: \((\d+)x\^2\) \/ \((\d+)x\), for x not equal to 0/i);
  if (rationalOne) {
    if (rationalOne[1] !== rationalOne[2] || String(correct) !== "x") return null;
    return [
      `Divide the numbers: ${rationalOne[1]} \u00f7 ${rationalOne[2]} = 1.`,
      "Divide the powers of x: x\u00b2 \u00f7 x = x. So the simplified expression is x.",
    ];
  }

  const rationalTwo = t.match(/Simplify: \((\d+)x\^2 \+ (\d+)x\) \/ \((\d+)x\)/i);
  if (rationalTwo) {
    const a = parseInt(rationalTwo[1], 10);
    const b = parseInt(rationalTwo[2], 10);
    const c = parseInt(rationalTwo[3], 10);
    if (a !== c || b !== a * parseInt(String(correct).replace(/[^\d]/g, ""), 10) / a) return null;
    const constant = b / c;
    if (String(correct).replace(/\s+/g, "") !== `x+${constant}`) return null;
    return [
      `Split the fraction: (${a}x\u00b2 \u00f7 ${c}x) + (${b}x \u00f7 ${c}x).`,
      `${a}x\u00b2 \u00f7 ${c}x = x and ${b}x \u00f7 ${c}x = ${constant}, so the answer is x + ${constant}.`,
    ];
  }

  const complex = t.match(/Add the complex numbers: \((-?\d+) ([+-]) (\d+)i\) \+ \((-?\d+) ([+-]) (\d+)i\)/);
  if (complex) {
    const r1 = parseInt(complex[1], 10);
    const i1 = (complex[2] === "-" ? -1 : 1) * parseInt(complex[3], 10);
    const r2 = parseInt(complex[4], 10);
    const i2 = (complex[5] === "-" ? -1 : 1) * parseInt(complex[6], 10);
    const re = r1 + r2;
    const im = i1 + i2;
    const signed = (value) => (value < 0 ? `- ${Math.abs(value)}` : `+ ${value}`);
    const expected = `${re} ${signed(im)}i`;
    if (String(correct).replace(/\s+/g, "") !== expected.replace(/\s+/g, "")) return null;
    return [
      `Add the real parts: ${r1} + ${r2} = ${re}.`,
      `Add the imaginary parts: ${i1} + ${i2} = ${im}, so the total is ${re} ${signed(im)}i.`,
    ];
  }

  const sci = t.match(/Multiply and write in scientific notation: \((\d+) x 10\^(\d+)\) x \((\d+) x 10\^(\d+)\)/);
  if (sci) {
    const a = parseInt(sci[1], 10), e1 = parseInt(sci[2], 10);
    const b = parseInt(sci[3], 10), e2 = parseInt(sci[4], 10);
    const expected = `${a * b} x 10^${e1 + e2}`;
    if (String(correct) !== expected) return null;
    return [
      `Multiply the front numbers: ${a} \u00d7 ${b} = ${a * b}.`,
      `Add the exponents of 10: ${e1} + ${e2} = ${e1 + e2}.`,
      `Answer: ${a * b} x 10^${e1 + e2}.`,
    ];
  }

  if (/1 \+ tan\^2\(theta\)/.test(t)) {
    if (String(correct) !== "sec^2(theta)") return null;
    return [
      "Use the identity 1 + tan\u00b2\u03b8 = sec\u00b2\u03b8, which comes from dividing sin\u00b2\u03b8 + cos\u00b2\u03b8 = 1 by cos\u00b2\u03b8.",
      "So 1 + tan\u00b2(theta) = sec\u00b2(theta).",
    ];
  }

  return null;
}

// Geometry: angles, solids, similar shapes, slopes, midpoints and trigonometry.
function qbExplainGeometrySteps2(text, correct) {
  const target = qbExplainNumber(correct);
  const t = String(text);
  const lower = t.toLowerCase();
  const pi = 3.14;

  const triangleAngles = t.match(/triangle has angles of (\d+) degrees and (\d+) degrees.*?third angle/i);
  if (triangleAngles) {
    const a = parseInt(triangleAngles[1], 10), b = parseInt(triangleAngles[2], 10);
    const third = 180 - a - b;
    if (!qbExplainClose(third, target)) return null;
    return [
      "The angles in a triangle add to 180 degrees.",
      `${a} + ${b} = ${a + b}, so the third angle is 180 \u2212 ${a + b} = ${third} degrees.`,
    ];
  }

  const supplementary = t.match(/supplementary.*?(\d+) degrees/i);
  if (supplementary) {
    const a = parseInt(supplementary[1], 10);
    const other = 180 - a;
    if (!qbExplainClose(other, target)) return null;
    return [
      "Supplementary angles add to 180 degrees.",
      `180 \u2212 ${a} = ${other} degrees.`,
    ];
  }

  const complementary = t.match(/complementary.*?(\d+) degrees(?:.*?another measures (\d+) degrees)?/i);
  if (complementary) {
    const a = parseInt(complementary[1], 10);
    const b = complementary[2] ? parseInt(complementary[2], 10) : 0;
    const third = 90 - a - b;
    if (!qbExplainClose(third, target)) return null;
    return [
      "Complementary angles add to 90 degrees.",
      `90 \u2212 ${a}${b ? ` \u2212 ${b}` : ""} = ${third} degrees.`,
    ];
  }

  const interior = t.match(/each interior angle of a regular (\d+)-sided polygon/i);
  if (interior) {
    const n = parseInt(interior[1], 10);
    const total = (n - 2) * 180;
    const each = Math.round((total / n) * 10) / 10;
    if (!qbExplainClose(each, target, 0.05)) return null;
    return [
      `The interior angles of any ${n}-sided polygon add to (${n} \u2212 2) \u00d7 180 = ${total} degrees.`,
      `It is regular, so divide equally: ${total} \u00f7 ${n} = ${qbExplainTidy(total / n)}, which rounds to ${qbExplainTidy(each)}.`,
    ];
  }

  const sphere = t.match(/volume of a sphere with radius (\d+(?:\.\d+)?)/i);
  if (sphere) {
    const r = parseFloat(sphere[1]);
    const volume = (4 / 3) * Math.PI * r * r * r;
    if (!qbExplainClose(volume, target, 0.6)) return null;
    return [
      "Volume of a sphere is (4/3) \u00d7 \u03c0 \u00d7 r\u00b3.",
      `r\u00b3 = ${qbExplainTidy(r * r * r)}, so (4/3) \u00d7 \u03c0 \u00d7 ${qbExplainTidy(r * r * r)} = ${qbExplainTidy(volume)}, which rounds to ${qbExplainTidy(target)}.`,
    ];
  }

  const cone = t.match(/volume of a cone with radius (\d+(?:\.\d+)?) and height (\d+(?:\.\d+)?)/i);
  if (cone) {
    const r = parseFloat(cone[1]), h = parseFloat(cone[2]);
    const volume = (Math.PI * r * r * h) / 3;
    if (!qbExplainClose(volume, target, 0.6)) return null;
    return [
      "Volume of a cone is one third of the matching cylinder: (1/3) \u00d7 \u03c0 \u00d7 r\u00b2 \u00d7 h.",
      `\u03c0 \u00d7 ${qbExplainTidy(r)} \u00d7 ${qbExplainTidy(r)} = ${qbExplainTidy(Math.PI * r * r)}, then \u00d7 ${qbExplainTidy(h)} \u00f7 3 = ${qbExplainTidy(volume)}, which rounds to ${qbExplainTidy(target)}.`,
    ];
  }

  const prism = t.match(/volume of a rectangular prism with length (\d+(?:\.\d+)?), width (\d+(?:\.\d+)?), and height (\d+(?:\.\d+)?)/i);
  if (prism) {
    const l = parseFloat(prism[1]), w = parseFloat(prism[2]), h = parseFloat(prism[3]);
    const volume = l * w * h;
    if (!qbExplainClose(volume, target)) return null;
    return [
      "Volume of a rectangular prism is length \u00d7 width \u00d7 height.",
      `${qbExplainTidy(l)} \u00d7 ${qbExplainTidy(w)} = ${qbExplainTidy(l * w)}, then \u00d7 ${qbExplainTidy(h)} = ${qbExplainTidy(volume)}.`,
    ];
  }

  const cutout = t.match(/rectangle is (\d+(?:\.\d+)?) by (\d+(?:\.\d+)?)\. A (\d+(?:\.\d+)?) by (\d+(?:\.\d+)?) rectangle is cut out/i);
  if (cutout) {
    const l = parseFloat(cutout[1]), w = parseFloat(cutout[2]);
    const cl = parseFloat(cutout[3]), cw = parseFloat(cutout[4]);
    const area = l * w - cl * cw;
    if (!qbExplainClose(area, target)) return null;
    return [
      `Area of the whole rectangle: ${qbExplainTidy(l)} \u00d7 ${qbExplainTidy(w)} = ${qbExplainTidy(l * w)}.`,
      `Area of the corner piece: ${qbExplainTidy(cl)} \u00d7 ${qbExplainTidy(cw)} = ${qbExplainTidy(cl * cw)}.`,
      `Subtract the cut-out: ${qbExplainTidy(l * w)} \u2212 ${qbExplainTidy(cl * cw)} = ${qbExplainTidy(area)}.`,
    ];
  }

  const rectangleArea = t.match(/rectangle is (\d+(?:\.\d+)?) units long and (\d+(?:\.\d+)?) units wide\. What is its area/i);
  if (rectangleArea) {
    const l = parseFloat(rectangleArea[1]), w = parseFloat(rectangleArea[2]);
    const area = l * w;
    if (!qbExplainClose(area, target)) return null;
    return ["Area of a rectangle is length \u00d7 width.", `${qbExplainTidy(l)} \u00d7 ${qbExplainTidy(w)} = ${qbExplainTidy(area)}.`];
  }

  const polynomial = t.match(/Simplify: \(([^)]+)\) \+ \(([^)]+)\)/i);
  if (polynomial) {
    const left = qbExplainLinearSide(polynomial[1]);
    const right = qbExplainLinearSide(polynomial[2]);
    if (!left || !right) return null;
    const a = left.a + right.a;
    const b = left.b + right.b;
    const formatted = `${a}x ${b < 0 ? "-" : "+"} ${Math.abs(b)}`;
    if (String(correct).replace(/\s+/g, "") !== formatted.replace(/\s+/g, "")) return null;
    return [
      `Combine the x terms: ${qbExplainTidy(left.a)}x ${qbExplainSignText(right.a)}x = ${qbExplainTidy(a)}x.`,
      `Combine the numbers: ${qbExplainTidy(left.b)} ${qbExplainSignText(right.b)} = ${qbExplainTidy(b)}.`,
      `So the simplified expression is ${formatted}.`,
    ];
  }

  const parallelogram = t.match(/area of a parallelogram with base (\d+(?:\.\d+)?) and height (\d+(?:\.\d+)?)/i);
  if (parallelogram) {
    const b = parseFloat(parallelogram[1]), h = parseFloat(parallelogram[2]);
    const area = b * h;
    if (!qbExplainClose(area, target)) return null;
    return ["A parallelogram's area is base \u00d7 height.", `${qbExplainTidy(b)} \u00d7 ${qbExplainTidy(h)} = ${qbExplainTidy(area)}.`];
  }

  const triangleArea = t.match(/area of a triangle with base (\d+(?:\.\d+)?) and height (\d+(?:\.\d+)?)/i);
  if (triangleArea) {
    const b = parseFloat(triangleArea[1]), h = parseFloat(triangleArea[2]);
    const area = (b * h) / 2;
    if (!qbExplainClose(area, target)) return null;
    return [
      `Base \u00d7 height = ${qbExplainTidy(b)} \u00d7 ${qbExplainTidy(h)} = ${qbExplainTidy(b * h)}.`,
      `A triangle is half of that: ${qbExplainTidy(b * h)} \u00f7 2 = ${qbExplainTidy(area)}.`,
    ];
  }

  const leg = t.match(/hypotenuse of (\d+(?:\.\d+)?) and one leg of (\d+(?:\.\d+)?)/i);
  if (leg && /other leg/i.test(lower)) {
    const c = parseFloat(leg[1]), a = parseFloat(leg[2]);
    const b = Math.sqrt(c * c - a * a);
    if (!qbExplainClose(b, target)) return null;
    return [
      "Use a\u00b2 + b\u00b2 = c\u00b2 and rearrange for the missing leg: b\u00b2 = c\u00b2 \u2212 a\u00b2.",
      `${qbExplainTidy(c)}\u00b2 \u2212 ${qbExplainTidy(a)}\u00b2 = ${qbExplainTidy(c * c)} \u2212 ${qbExplainTidy(a * a)} = ${qbExplainTidy(c * c - a * a)}.`,
      `Take the square root: \u221a${qbExplainTidy(c * c - a * a)} = ${qbExplainTidy(b)}.`,
    ];
  }

  const similarSide = t.match(/side of ([\d/.]+) in the small triangle corresponds to a side of ([\d/.]+) in the large triangle\. If another side of the small triangle is ([\d/.]+)/i);
  if (similarSide) {
    const small = qbExplainValue(similarSide[1]);
    const large = qbExplainValue(similarSide[2]);
    const other = qbExplainValue(similarSide[3]);
    const want = qbExplainValue(correct);
    const answer = other * (large / small);
    if (!qbExplainClose(answer, want, 0.01)) return null;
    return [
      `Find the scale factor: ${qbExplainTidy(large)} \u00f7 ${qbExplainTidy(small)} = ${qbExplainTidy(large / small)}.`,
      `Multiply the matching small side by it: ${qbExplainTidy(other)} \u00d7 ${qbExplainTidy(large / small)} = ${qbExplainTidy(answer)}.`,
    ];
  }

  const similarArea = t.match(/similar triangles have side lengths in the ratio (\d+):(\d+)\. What is the ratio of their areas/i);
  if (similarArea) {
    const a = parseInt(similarArea[1], 10), b = parseInt(similarArea[2], 10);
    if (String(correct).replace(/\s+/g, "") !== `${a * a}:${b * b}`) return null;
    return [
      "Areas scale by the square of the side ratio.",
      `Square both sides of ${a}:${b}: ${a}\u00b2:${b}\u00b2 = ${a * a}:${b * b}.`,
    ];
  }

  const trig = t.match(/opposite side (\d+(?:\.\d+)?), adjacent side (\d+(?:\.\d+)?), and hypotenuse (\d+(?:\.\d+)?)[^.]*?(sine|cosine|tangent)/i);
  if (trig) {
    const opp = parseFloat(trig[1]), adj = parseFloat(trig[2]), hyp = parseFloat(trig[3]);
    const kind = trig[4].toLowerCase();
    const num = kind === "sine" ? opp : kind === "cosine" ? adj : opp;
    const den = kind === "tangent" ? adj : hyp;
    const reduced = qbExplainReduced(num, den);
    const answer = qbExplainFraction(correct);
    if (!answer || answer.num !== reduced.num || answer.den !== reduced.den) return null;
    const ratio = kind === "sine" ? "opposite \u00f7 hypotenuse" : kind === "cosine" ? "adjacent \u00f7 hypotenuse" : "opposite \u00f7 adjacent";
    return [
      `${kind.charAt(0).toUpperCase() + kind.slice(1)} is ${ratio}.`,
      `${qbExplainTidy(num)} \u00f7 ${qbExplainTidy(den)} = ${reduced.num}/${reduced.den}.`,
    ];
  }

  const unit = t.match(/(sine|cosine|tangent) of (\d+) degrees/i);
  if (unit) {
    const kind = unit[1].toLowerCase();
    const angle = parseInt(unit[2], 10);
    const table = {
      0: { sine: "0", cosine: "1", tangent: "0" },
      30: { sine: "1/2", cosine: "sqrt(3)/2", tangent: "sqrt(3)/3" },
      45: { sine: "sqrt(2)/2", cosine: "sqrt(2)/2", tangent: "1" },
      60: { sine: "sqrt(3)/2", cosine: "1/2", tangent: "sqrt(3)" },
      90: { sine: "1", cosine: "0", tangent: "undefined" },
    };
    const row = table[angle];
    if (!row) return null;
    if (String(correct).replace(/\s+/g, "") !== row[kind].replace(/\s+/g, "")) return null;
    return [
      `${angle} degrees is a special angle on the unit circle.`,
      `The ${kind} of ${angle} degrees is ${row[kind]}.`,
    ];
  }

  const midpoint = t.match(/midpoint of the segment from \((-?\d+(?:\.\d+)?), (-?\d+(?:\.\d+)?)\) to \((-?\d+(?:\.\d+)?), (-?\d+(?:\.\d+)?)\)/i);
  if (midpoint) {
    const x1 = parseFloat(midpoint[1]), y1 = parseFloat(midpoint[2]);
    const x2 = parseFloat(midpoint[3]), y2 = parseFloat(midpoint[4]);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const pair = String(correct).match(/\(\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*\)/);
    if (!pair || !qbExplainClose(mx, parseFloat(pair[1])) || !qbExplainClose(my, parseFloat(pair[2]))) return null;
    return [
      "A midpoint averages the two x-coordinates and the two y-coordinates.",
      `x: (${qbExplainTidy(x1)} + ${qbExplainTidy(x2)}) \u00f7 2 = ${qbExplainTidy(mx)}.`,
      `y: (${qbExplainTidy(y1)} + ${qbExplainTidy(y2)}) \u00f7 2 = ${qbExplainTidy(my)}.`,
    ];
  }

  const distance = t.match(/distance between the points \((-?\d+), (-?\d+)\) and \((-?\d+), (-?\d+)\)/i);
  if (distance) {
    const x1 = parseInt(distance[1], 10), y1 = parseInt(distance[2], 10);
    const x2 = parseInt(distance[3], 10), y2 = parseInt(distance[4], 10);
    const dx = x2 - x1, dy = y2 - y1;
    const value = Math.sqrt(dx * dx + dy * dy);
    if (!qbExplainClose(value, target)) return null;
    return [
      `Find the gaps: x changes by ${dx} and y changes by ${dy}.`,
      `Use the distance formula: \u221a(${dx}\u00b2 + ${dy}\u00b2) = \u221a(${dx * dx} + ${dy * dy}) = \u221a${dx * dx + dy * dy} = ${qbExplainTidy(value)}.`,
    ];
  }

  const slopePoints = t.match(/slope of the line through \((-?\d+), (-?\d+)\) and \((-?\d+), (-?\d+)\)/i);
  if (slopePoints) {
    const x1 = parseInt(slopePoints[1], 10), y1 = parseInt(slopePoints[2], 10);
    const x2 = parseInt(slopePoints[3], 10), y2 = parseInt(slopePoints[4], 10);
    if (x2 === x1) return null;
    const rise = y2 - y1, run = x2 - x1;
    const slope = rise / run;
    const want = qbExplainValue(correct);
    if (!qbExplainClose(slope, want)) return null;
    return [
      "Slope is rise over run: (y\u2082 \u2212 y\u2081) \u00f7 (x\u2082 \u2212 x\u2081).",
      `Rise: ${y2} \u2212 ${y1} = ${rise}. Run: ${x2} \u2212 ${x1} = ${run}.`,
      `Slope = ${rise} \u00f7 ${run} = ${qbExplainTidy(slope)}.`,
    ];
  }

  const slopeStandard = t.match(/slope of the line (-?\d*)x \+ (\d*)y = (\d+)/i);
  if (slopeStandard) {
    const a = slopeStandard[1] === "" ? 1 : parseInt(slopeStandard[1], 10);
    const b = slopeStandard[2] === "" ? 1 : parseInt(slopeStandard[2], 10);
    if (!b) return null;
    const slope = -a / b;
    if (!qbExplainClose(slope, qbExplainValue(correct))) return null;
    return [
      "Solve for y to read the slope: move the x term over and divide by the y coefficient.",
      `${b}y = ${slopeStandard[3]} \u2212 ${a}x, so y = ${slopeStandard[3]}/${b} \u2212 ${a}/${b} x.`,
      `The slope is \u2212${a}/${b}${Number.isInteger(slope) ? ` = ${slope}` : ""}.`,
    ];
  }

  const slopeIntercept = t.match(/In the equation y = (-?\d*)x ([+-]) (\d+), what is the slope/i);
  if (slopeIntercept) {
    const a = slopeIntercept[1] === "" ? 1 : parseInt(slopeIntercept[1], 10);
    if (!qbExplainClose(a, target)) return null;
    return [
      "In y = mx + b, the number multiplying x is the slope.",
      `In this equation that number is ${a}, so the slope is ${a}.`,
    ];
  }

  const lawCos = t.match(/triangle has sides ([\d.]+) and ([\d.]+) with a ([\d.]+) degree angle between them\. What is the length of the third side/i);
  if (lawCos) {
    const a = parseFloat(lawCos[1]), b = parseFloat(lawCos[2]), angle = parseFloat(lawCos[3]);
    const rad = (angle * Math.PI) / 180;
    const c = Math.sqrt(a * a + b * b - 2 * a * b * Math.cos(rad));
    if (!qbExplainClose(c, target, 0.06)) return null;
    return [
      "Use the law of cosines: c\u00b2 = a\u00b2 + b\u00b2 \u2212 2ab\u00b7cos C.",
      `${a}\u00b2 + ${b}\u00b2 = ${a * a + b * b}, and 2 \u00d7 ${a} \u00d7 ${b} \u00d7 cos ${angle}\u00b0 = ${qbExplainTidy(2 * a * b * Math.cos(rad))}.`,
      `c\u00b2 = ${qbExplainTidy(a * a + b * b - 2 * a * b * Math.cos(rad))}, so c = ${qbExplainTidy(c)}, which rounds to ${qbExplainTidy(target)}.`,
    ];
  }

  const special = t.match(/30-60-90 triangle the (hypotenuse|shorter leg) is (\d+(?:\.\d+)?) cm/);
  if (special) {
    const given = special[1];
    const value = parseFloat(special[2]);
    if (given === "hypotenuse") {
      const short = value / 2;
      if (!qbExplainClose(short, target)) return null;
      return [
        "In a 30-60-90 triangle the shorter leg is half the hypotenuse.",
        `${qbExplainTidy(value)} \u00f7 2 = ${qbExplainTidy(short)} cm.`,
      ];
    }
    const longer = Math.round(value * Math.sqrt(3) * 10) / 10;
    if (!qbExplainClose(longer, target, 0.06)) return null;
    return [
      "In a 30-60-90 triangle the longer leg is the shorter leg \u00d7 \u221a3.",
      `${qbExplainTidy(value)} \u00d7 1.732... = ${qbExplainTidy(longer)}, which rounds to ${qbExplainTidy(target)} cm.`,
    ];
  }

  return null;
}

const QB_EXPLAIN_TIPS = {
  Math: "Write down the numbers and what the question asks for: put together means add, take away means subtract, equal groups mean multiply, sharing out means divide. Work one step at a time and check by working backwards.",
  Reading: "Reread the sentence the question points to, then try each choice inside it. Only one will fit the meaning and the grammar.",
  Science: "Name the one idea the question is testing, rule out the choices that describe something else, then compare the last two on their exact words.",
  "Social Studies": "Picture the place and time the question is about, then rule out the choices that belong to another place, another era, or another group of people.",
};

function qbExplainQuestion(question, subject) {
  const text = String((question && question.question) || "");
  const correct = String((question && question.correct_text) || "");
  const target = qbExplainNumber(correct);
  let steps = null;

  steps = qbExplainFractionSteps(text, correct)
    || qbExplainProbabilitySteps(text, correct)
    || qbExplainPercentStorySteps(text, correct)
    || qbExplainEquationSteps(text, correct)
    || qbExplainSequenceSteps(text, correct)
    || qbExplainStatsSteps(text, correct)
    || qbExplainRatioSteps(text, correct)
    || qbExplainAlgebraSteps(text, correct)
    || qbExplainGeometrySteps2(text, correct)
    || qbExplainShapeSteps(text, target, correct)
    || qbExplainClockSteps(text, correct)
    || qbExplainElapsedSteps(text, correct)
    || qbExplainAngleSteps(text, correct)
    || qbExplainShadedSteps(text, correct)
    || qbExplainFractionCompareSteps(text, correct)
    || qbExplainBetterBuySteps(text, correct);

  if (!steps && isFinite(target)) {
    steps = qbExplainPercentSteps(text, target)
      || qbExplainCoinSteps(text, target)
      || qbExplainChangeSteps(text, target)
      || qbExplainExpressionSteps(text, target)
      || qbExplainSum(text, target)
      || qbExplainRemainderSteps(text, target)
      || qbExplainRoundingSteps(text, target)
      || qbExplainSciSteps(text, target)
      || qbExplainGeometrySteps(text, target)
      || qbExplainCoordSteps(text, target)
      || qbExplainTensSteps(text, target)
      || qbExplainAfterSteps(text, target)
      || qbExplainCountSteps(text, target)
      || qbExplainFactorSteps(text, target)
      || qbExplainLcmSteps(text, target)
      || qbExplainCompareSteps(text, target, correct)
      || qbExplainPattern(text, target)
      || (subject === "Math" ? qbExplainHunt(text, target) : null);
  }

  return {
    steps: steps || [],
    tip: steps && steps.length
      ? "Do the same steps in your head next time before you choose."
      : (QB_EXPLAIN_TIPS[subject] || QB_EXPLAIN_TIPS.Math),
  };
}

function qbExplainBodyHtml(question, subject) {
  const info = qbExplainQuestion(question, subject);
  const steps = info.steps.map(step => `<li>${escapeHtml(step)}</li>`).join("");
  return (steps ? `<ol class="fb-steps">${steps}</ol>` : "") + `<p class="fb-tip">${escapeHtml(info.tip)}</p>`;
}

function qbExplainBlockHtml(question, subject) {
  return `<div class="fb-explain"><div class="fb-explain-head">How to solve it</div>${qbExplainBodyHtml(question, subject)}</div>`;
}

function selectOption(button) {
  if (state.answerLocked || !button) return;
  state.pendingAnswer = button.dataset.value;
  document.querySelectorAll(".option-btn").forEach(el => {
    const isChosen = el === button;
    el.classList.toggle("is-selected", isChosen);
    el.setAttribute("aria-pressed", isChosen ? "true" : "false");
  });
  const submitBtn = document.getElementById("submitAnswerBtn");
  if (submitBtn) submitBtn.disabled = false;
}

function submitPendingAnswer() {
  if (state.answerLocked || state.pendingAnswer == null) return;
  checkAnswer(state.pendingAnswer);
}

function paintAnswer(q, selected, review) {
  const correct = q.correct_text;
  const isRight = selected === correct;

  document.querySelectorAll(".option-btn").forEach(btn => {
    btn.classList.remove("is-selected", "is-correct", "is-wrong", "is-dim");
    btn.disabled = true;
    if (btn.dataset.value === correct) {
      btn.classList.add("is-correct");
      btn.querySelector(".opt-mark").innerHTML = ICONS.check;
    } else if (btn.dataset.value === selected) {
      btn.classList.add("is-wrong");
      btn.querySelector(".opt-mark").innerHTML = ICONS.cross;
    } else {
      btn.classList.add("is-dim");
    }
  });

  const feedback = document.getElementById("feedback");
  feedback.className = "feedback " + (isRight ? "good" : "bad");
  feedback.innerHTML = isRight
    ? `<span class="fb-icon">${ICONS.check}</span><span>Correct${!review && state.streak > 2 ? ` \u00b7 ${state.streak} in a row!` : "!"}</span>`
    : `<span class="fb-icon">${ICONS.cross}</span><span>Not quite \u2014 the answer is <strong>${escapeHtml(correct)}</strong></span>${qbExplainBlockHtml(q, state.subject)}`;

  const isLast = state.currentIndex === state.questions.length - 1;
  const kbdHint = document.getElementById("kbdHint");
  if (kbdHint) {
    kbdHint.innerHTML = isLast
      ? "Press <kbd>Enter</kbd> to see your results"
      : "Press <kbd>Enter</kbd> for the next question";
  }
  return isRight;
}

function renderQuestionNav(answered) {
  const container = document.getElementById("nextBtnContainer");
  if (!container) return;
  container.innerHTML = "";
  container.classList.toggle("has-back", state.currentIndex > 0);

  if (state.currentIndex > 0) {
    const backBtn = document.createElement("button");
    backBtn.type = "button";
    backBtn.id = "prevBtn";
    backBtn.className = "btn-ghost prev-btn";
    backBtn.setAttribute("aria-label", "Go back to the previous question");
    backBtn.innerHTML = `${ICONS.arrow}<span>Previous</span>`;
    backBtn.addEventListener("click", previousQuestion);
    container.appendChild(backBtn);
  }

  if (answered) {
    const isLast = state.currentIndex === state.questions.length - 1;
    const nextBtn = document.createElement("button");
    nextBtn.type = "button";
    nextBtn.className = "btn-primary";
    nextBtn.innerHTML = isLast ? `See results ${ICONS.arrow}` : `Next ${ICONS.arrow}`;
    nextBtn.addEventListener("click", nextQuestion);
    container.appendChild(nextBtn);
    return;
  }

  const submitBtn = document.createElement("button");
  submitBtn.type = "button";
  submitBtn.id = "submitAnswerBtn";
  submitBtn.className = "btn-primary";
  submitBtn.disabled = state.pendingAnswer == null;
  submitBtn.innerHTML = `Submit ${ICONS.check}`;
  submitBtn.addEventListener("click", submitPendingAnswer);
  container.appendChild(submitBtn);
}

function previousQuestion() {
  if (state.currentIndex <= 0) return;
  state.currentIndex--;
  showQuestionScreen();
}

function checkAnswer(selected) {
  if (state.answerLocked) return;
  state.answerLocked = true;

  const q = state.questions[state.currentIndex];
  const correct = q.correct_text;
  const isRight = selected === correct;
  state.pendingAnswer = selected;
  state.answers[state.currentIndex] = { selected: selected, correct: isRight };

  if (isRight) {
    state.score++;
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    const streakChip = document.getElementById("streakChip");
    document.getElementById("streakValue").textContent = String(state.streak);
    streakChip.classList.remove("pulse");
    void streakChip.offsetWidth;
    streakChip.classList.add("pulse");
  } else {
    state.streak = 0;
    document.getElementById("streakValue").textContent = "0";
    state.missed.push({ question: q.question, correct: correct, chosen: selected });
  }

  noteAnswer(isRight);
  recordTopicAnswer(q, isRight);
  if (state.reviewMode) {
    markReviewResult(q, isRight);
  } else if (!isRight) {
    addToReviewPocket(q);
  }

  paintAnswer(q, selected, false);

  const progressFill = document.getElementById("progressFill");
  if (progressFill) progressFill.style.width = `${((state.currentIndex + 1) / state.questions.length) * 100}%`;

  saveCurrentQuiz(state.currentIndex + 1);
  renderQuestionNav(true);

  const nextBtn = document.getElementById("nextBtnContainer").querySelector(".btn-primary");
  if (nextBtn) nextBtn.focus({ preventScroll: true });
}

function nextQuestion() {
  state.currentIndex++;
  if (state.currentIndex < state.questions.length) {
    showQuestionScreen();
  } else {
    showResultsScreen();
  }
}

// ---- Confetti ---------------------------------------------------------------

function launchConfetti() {
  const palette = ["#4f8cff", "#8b6cf6", "#8de3c6", "#ffd166", "#ffb59e", "#ff8fa3"];
  const layer = document.createElement("div");
  layer.className = "confetti";
  for (let i = 0; i < 42; i++) {
    const piece = document.createElement("span");
    piece.style.left = `${Math.random() * 100}%`;
    piece.style.background = palette[i % palette.length];
    piece.style.animationDuration = `${2.4 + Math.random() * 2.2}s`;
    piece.style.animationDelay = `${Math.random() * 0.7}s`;
    piece.style.setProperty("--dx", `${(Math.random() - 0.5) * 220}px`);
    piece.style.width = `${5 + Math.random() * 6}px`;
    piece.style.height = `${9 + Math.random() * 9}px`;
    layer.appendChild(piece);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 5200);
}

// ---- Results screen ---------------------------------------------------------

function showLevelUpDialog(grade, atEnd) {
  if (document.querySelector(".modal-backdrop")) return;

  const label = GRADE_LABELS[grade] || `Grade ${grade}`;
  const message = atEnd
    ? `Your questions climbed to <strong>${escapeHtml(label)}</strong> level. Keep going and see how far you can reach!`
    : `Your questions just moved up to <strong>${escapeHtml(label)}</strong> level. Keep going!`;
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop level-up";
  backdrop.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="levelUpTitle">
      <div class="modal-emoji">\ud83d\ude80</div>
      <h2 class="modal-title" id="levelUpTitle">You leveled up!</h2>
      <p class="modal-text">${message}</p>
      <div class="modal-actions">
        <button class="btn-primary" id="levelUpBtn" type="button">Thanks!</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);

  const close = () => {
    document.removeEventListener("keydown", onKey);
    backdrop.remove();
  };
  const onKey = (event) => {
    if (event.key === "Escape" || event.key === "Enter") {
      event.preventDefault();
      close();
    }
  };

  document.getElementById("levelUpBtn").addEventListener("click", close);
  backdrop.addEventListener("click", (event) => {
    if (event.target === backdrop) close();
  });
  document.addEventListener("keydown", onKey);
  document.getElementById("levelUpBtn").focus({ preventScroll: true });
}

function maybeShowLevelUpDialog() {
  if (!document.querySelector(".screen.results")) return;
  if (state.promotedTo == null || state.startGrade == null) return;
  if (state.promotedTo <= state.startGrade) return;
  showLevelUpDialog(state.promotedTo, true);
}

function showResultsScreen() {
  clearApp();
  setDoodleAvailable(false);
  stopTimer();
  closeSavedDrawer();
  setSavedUiVisible(false);
  applyGradeTheme(state.grade);
  if (state.quizId) removeSavedQuiz(state.quizId);

  const total = state.questions.length;
  const percentage = total ? Math.round((state.score / total) * 100) : 0;
  const elapsed = state.startedAt ? Date.now() - state.startedAt : 0;

  let message;
  if (percentage === 100) message = "Perfect score \u2014 you got every single one right!";
  else if (percentage >= 80) message = "Amazing work! You really know this stuff.";
  else if (percentage >= 60) message = "Nice job! A little more practice and you will ace it.";
  else if (percentage >= 40) message = "Good try! Take a look at the ones you missed, then play again.";
  else message = "Great effort! Try a grade or two lower next time, then climb your way up.";

  const reviewHtml = state.missed.length
    ? `<div class="review-title">Worth another look</div>` + state.missed.map(item => `
        <div class="review-item">
          <div class="review-q">${escapeHtml(item.question)}</div>
          <div class="review-answers">
            Your answer: <span class="bad">${escapeHtml(item.chosen)}</span> &nbsp;&middot;&nbsp;
            Correct: <span class="good">${escapeHtml(item.correct)}</span>
          </div>
          <details class="review-why">
            <summary>How to solve it</summary>
            ${qbExplainBodyHtml({ question: item.question, correct_text: item.correct }, state.subject)}
          </details>
        </div>`).join("")
    : "";

  const topicStats = sessionTopicStats();
  const nextStop = pickNextStop(topicStats);
  const nextStopText = nextStop
    ? (nextStop.ratio === 1
      ? "Every answer on this topic was right. One more round makes it stick."
      : `You got ${nextStop.right} of ${nextStop.total} right on this topic. A short focused round will make it stick.`)
    : "";
  const nextStopHtml = nextStop && (nextStop.ratio < 1 || nextStop.strength < 100)
    ? `<div class="next-stop">
        <div class="next-stop-kicker">Next stop</div>
        <div class="next-stop-name">${escapeHtml(nextStop.label)}</div>
        <p class="next-stop-text">${nextStopText}</p>
        <button class="btn-primary" id="nextStopBtn" type="button">Practice this topic</button>
      </div>`
    : (topicStats.length ? `<p class="all-locked">${ICONS.star} Every topic in this quiz is locked in.</p>` : "");
  const pocketNote = !state.reviewMode && state.missed.length
    ? `<p class="pocket-note">${state.missed.length} missed question${state.missed.length === 1 ? "" : "s"} tucked into your review pocket for tomorrow.</p>`
    : "";

  const col = document.createElement("div");
  col.className = "screen results";
  col.innerHTML = `
    <div class="score-ring">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8de3c6"/>
            <stop offset="55%" stop-color="#4f8cff"/>
            <stop offset="100%" stop-color="#8b6cf6"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="50" cy="50" r="45"/>
        <circle class="ring-fill" id="ringFill" cx="50" cy="50" r="45"/>
      </svg>
      <div class="ring-center">
        <div class="ring-pct">${percentage}%</div>
        <div class="ring-sub">${state.score} / ${total} correct</div>
      </div>
    </div>

    <div>
      <h1 class="results-title">${percentage >= 80 ? "You did great!" : percentage >= 50 ? "Quiz complete!" : "Nice try!"}</h1>
      <p class="results-msg">${message}</p>
    </div>

    <div class="stat-grid">
      <div class="stat"><div class="stat-value">${state.score}</div><div class="stat-label">Correct</div></div>
      <div class="stat"><div class="stat-value">${state.missed.length}</div><div class="stat-label">Missed</div></div>
      <div class="stat"><div class="stat-value">${state.bestStreak}</div><div class="stat-label">Best streak</div></div>
      <div class="stat"><div class="stat-value">${formatTime(elapsed)}</div><div class="stat-label">Time</div></div>
    </div>

    ${nextStopHtml}

    ${reviewHtml ? `<div class="review">${reviewHtml}</div>` : ""}

    ${pocketNote}

    <div class="btn-row">
      <button class="btn-primary" id="playAgainBtn">Play again ${ICONS.arrow}</button>
      <button class="btn-ghost" id="resultsProgressBtn">My progress</button>
      <button class="btn-ghost" id="settingsBtn">Change settings</button>
    </div>
  `;
  app.appendChild(col);

  const ring = document.getElementById("ringFill");
  const offset = 283 - (283 * percentage) / 100;
  requestAnimationFrame(() => {
    setTimeout(() => { ring.style.strokeDashoffset = String(offset); }, 90);
  });

  if (percentage >= 50 && gradeTheme(state.grade) !== "senior") launchConfetti();
  // A popup from the last question should not hide the end-of-quiz one.
  document.querySelectorAll(".modal-backdrop.level-up").forEach(el => el.remove());
  setTimeout(maybeShowLevelUpDialog, 320);

  const nextStopBtn = document.getElementById("nextStopBtn");
  if (nextStopBtn && nextStop) {
    nextStopBtn.addEventListener("click", () => practiceTopic(nextStop.id));
  }

  const resultsProgressBtn = document.getElementById("resultsProgressBtn");
  if (resultsProgressBtn) {
    resultsProgressBtn.addEventListener("click", () => {
      progressView = { subject: state.subject, grade: state.grade != null ? state.grade : 1 };
      showProgressScreen();
    });
  }

  document.getElementById("playAgainBtn").addEventListener("click", () => {
    state.startGrade = state.grade;
    state.level = state.grade;
    state.answerLog = [];
    state.promotedTo = null;
    state.lastShiftAt = 0;
    state.reviewMode = false;
    state.questions = freshQuestions(state.subject, state.grade, state.count);
    state.currentIndex = 0;
    state.score = 0;
    state.streak = 0;
    state.bestStreak = 0;
    state.missed = [];
    state.answers = [];
    state.startedAt = Date.now();
    state.timerId = null;
    state.quizId = newQuizId();
    showQuestionScreen();
  });

  document.getElementById("settingsBtn").addEventListener("click", showSetupScreen);
}

// ---- Live widgets: clock, weather, world population, visit counter ----------

const POPULATION_BASE = 8200000000;              // UN estimate for 1 January 2025
const POPULATION_BASE_AT = Date.UTC(2025, 0, 1);
const POPULATION_PER_SECOND = 2.3;               // births minus deaths each second
const VISIT_ENDPOINT = "https://abacus.jasoncameron.dev";
const VISIT_NAMESPACE = "quizbookcentral";
const VISIT_KEY = "home";
const WEATHER_TIMEOUT_MS = 9000;
const WEATHER_CACHE_MS = 10 * 60 * 1000;
const WEATHER_ENDPOINT = "https://api.open-meteo.com/v1/forecast";
const PLACE_ENDPOINT = "https://api-bdc.io/data/reverse-geocode-client";

let weatherCache = null;

function estimatePopulation() {
  const seconds = (Date.now() - POPULATION_BASE_AT) / 1000;
  return Math.round(POPULATION_BASE + seconds * POPULATION_PER_SECOND);
}

// WMO weather codes used by Open-Meteo.

  53: ["Drizzle", "\ud83c\udf26\ufe0f"],
  55: ["Heavy drizzle", "\ud83c\udf26\ufe0f"],
  56: ["Freezing drizzle", "\ud83c\udf27\ufe0f"],
  57: ["Freezing drizzle", "\ud83c\udf27\ufe0f"],
  61: ["Light rain", "\ud83c\udf27\ufe0f"],
  63: ["Rain", "\ud83c\udf27\ufe0f"],
  65: ["Heavy rain", "\ud83c\udf27\ufe0f"],
