};

function weatherFromCode(code) {
  const entry = WEATHER_CODES[code];
  return entry ? { desc: entry[0], icon: entry[1] } : { desc: "Current weather", icon: "\ud83c\udf21\ufe0f" };
}

// Turn the coordinates into a town and country name for the tile's label.
async function fetchPlaceName(latitude, longitude, signal) {
  try {
    const query = new URLSearchParams({
      latitude: String(latitude),
      longitude: String(longitude),
      localityLanguage: "en",
    });
    const response = await fetch(`${PLACE_ENDPOINT}?${query}`, signal ? { signal: signal, cache: "no-store" } : { cache: "no-store" });
    if (!response.ok) return "Your area";
    const data = await response.json();
    const city = data.city || data.locality || data.principalSubdivision;
    const country = data.countryName;
    if (!city) return "Your area";
    return country ? `${city}, ${country}` : city;
  } catch (err) {
    return "Your area";
  }
}

function stopLiveTicker() {
  if (state.liveTimerId) {
    clearInterval(state.liveTimerId);
    state.liveTimerId = null;
  }
}

function startSetupLiveWidgets() {
  const clockEl = document.getElementById("liveClock");
  const populationEl = document.getElementById("livePopulation");
  if (!clockEl || !populationEl) return;

  const zoneEl = document.getElementById("liveZone");
  if (zoneEl) {
    const zoneRaw = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    zoneEl.textContent = zoneRaw ? zoneRaw.replace(/_/g, " ").split("/").pop() : "Local time";
  }

  const timeFormat = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const tick = () => {
    clockEl.textContent = timeFormat.format(new Date());
    populationEl.textContent = estimatePopulation().toLocaleString("en-US");
  };
  tick();
  stopLiveTicker();
  state.liveTimerId = setInterval(tick, 1000);

  loadVisitCount();
  renderWeather(weatherCache);

  const weatherTile = document.getElementById("weatherTile");
  if (weatherTile) weatherTile.addEventListener("click", requestWeather);
}

function renderWeather(cached) {
  const valueEl = document.getElementById("weatherValue");
  const labelEl = document.getElementById("weatherLabel");
  const emojiEl = document.getElementById("weatherEmoji");
  if (!valueEl || !labelEl) return;

  if (!cached) {
    valueEl.textContent = "Tap";
    labelEl.textContent = "Local weather";
    return;
  }
  if (emojiEl) emojiEl.textContent = cached.icon;
  valueEl.textContent = `${cached.tempC}\u00b0C \u00b7 ${cached.desc}`;
  valueEl.title = `About ${cached.tempF}\u00b0F`;
  labelEl.textContent = cached.place;
}

function requestWeather() {
  const tile = document.getElementById("weatherTile");
  const valueEl = document.getElementById("weatherValue");
  const labelEl = document.getElementById("weatherLabel");
  if (!tile) return;

  if (weatherCache && Date.now() - weatherCache.at < WEATHER_CACHE_MS) { renderWeather(weatherCache); return; }
  if (!window.navigator.geolocation || typeof fetch !== "function") {
    if (valueEl) valueEl.textContent = "\u2014";
    if (labelEl) labelEl.textContent = "No weather here";
    return;
  }

  tile.classList.add("is-loading");
  if (valueEl) valueEl.textContent = "\u2026";
  if (labelEl) labelEl.textContent = "Finding you";
  window.navigator.geolocation.getCurrentPosition(onWeatherPosition, onWeatherPositionError, {
    timeout: 10000,
    maximumAge: 600000,
  });
}

async function onWeatherPosition(position) {
  const { latitude, longitude } = position.coords;
  const tile = document.getElementById("weatherTile");
  const valueEl = document.getElementById("weatherValue");
  const labelEl = document.getElementById("weatherLabel");
  if (tile) tile.classList.remove("is-loading");
  if (valueEl) valueEl.textContent = "\u2026";

  const controller = typeof AbortController === "function" ? new AbortController() : null;
  const timer = setTimeout(() => { if (controller) controller.abort(); }, WEATHER_TIMEOUT_MS);
  try {
    const query = new URLSearchParams({
      latitude: latitude.toFixed(4),
      longitude: longitude.toFixed(4),
      current: "temperature_2m,apparent_temperature,weather_code",
      timezone: "auto",
    });
    const response = await fetch(`${WEATHER_ENDPOINT}?${query}`,
      controller ? { signal: controller.signal, cache: "no-store" } : { cache: "no-store" });
    if (!response.ok) throw new Error("weather request failed");
    const data = await response.json();
    const current = data && data.current;
    const tempC = Number(current && current.temperature_2m);
    if (!isFinite(tempC)) throw new Error("weather data missing");
    const code = Number(current.weather_code);
    const info = weatherFromCode(isFinite(code) ? code : -1);
    const place = await fetchPlaceName(latitude, longitude, controller ? controller.signal : null);
    weatherCache = {
      tempC: Math.round(tempC),
      tempF: Math.round((tempC * 9) / 5 + 32),
      desc: info.desc,
      icon: info.icon,
      place: place,
      at: Date.now(),
    };
    renderWeather(weatherCache);
  } catch (err) {
    if (valueEl) valueEl.textContent = "\u2014";
    if (labelEl) labelEl.textContent = "Try again";
  } finally {
    clearTimeout(timer);
  }
}

function onWeatherPositionError() {
  const tile = document.getElementById("weatherTile");
  const valueEl = document.getElementById("weatherValue");
  const labelEl = document.getElementById("weatherLabel");
  if (tile) tile.classList.remove("is-loading");
  if (valueEl) valueEl.textContent = "Off";
  if (labelEl) labelEl.textContent = "Location off";
}

function loadVisitCount() {
  const el = document.getElementById("liveVisits");
  if (!el) return;
  if (typeof fetch !== "function") { el.textContent = "\u2014"; return; }

  let counted = false;
  try { counted = window.sessionStorage.getItem("qb.visitCounted") === "1"; } catch (err) { /* storage blocked */ }

  const action = counted ? "get" : "hit";
  fetch(`${VISIT_ENDPOINT}/${action}/${VISIT_NAMESPACE}/${VISIT_KEY}`, { cache: "no-store" })
    .then(response => {
      if (!response.ok) throw new Error("counter failed");
      return response.json();
    })
    .then(data => {
      const value = Number(data && data.value);
      if (!isFinite(value)) throw new Error("counter value missing");
      el.textContent = value.toLocaleString("en-US");
      try { window.sessionStorage.setItem("qb.visitCounted", "1"); } catch (err) { /* storage blocked */ }
    })
    .catch(() => {
      el.textContent = "\u2014";
      el.title = "Visit counter is unavailable right now";
    });
}

// ---- Saved (unfinished) quizzes ---------------------------------------------

const SAVED_KEY = "quizbook.saved.v1";
const SAVED_TTL_MS = 30 * 24 * 60 * 60 * 1000;
const SAVED_LIMIT = 12;
let savedUiVisible = false;

function readSavedQuizzes() {
  try {
    const raw = window.localStorage.getItem(accountKey(SAVED_KEY));
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (err) {
    return [];
  }
}

function writeSavedQuizzes(list) {
  try { window.localStorage.setItem(accountKey(SAVED_KEY), JSON.stringify(list)); } catch (err) { /* storage full or blocked */ }
  scheduleSync();
}

// Returns saved quizzes newer than 30 days, dropping anything stale or finished.
// Storage is user-writable, so every restored question is checked before it can
// reach the DOM; anything malformed is dropped rather than trusted.
function isSafeQuestion(q) {
  return !!q
    && typeof q.question === "string" && q.question.length > 0 && q.question.length <= 600
    && typeof q.correct_text === "string" && q.correct_text.length > 0 && q.correct_text.length <= 300
    && Array.isArray(q.options)
    && q.options.length >= 2 && q.options.length <= 6
    && q.options.every(o => typeof o === "string" && o.length <= 300)
    && q.options.indexOf(q.correct_text) !== -1;
}

function loadSavedQuizzes() {
  const now = Date.now();
  const raw = readSavedQuizzes();
  const fresh = raw.filter(item => item
    && typeof item.savedAt === "number"
    && now - item.savedAt < SAVED_TTL_MS
    && Array.isArray(item.questions)
    && item.questions.length > 0
    && item.questions.length <= 100
    && item.questions.every(isSafeQuestion)
    && Number(item.currentIndex) > 0
    && Number(item.currentIndex) < item.questions.length);
  if (fresh.length !== raw.length) writeSavedQuizzes(fresh);
  return fresh;
}

function removeSavedQuiz(id) {
  if (!id) return;
  writeSavedQuizzes(loadSavedQuizzes().filter(item => item.id !== id));
  refreshSavedBadge();
}

function newQuizId() {
  return "q" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// `upToIndex` is how many questions are fully behind the player.
function saveCurrentQuiz(upToIndex) {
  if (!state.quizId || !Array.isArray(state.questions) || !state.questions.length) return;
  const index = typeof upToIndex === "number" ? upToIndex : state.currentIndex;
  if (index <= 0 || index >= state.questions.length) return;

  const entry = {
    id: state.quizId,
    subject: state.subject,
    grade: state.grade,
    questions: state.questions,
    currentIndex: index,
    score: state.score,
    streak: state.streak,
    bestStreak: state.bestStreak,
    missed: state.missed,
    startGrade: state.startGrade,
    level: state.level,
    answerLog: state.answerLog.slice(-20),
    answers: Array.isArray(state.answers) ? state.answers.map(a => a ? { selected: a.selected, correct: !!a.correct } : null) : [],
    promotedTo: state.promotedTo,
    lastShiftAt: state.lastShiftAt,
    focusTopic: state.focusTopic,
    reviewMode: state.reviewMode,
    planMode: state.planMode,
    elapsedMs: state.startedAt ? Date.now() - state.startedAt : 0,
    savedAt: Date.now(),
  };
  const list = loadSavedQuizzes().filter(item => item.id !== entry.id);
  list.unshift(entry);
  writeSavedQuizzes(list.slice(0, SAVED_LIMIT));
  refreshSavedBadge();
}

function timeAgo(ms) {
  const seconds = Math.max(0, Math.round(ms / 1000));
  if (seconds < 60) return "just now";
  const minutes = Math.round(seconds / 60);
  if (minutes < 60) return `${minutes} min ago`;
  const hours = Math.round(minutes / 60);
  if (hours < 24) return `${hours} ${hours === 1 ? "hour" : "hours"} ago`;
  const days = Math.round(hours / 24);
  return `${days} ${days === 1 ? "day" : "days"} ago`;
}

function mountSavedUi() {
  if (document.getElementById("savedFab")) return;

  const fab = document.createElement("button");
  fab.type = "button";
  fab.id = "savedFab";
  fab.className = "saved-fab is-hidden";
  fab.setAttribute("aria-label", "Open your saved quizzes");
  fab.innerHTML = `<span class="saved-fab-label">Saved</span><span class="saved-count" id="savedCount" hidden>0</span>${ICONS.arrow}`;
  fab.addEventListener("click", toggleSavedDrawer);
  document.body.appendChild(fab);

  const scrim = document.createElement("div");
  scrim.className = "saved-scrim";
  scrim.id = "savedScrim";
  scrim.addEventListener("click", closeSavedDrawer);
  document.body.appendChild(scrim);

  const drawer = document.createElement("aside");
  drawer.className = "saved-drawer";
  drawer.id = "savedDrawer";
  drawer.setAttribute("aria-label", "Saved quizzes");
  drawer.innerHTML = `
    <div class="saved-head">
      <div>
        <h2 class="saved-title">Saved quizzes</h2>
        <p class="saved-sub">Unfinished quizzes wait here for 30 days.</p>
      </div>
      <button class="saved-close" id="savedClose" type="button" aria-label="Close saved quizzes">${ICONS.cross}</button>
    </div>
    <div class="saved-list" id="savedList"></div>
  `;
  document.body.appendChild(drawer);

  document.getElementById("savedClose").addEventListener("click", closeSavedDrawer);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && drawer.classList.contains("is-open")) closeSavedDrawer();
  });
  refreshSavedBadge();
}

function setSavedUiVisible(visible) {
  savedUiVisible = visible;
  const fab = document.getElementById("savedFab");
  if (!fab) return;
  const drawer = document.getElementById("savedDrawer");
  const drawerOpen = drawer ? drawer.classList.contains("is-open") : false;
  fab.classList.toggle("is-hidden", !visible || drawerOpen);
}

function refreshSavedBadge() {
  const badge = document.getElementById("savedCount");
  const count = loadSavedQuizzes().length;
  if (badge) {
    badge.textContent = String(count);
    badge.hidden = count === 0;
  }
  const drawer = document.getElementById("savedDrawer");
  if (drawer && drawer.classList.contains("is-open")) renderSavedList();
}

function renderSavedList() {
  const listEl = document.getElementById("savedList");
  if (!listEl) return;

  const saved = loadSavedQuizzes();
  if (!saved.length) {
    listEl.innerHTML = `
      <div class="saved-empty">
        <span class="emoji">\ud83d\uddd2\ufe0f</span>
        No saved quizzes yet.<br>Leave a quiz before the last question and it will keep your place here for 30 days.
      </div>`;
    return;
  }

  listEl.innerHTML = saved.map(item => {
    const total = item.questions.length;
    const percent = Math.round((item.currentIndex / total) * 100);
    const gradeLabel = GRADE_LABELS[item.grade] || `Grade ${item.grade}`;
    return `
      <div class="saved-item">
        <div class="saved-item-title">${escapeHtml(item.subject)} &middot; ${gradeLabel}</div>
        <div class="saved-item-meta">${item.currentIndex} of ${total} answered &middot; ${item.score} correct</div>
        <div class="saved-mini-track"><div class="saved-mini-fill" style="width:${percent}%"></div></div>
        <div class="saved-item-meta">Saved ${timeAgo(Date.now() - item.savedAt)}</div>
        <div class="saved-actions">
          <button class="saved-resume" type="button" data-resume="${escapeHtml(item.id)}">Resume ${ICONS.arrow}</button>
          <button class="saved-remove" type="button" data-remove="${escapeHtml(item.id)}" aria-label="Remove this saved quiz">${ICONS.cross}</button>
        </div>
      </div>`;
  }).join("");

  listEl.querySelectorAll("[data-resume]").forEach(btn => {
    btn.addEventListener("click", () => resumeSavedQuiz(btn.dataset.resume));
  });
  listEl.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", () => {
      removeSavedQuiz(btn.dataset.remove);
      renderSavedList();
    });
  });
}

function openSavedDrawer() {
  const drawer = document.getElementById("savedDrawer");
  const scrim = document.getElementById("savedScrim");
  if (!drawer || !scrim) return;
  renderSavedList();
  drawer.classList.add("is-open");
  scrim.classList.add("is-open");
  setSavedUiVisible(savedUiVisible);
  document.getElementById("savedClose").focus({ preventScroll: true });
}

function closeSavedDrawer() {
  const drawer = document.getElementById("savedDrawer");
  const scrim = document.getElementById("savedScrim");
  if (!drawer) return;
  drawer.classList.remove("is-open");
  if (scrim) scrim.classList.remove("is-open");
  setSavedUiVisible(savedUiVisible);
}

function toggleSavedDrawer() {
  const drawer = document.getElementById("savedDrawer");
  if (!drawer) return;
  if (drawer.classList.contains("is-open")) closeSavedDrawer();
  else openSavedDrawer();
}

function resumeSavedQuiz(id) {
  const entry = loadSavedQuizzes().find(item => item.id === id);
  if (!entry) {
    renderSavedList();
    return;
  }

  closeSavedDrawer();
  stopTimer();

  state.quizId = entry.id;
  state.subject = entry.subject;
  state.grade = entry.grade;
  state.questions = entry.questions;
  state.count = entry.questions.length;
  state.startGrade = typeof entry.startGrade === "number" ? entry.startGrade : entry.grade;
  state.level = typeof entry.level === "number" ? entry.level : entry.grade;
  state.answerLog = Array.isArray(entry.answerLog) ? entry.answerLog.map(Boolean).slice(-20) : [];
  state.answers = Array.isArray(entry.answers) ? entry.answers.map(a => a && typeof a.selected === "string" ? { selected: a.selected, correct: !!a.correct } : null).slice(0, entry.questions.length) : [];
  state.promotedTo = typeof entry.promotedTo === "number" ? entry.promotedTo : null;
  state.lastShiftAt = typeof entry.lastShiftAt === "number" ? entry.lastShiftAt : 0;
  state.focusTopic = typeof entry.focusTopic === "string" ? entry.focusTopic : null;
  state.reviewMode = !!entry.reviewMode;
  state.planMode = !!entry.planMode;
  state.currentIndex = entry.currentIndex;
  state.score = entry.score || 0;
  state.streak = entry.streak || 0;
  state.bestStreak = entry.bestStreak || 0;
  state.missed = Array.isArray(entry.missed) ? entry.missed : [];
  state.startedAt = Date.now() - (entry.elapsedMs || 0);
  state.answerLocked = false;
  state.timerId = null;
  showQuestionScreen();
}

// ---- Drawing board (scratch pad for working out) ---------------------------

const doodle = { fab: null, panel: null, canvas: null, ctx: null, drawing: false, last: null, open: false, rect: null, pending: [], frame: 0 };

function buildDoodleBoard() {
  if (doodle.fab) return;

  const fab = document.createElement("button");
  fab.type = "button";
  fab.className = "draw-fab";
  fab.id = "drawFab";
  fab.hidden = true;
  fab.setAttribute("aria-expanded", "false");
  fab.setAttribute("aria-controls", "drawPanel");
  fab.innerHTML = `${ICONS.pencil}<span class="draw-fab-label">Draw</span>`;

  const panel = document.createElement("section");
  panel.className = "draw-panel";
  panel.id = "drawPanel";
  panel.hidden = true;
  panel.setAttribute("aria-label", "Drawing board");
  panel.innerHTML = `
    <div class="draw-head">
      <span class="draw-title">${ICONS.pencil} Drawing board</span>
      <div class="draw-actions">
        <button type="button" class="draw-btn" id="drawClear">Clear</button>
        <button type="button" class="draw-btn draw-close" id="drawClose" aria-label="Close the drawing board">${ICONS.cross}</button>
      </div>
    </div>
    <canvas class="draw-canvas" id="drawCanvas" aria-label="Scratch pad for working out"></canvas>
  `;

  document.body.appendChild(panel);
  document.body.appendChild(fab);

  doodle.fab = fab;
  doodle.panel = panel;
  doodle.canvas = panel.querySelector("#drawCanvas");

  fab.addEventListener("click", () => toggleDoodle(!doodle.open));
  panel.querySelector("#drawClear").addEventListener("click", clearDoodle);
  panel.querySelector("#drawClose").addEventListener("click", () => toggleDoodle(false));

  const canvas = doodle.canvas;
  const pointAt = (event) => {
    const rect = doodle.rect || canvas.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  };

  // Draw once per frame from all the points the pointer reported, instead of
  // stroking every raw pointermove. This keeps high-rate touch screens smooth.
  const flushStroke = () => {
    doodle.frame = 0;
    const ctx = doodle.ctx;
    const points = doodle.pending;
    doodle.pending = [];
    if (!ctx || !points.length || !doodle.last) return;
    ctx.beginPath();
    ctx.moveTo(doodle.last.x, doodle.last.y);
    for (let i = 0; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.stroke();
    doodle.last = points[points.length - 1];
  };

  canvas.addEventListener("pointerdown", (event) => {
    if (!doodle.ctx) return;
    event.preventDefault();
    doodle.rect = canvas.getBoundingClientRect();
    doodle.drawing = true;
    doodle.pending = [];
    doodle.last = pointAt(event);
    if (canvas.setPointerCapture) canvas.setPointerCapture(event.pointerId);
    const ctx = doodle.ctx;
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath();
    ctx.arc(doodle.last.x, doodle.last.y, ctx.lineWidth / 2, 0, Math.PI * 2);
    ctx.fill();
  });

  canvas.addEventListener("pointermove", (event) => {
    if (!doodle.drawing || !doodle.ctx) return;
    event.preventDefault();
    const raw = event.getCoalescedEvents ? event.getCoalescedEvents() : null;
    const events = raw && raw.length ? raw : [event];
    for (let i = 0; i < events.length; i++) doodle.pending.push(pointAt(events[i]));
    if (!doodle.frame) doodle.frame = requestAnimationFrame(flushStroke);
  });

  const endStroke = (event) => {
    if (!doodle.drawing) return;
    doodle.drawing = false;
    flushStroke();
    doodle.last = null;
    doodle.rect = null;
    if (canvas.releasePointerCapture && canvas.hasPointerCapture && canvas.hasPointerCapture(event.pointerId)) {
      canvas.releasePointerCapture(event.pointerId);
    }
  };
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);
  canvas.addEventListener("pointerleave", endStroke);
}

function sizeDoodleCanvas() {
  const canvas = doodle.canvas;
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const dpr = window.devicePixelRatio || 1;
  const width = Math.round(rect.width * dpr);
  const height = Math.round(rect.height * dpr);
  if (canvas.width === width && canvas.height === height && doodle.ctx) return;
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineWidth = 3.2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#1c2b4f";
  doodle.ctx = ctx;
}

function clearDoodle() {
  if (!doodle.ctx) return;
  const ctx = doodle.ctx;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, doodle.canvas.width, doodle.canvas.height);
  ctx.restore();
}

function toggleDoodle(open) {
  buildDoodleBoard();
  doodle.open = !!open;
  doodle.drawing = false;
  doodle.last = null;
  doodle.panel.hidden = !doodle.open;
  doodle.fab.classList.toggle("is-open", doodle.open);
  doodle.fab.setAttribute("aria-expanded", String(doodle.open));
  doodle.rect = null;
  doodle.pending = [];
  document.body.classList.toggle("doodle-open", doodle.open);
  if (doodle.open) requestAnimationFrame(sizeDoodleCanvas);
}

function setDoodleAvailable(available) {
  buildDoodleBoard();
  doodle.fab.hidden = !available;
  if (!available && doodle.open) toggleDoodle(false);
}

// ---- Utility ---------------------------------------------------------------

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

// ---- Boot ------------------------------------------------------------------

mountSavedUi();
showSplashScreen();

</script>
